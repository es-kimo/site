# =============================================================================
# Interview Stories — 면접용 스토리 구조화
# =============================================================================
# 구조:
# - 경험(story) 단위로 최상위 정리
# - 각 경험에서 나올 수 있는 면접 질문-답변이 questions 배열에 위치
# - 답변은 결론→이유→사례→회고 형식 (면접에서 바로 말할 수 있도록)
# - technicalDeepDives, alternativesConsidered는 세부 참고 자료
# - tags로 질문 유형별 빠른 검색 (끈기, 디버깅, 협업, 설계 등)
# - relatedProject로 이력서 항목과 연결
# =============================================================================

stories:
  # ===========================================================================
  # 태블릿 ECG 그래프 터치 인터랙션 시스템
  # ===========================================================================
  - id: "ecg-tablet-touch-system"
    tags: ["끈기", "디버깅", "설계", "인터랙션", "상태-관리", "React-d3-연동", "라이브러리-내부-추적", "관심사-분리"]
    relatedProject: "ecg-ruler-tablet"
    title: "태블릿 ECG 그래프 터치 인터랙션 시스템"

    questions:
      # ── Q1 ──────────────────────────────────────────────────────────────────
      - q: "이 프로젝트에서 가장 어려웠던 점은?"
        conclusion: >
          터치 하나로 시작되는 5가지 동작을, 시작 시점에 구분할 수 없다는 것이 가장 어려웠습니다.
        reason: >
          데스크톱에서는 마우스 클릭과 스크롤, 키보드가 물리적으로 다른 입력이라 자연스레 구분되는데,
          태블릿에서는 점 생성도, 줌도, 정밀 측정도, 버튼 드래그도 전부 손가락 터치 하나입니다.
        example: >
          그래서 시작 시점에 판별하는 대신, 후속 이벤트에서 상태를 전이하는 구조를 만들었습니다.
          `Ruler → PreciseMeasurement`은 800ms 홀드,
          `Ruler → Zoom`은 이동량 초과나 멀티터치, 이런 식으로요.
          모든 포인터 핸들러가 현재 상태를 기준으로 분기하고, 스스로 다음 상태로 전이합니다.
        retrospective: >
          결과적으로 이 상태 기반 분기 구조 덕분에, 이후 캘리퍼 드래그나 버튼 그룹 같은 기능을 추가할 때
          상태만 하나 추가하면 기존 동작에 영향 없이 확장할 수 있었습니다.
          다만 switch문이 모든 핸들러에 퍼져 있어서, 상태가 더 많아지면 XState 같은 명시적 상태 머신으로
          전이 규칙을 한 곳에 모으는 게 나았을 거라고 봅니다.

      # ── Q2 ──────────────────────────────────────────────────────────────────
      - q: "d3-zoom과 충돌이 있었다고 했는데, 구체적으로?"
        conclusion: >
          filter로 이벤트를 막는 것만으로는 부족했습니다.
          d3의 **내부 transform 상태가 오염되는 문제**가 별도로 있었습니다.
        reason: >
          d3-zoom은 자체적으로 pan/pinch를 처리하면서 내부에 transform을 누적합니다.
          filter로 이벤트를 차단해도, 정밀 측정 중 손가락의 미세한 움직임이 d3 내부 transform에 반영되어,
          측정이 끝나면 화면 위치가 밀려 있었습니다.
        example: >
          zoom `start` 시점에 현재 transform을 저장하고,
          `zoom` 이벤트에서 정밀 측정 상태이면 적용을 건너뛰고,
          `end` 시점에 저장된 transform으로 d3의 내부 상태를 강제 복원하는 방식을 적용했습니다.
          이때 정밀 측정 여부를 d3의 이벤트 콜백 안에서 읽어야 해서,
          React state가 아닌 ref로 양쪽 시스템을 연결했습니다.
        retrospective: >
          d3를 아예 끄고 직접 zoom/pan을 구현하는 방법도 가능했지만,
          d3-zoom이 관성 스크롤이나 pinch 처리를 이미 잘 해주고 있었기 때문에,
          교체보다는 공존시키면서 충돌 지점만 보정하는 전략을 택했습니다.

      # ── Q3 ──────────────────────────────────────────────────────────────────
      - q: "상태 관리를 왜 useRef로 했나요? useState면 안 되나요?"
        conclusion: >
          이벤트 핸들러 간 **동기적 읽기/쓰기가 보장되어야 했기 때문**입니다.
        reason: >
          `handlePointerDown`에서 상태를 `Zoom`으로 바꾸고, 같은 터치 사이클의
          `handlePointerMove`에서 바로 그 값을 읽어야 합니다.
          useState는 배치 업데이트되므로 다음 렌더까지 이전 값이 유지됩니다.
          터치 이벤트가 프레임 단위로 발생하는 상황에서 한 프레임의 지연도 잘못된 분기로 이어집니다.
        example: >
          추가로, d3-zoom의 filter 함수는 React 렌더 사이클 바깥에서 호출되기 때문에,
          최신 상태를 동기적으로 읽을 수 있는 ref여야만 했습니다.
          두 시스템을 잇는 다리 역할까지 ref가 맡은 셈입니다.
        retrospective: >
          다만 ref의 단점은 변경이 추적되지 않는다는 것입니다.
          디버깅할 때 "언제 누가 이 값을 바꿨는지" 찾기 어렵습니다.
          지금은 상태가 5개라 관리가 가능했지만, 더 복잡해지면 상태 전이를 로깅하는 래퍼를 씌우거나,
          명시적 상태 머신 라이브러리로 전환하는 게 맞다고 봅니다.

      # ── Q4 ──────────────────────────────────────────────────────────────────
      - q: "여러 인터랙션이 동시에 발생하면 어떻게 처리했나요?"
        conclusion: >
          하나의 공유 제어 상태(Ref)를 두고, 모든 인터랙션 레이어가 이 값을 읽어
          자기 동작의 실행 여부를 결정하는 구조를 만들었습니다.
        reason: >
          ECG 그래프에는 d3-zoom이 관리하는 줌 레이어와 React가 관리하는 측정 레이어가 있는데,
          같은 터치 이벤트가 두 레이어에 모두 전달됩니다.
          한쪽이 활성인 동안 다른 쪽이 반응하면 화면이 의도치 않게 움직이거나 측정이 끊깁니다.
        example: >
          5개 상태(`Ruler`, `Zoom`, `PreciseMeasurement`, `ButtonDragging`, `RulerOff`)를
          하나의 Ref에 담아 Context로 공유했습니다.
          줌 레이어의 filter에서는 `ButtonDragging`이면 줌을 거부하고,
          zoom 콜백에서는 `PreciseMeasurement`면 적용을 건너뜁니다.
          드래그처럼 짧은 행동은 시작 시 이전 상태를 저장하고, 종료 시 복원하는
          "트랜잭션 격리" 패턴을 적용했습니다.
        retrospective: >
          데스크톱에서는 boolean 하나(`isRulerActive`)로 충분했지만,
          태블릿에서는 양방향 5상태가 필요했습니다.
          이 구조 덕분에 새 인터랙션을 추가할 때 상태 하나와 게이트 조건만 추가하면 되지만,
          상태 수가 더 늘어나면 전이 규칙을 명시적으로 선언하는 상태 머신이 더 적합할 것 같습니다.

      # ── Q5 ──────────────────────────────────────────────────────────────────
      - q: "드래그 기능을 플랫폼별로 어떻게 분리했나요?"
        conclusion: >
          드래그 메커니즘과 플랫폼별 인터랙션 정책을 레이어로 분리했습니다.
          base 훅이 순수한 드래그 동작을, mobile 래퍼가 플랫폼 고유 정책을 담당합니다.
        reason: >
          드래그 가능한 요소가 늘어나면서, 요소마다 이벤트 등록·해제, `isDragging` 관리,
          "드래그 중 다른 인터랙션 제어", "지금 드래그 가능한 상태인가" 판단이 뒤섞이고 있었습니다.
          이 중 첫 번째만 플랫폼 공통이고, 나머지는 태블릿에서만 필요했습니다.
        example: >
          base 훅(`useDraggableLifecycle`)은 `isDragging` 상태 관리와 capture 단계 이벤트 등록만 합니다.
          mobile 래퍼가 이 훅을 감싸면서 드래그 시작 시 공유 상태를 `ButtonDragging`으로 전환하고,
          종료 시 복원하며, `checkDraggable` 콜백으로 "지금 드래그 허용 상태인지"를 주입합니다.
          정책을 `Set`으로 데이터화해서, 새 상태가 추가되면 Set만 수정하면 됩니다.
        retrospective: >
          데스크톱 코드를 수정하지 않고 태블릿 지원을 추가할 수 있었고,
          새 드래그 요소를 추가할 때 기존 인터랙션 코드를 건드릴 필요가 없었습니다.
          다만 래퍼 레이어가 깊어지면 호출 순서를 파악하기 어려울 수 있어,
          훅 체인이 3단계를 넘긴다면 합성 패턴을 재고해야 할 것 같습니다.

      # ── Q6 ──────────────────────────────────────────────────────────────────
      - q: "이 구현에서 아쉬운 점이나, 다시 한다면?"
        conclusion: >
          두 가지입니다. JSX를 상태에 직접 저장한 점과, switch문이 핸들러마다 반복되는 점.
        example: >
          지금은 `useState<Ruler[]>`에 `JSX.Element`을 직접 저장하고 있는데,
          데이터(좌표, id, 타입)만 저장하고 렌더 시점에 JSX로 변환했다면 삭제·수정 로직이 더 단순했을 겁니다.
          또 상태 전이가 4개 핸들러의 switch문에 분산되어 있어서,
          상태가 하나 추가되면 모든 핸들러를 감사해야 합니다.
        retrospective: >
          당시에는 5개 상태, 4개 핸들러 규모에서 이 정도면 충분히 관리할 수 있다고 판단했고,
          실제로 시나리오 테스트 20건 이상 통과, 오입력 리포트 0건이라는 결과가 나왔습니다.
          다시 한다면 데이터와 뷰를 분리하고, 상태 전이 규칙을 한 곳에 선언적으로 모으는 방식으로
          리팩터링할 것 같습니다.

    # =========================================================================
    # Ownership
    # =========================================================================
    ownership:
      - "d3-zoom 소스코드를 직접 읽어 __zoom 갱신 시점과 콜백 호출 시점의 순서를 확인"
      - "시간(800ms) × 이동량(10px) × 터치 수 기반 3축 판별 구조 설계"
      - "5상태 양방향 Ref 구조 재설계 (데스크톱 단방향 boolean에서)"
      - "드래그 메커니즘(base)과 인터랙션 정책(mobile wrapper) 관심사 분리 설계"
      - "capture 단계 이벤트 등록을 통한 드래그 우선권 확보 전략"
      - "실기기(iPad, Android Tablet) 테스트 기반 임계값 튜닝"
      - "zoom start/end 시점 transform 저장·복원 설계"
      - "useRef 기반 React–d3 상태 동기화"

    # =========================================================================
    # Technical Deep Dives — 세부 참고 자료
    # =========================================================================
    technicalDeepDives:
      # ── Deep Dive 1 ──────────────────────────────────────────────────────────
      - title: "d3-zoom 내부 __zoom 갱신 구조와 transform 복원"
        summary: |
          d3-zoom은 DOM 엘리먼트의 __zoom 프로퍼티에 현재 transform을 저장한다.
          핵심은 Gesture.prototype.zoom 메서드에서 __zoom 갱신이 사용자 콜백 emit보다 먼저 일어난다는 점이다.
          이 구조 때문에 콜백에서 동작을 건너뛰어도 d3 내부 상태는 이미 오염된다.
        steps:
          - title: "__zoom 갱신 시점 — Gesture.prototype.zoom"
            insight: |
              this.that.__zoom = transform이 this.emit('zoom')보다 먼저 실행된다.
              즉 사용자 콜백이 호출되는 시점에 DOM의 __zoom은 이미 새 값으로 덮어씌워진 상태다.
            code: |
              // d3-zoom/src/zoom.js — Gesture.prototype.zoom
              zoom: function(key, transform) {
                  if (this.mouse && key !== "mouse") this.mouse[1] = transform.invert(this.mouse[0]);
                  if (this.touch0 && key !== "touch") this.touch0[1] = transform.invert(this.touch0[0]);
                  if (this.touch1 && key !== "touch") this.touch1[1] = transform.invert(this.touch1[0]);
                  this.that.__zoom = transform;   // ← 여기서 먼저 갱신
                  this.emit("zoom");              // ← 그 다음에 사용자 콜백 호출
                  return this;
              }

          - title: "mousemoved / touchmoved에서 매 프레임 호출"
            insight: |
              mousemoved와 touchmoved는 매 포인터 이동마다 새 transform을 계산하고
              g.zoom()을 호출한다. 사용자 콜백과 무관하게 __zoom이 매 프레임 갱신된다.
            code: |
              // d3-zoom/src/zoom.js — mousemoved
              function mousemoved(event) {
                  noevent(event);
                  g.event(event)
                   .zoom("mouse", constrain(translate(g.that.__zoom, g.mouse[0] = pointer(event, currentTarget), g.mouse[1]), g.extent, translateExtent));
              }

          - title: "filter의 한계 — 제스처 시작 후에는 체크 안 함"
            insight: |
              filter는 mousedown/touchstart 진입부에서만 평가된다.
              한번 제스처가 시작되면 이후 mousemoved/touchmoved에서는 filter를 다시 확인하지 않는다.
              PreciseMeasurement는 터치 시작 후 홀드 시간으로 판별되므로, filter 시점에는 아직 결정되지 않은 상태다.

          - title: "세 개 레이어의 독립성"
            insight: |
              d3 내부 상태(__zoom), React 상태(ZoomContext), 화면 렌더링은 서로 독립적이다.
              PreciseMeasurement에서 콜백을 early return하면 React 상태와 화면은 안 바뀌지만,
              __zoom은 매 프레임 누적된다.
              제스처 종료 후 다음 동작은 누적된 __zoom을 기준으로 시작하므로 화면이 밀린다.
            layerBehavior:
              d3Internal: "매 프레임 갱신됨 (콜백과 무관)"
              reactState: "갱신 안 됨 (setZoomContext 호출 건너뜀)"
              rendering: "변화 없음 (React 상태가 안 바뀌어서)"

      # ── Deep Dive 2 ──────────────────────────────────────────────────────────
      - title: "지연 판별의 3축 구조: 시간 × 이동량 × 터치 수"
        summary: |
          핵심 아이디어는 "터치 시작 시 의도를 결정하지 않는다"는 것이다.
          Ruler 상태로 진입한 뒤, 시간·이동량·터치 수라는 세 가지 축의 후속 이벤트를 관찰하여
          상태를 전이한다. 각 축은 독립적으로 평가되며, 가장 먼저 임계값을 넘는 축이 의도를 결정한다.
        steps:
          - title: "pointerdown — 의도를 결정하지 않고 대기"
            insight: |
              터치 시작 시 startTime, startX, startY를 저장하고, 800ms 타이머를 건다.
              이 시점에서 상태는 그대로 Ruler다. 아직 아무것도 결정하지 않았다.
              멀티터치(!e.isPrimary)인 경우에만 즉시 Zoom으로 전환한다.
            code: |
              // useRuler.Mobile.tsx — handlePointerDown
              case ComponentControlState.Ruler: {
                  if (!e.isPrimary) {
                      invalidatePointerData(e.pointerId);
                      componentControlState.current = ComponentControlState.Zoom;
                      break;
                  }
                  const startTime = Date.now();
                  const timer = setTimeout(() => {
                      doPreciseMeasure(e);
                  }, LONG_PRESS_THRESHOLD_MS);
                  const startX = e.clientX;
                  const startY = e.clientY;
                  addPointerData(e.pointerId, { startTime, timer, startX, startY });
                  break;
              }

          - title: "pointermove — 이동량 초과 시 Zoom 전이"
            insight: |
              pointermove에서 startX/startY와 현재 위치의 차이가 10px를 넘으면 Zoom으로 전이한다.
              "빠르게 움직이는 손가락 = 줌/팬 의도"라는 가정이 이 임계값 하나에 담겨 있다.
            code: |
              // useRuler.Mobile.tsx — handlePointerMove
              case ComponentControlState.Ruler: {
                  const { pointerData } = validatePointerData(e.pointerId);
                  if (pointerData) {
                      const hasPointerMoved = [
                          [pointerData.startX ?? e.clientX, e.clientX],
                          [pointerData.startY ?? e.clientY, e.clientY],
                      ].some(([prev, curr]) => Math.abs(curr - prev) > ZOOM_ACTION_THRESHOLD_PX);
                      if (hasPointerMoved) {
                          componentControlState.current = ComponentControlState.Zoom;
                      }
                  }
              }

          - title: "800ms 홀드 완료 → PreciseMeasurement"
            insight: |
              800ms 동안 10px 이상 움직이지도 않고, 손가락을 떼지도 않으면
              setTimeout 콜백(doPreciseMeasure)이 실행된다.
              포인터 좌표에 해당하는 ECG 데이터가 있으면 PreciseMeasurement로 전이하고,
              정밀 측정 가이드를 화면에 그린다.

          - title: "pointerup — 최종 행동 결정"
            insight: |
              Ruler 상태에서 pointerup이 오면, 800ms 전에 손가락을 뗀 것이므로 일반 측정이다.
              그래프 근방을 터치했으면 측정점을 생성하고, 아니면 여백 터치로 처리한다.
              PreciseMeasurement 상태에서 pointerup이 오면, 정밀 측정 완료로 측정점을 생성한다.

      # ── Deep Dive 3 ──────────────────────────────────────────────────────────
      - title: "공유 제어 상태와 트랜잭션 격리"
        summary: |
          핵심은 "누가 지금 활성인가"를 하나의 Ref로 표현하고,
          모든 레이어가 이 Ref를 읽어 자기 동작을 게이트하는 구조다.
          Ref를 쓰는 이유는 d3 이벤트 콜백이 React 렌더 사이클 바깥에서 실행되기 때문이다.
        steps:
          - title: "ComponentControlContext — 5개 상태 Ref"
            insight: |
              5개 상태를 하나의 Ref에 담아 Context로 공유한다.
              isMobile일 때만 componentControlState가 활성화되고,
              데스크톱에서는 null이 되어 기존 isRulerActive 기반 로직이 그대로 동작한다.
            code: |
              export const ComponentControlState = {
                  Ruler: 'ruler',
                  Zoom: 'zoom',
                  RulerOff: 'rulerOff',
                  PreciseMeasurement: 'preciseMeasurement',
                  ButtonDragging: 'buttonDragging',
              } as const;

          - title: "줌 레이어가 제어 상태를 읽는 방식"
            insight: |
              ZoomProvider는 두 곳에서 componentControlState를 읽는다:
              (1) filter — ButtonDragging이면 줌 자체를 거부한다.
              (2) zoom 콜백 — PreciseMeasurement면 setZoomContext를 건너뛴다.
              두 곳의 역할이 다르다: filter는 "제스처 진입 차단", 콜백은 "진행 중인 제스처 무시".

          - title: "드래그 구간의 트랜잭션 격리"
            insight: |
              드래그는 짧고 명확한 시작·끝이 있다.
              드래그 시작 시 현재 상태를 lastRulerState ref에 저장하고 ButtonDragging으로 전환한다.
              드래그 끝나면 저장한 상태로 복원한다.
              이 "저장 → 전환 → 복원" 패턴이 트랜잭션처럼 동작한다.
            code: |
              const saveInitialComponentControlState = useCallback(() => {
                  lastRulerState.current = componentControlState.current;
                  componentControlState.current = ComponentControlState.ButtonDragging;
              }, [componentControlState]);

              const revertToInitialComponentControlState = useCallback(() => {
                  componentControlState.current =
                      lastRulerState.current === ComponentControlState.RulerOff
                          ? ComponentControlState.RulerOff
                          : ComponentControlState.Ruler;
              }, [componentControlState]);

    # =========================================================================
    # 검토한 대안
    # =========================================================================
    alternativesConsidered:
      - approach: "filter에서 PreciseMeasurement 상태일 때 제스처 자체를 차단"
        whyNotViable: >
          filter는 mousedown/touchstart 진입 시점에만 평가된다.
          PreciseMeasurement는 터치 시작 후 홀드 시간(800ms) + 이동량으로 판별되므로,
          제스처가 이미 시작된 후에야 모드가 결정된다.
          따라서 filter 시점에서는 차단할 정보가 없다.

      - approach: "zoom 콜백에서 early return만으로 해결"
        whyNotViable: >
          d3-zoom은 Gesture.prototype.zoom 내부에서 this.that.__zoom = transform을
          콜백(emit) 호출보다 먼저 실행한다.
          콜백에서 아무것도 안 해도 element.__zoom은 이미 갱신된 상태이므로,
          React 렌더링은 안 바뀌지만 d3 내부 상태는 매 프레임 누적된다.

      - approach: "기존 데스크톱 방식 유지 — isRulerActive boolean Ref"
        whyNotViable: >
          데스크톱에서는 "측정 중이다/아니다"라는 boolean 하나로 충분했다.
          태블릿에서는 줌·측정·정밀 측정·드래그·오프 5개 상태가 필요하고,
          줌 레이어도 상태를 읽어야 하므로 단방향 boolean으로는 표현할 수 없다.

      - approach: "Zustand나 React state로 상태 공유"
        whyNotViable: >
          d3-zoom의 이벤트 핸들러는 useEffect에서 등록되어 React 렌더 사이클 바깥에서 실행된다.
          React state를 읽으면 등록 시점의 클로저에 캡처되어 stale closure가 발생한다.
          이 상태는 렌더링 트리거가 필요 없는 순수 제어 신호이므로 Ref가 가장 적합하다.

  # ===========================================================================
  # 판매관리 시스템 — Form/Filter 추상화, 클라이언트 암호화, 개발 환경 전략
  # ===========================================================================
  - id: "mai-sales-system"
    tags: ["설계", "추상화", "타입-안전성", "보안", "개발-환경", "Form", "협업"]
    relatedProject: "mai-sales"
    title: "판매관리 시스템 — Form/Filter 추상화와 클라이언트 암호화"

    # =========================================================================
    # Question Flow — 면접 흐름 시각화
    # =========================================================================
    # Entry: "이 프로젝트에서 어떤 역할을 했나요?"
    # │
    # ├─ A. Form/Filter 표준화
    # │  ├─ A1. "Form 표준화가 구체적으로 뭔가요?"
    # │  │  ├─ A1a. "왜 하나가 아니라 두 개로 나눴나요?"
    # │  │  └─ A1b. "타입 안전성은 어떻게 확보했나요?"
    # │  └─ A2. "필터는 어떻게 표준화했나요?"
    # │     ├─ A2a. "필드 간 종속 관계는 어떻게 관리했나요?"
    # │     └─ A2b. "태그와 폼 상태를 왜 분리했나요?"
    # │
    # ├─ B. 파일 다운로드·암호화
    # │  ├─ B1. "클라이언트 암호화라는 게 구체적으로 뭔가요?"
    # │  │  ├─ B1a. "서버에서 하면 안 되나요?"
    # │  │  └─ B1b. "패스워드 분실하면 어떡하나요?"
    # │  └─ B2. "스트리밍은 왜 필요했나요?"
    # │     └─ B2a. "스트리밍과 암호화를 연결할 수는 없었나요?"
    # │
    # └─ C. 개발 환경 전략
    #    ├─ C1. "90%는 어떻게 달성했나요?"
    #    │  └─ C1a. "mock이 실제 API와 달라지면 어떻게 하나요?"
    #    └─ C2. "스키마를 왜 3개로 나눴나요?"
    # =========================================================================

    entryQuestion:
      q: "이 프로젝트에서 어떤 역할을 했나요?"
      answer: >
        v1.0 초기 개발에 참여해서, 크게 세 가지를 담당했습니다.
        첫째, 화면마다 반복되는 대형 폼과 필터 구현을 디자인 시스템 위에서 표준화했습니다.
        둘째, 대용량 파일 내보내기에서 스트리밍 다운로드와 클라이언트 사이드 암호화를 설계했습니다.
        셋째, 백엔드 변경에 의존하지 않고 개발을 이어갈 수 있도록 API mocking 전략을 세웠습니다.

    branches:
      # ── Branch A: Form/Filter 표준화 ──────────────────────────────────────
      - id: "form-filter"
        trigger: "면접관이 '폼 표준화'를 더 물어볼 때"
        questions:
          # ── A1 ────────────────────────────────────────────────────────────
          - id: "A1"
            q: "Form 표준화가 구체적으로 뭔가요?"
            answer: >
              경영관리 시스템이다 보니 화면마다 10~20개 필드를 가진 대형 폼이 있었습니다.
              필드마다 검증, 에러 표시, 값 동기화를 각각 구현하면 방식이 분산되기 때문에,
              사내 디자인 시스템 컴포넌트 위에 react-hook-form을 통합하는 래퍼 레이어를 만들었습니다.
              Base 컴포넌트와 RHF 통합 변형, 두 벌로 나눠서 제공합니다.
            followUps:
              # ── A1a ──────────────────────────────────────────────────────
              - id: "A1a"
                q: "왜 하나의 컴포넌트가 아니라 두 개로 나눴나요?"
                answer: >
                  디자인 시스템 컴포넌트가 react-hook-form에 직접 의존하면,
                  RHF 없이 쓰는 곳에서도 불필요한 의존성을 갖게 됩니다.
                  예를 들어 단순 표시 목적의 Input이나, 다른 폼 라이브러리를 쓰는 곳에서는 RHF가 필요 없거든요.
                  Base 컴포넌트는 standalone으로 동작하고, RHF 변형은 그 위에 폼 연동만 추가하는 구조입니다.
                  이렇게 하면 디자인 시스템 레이어와 제품 코드 사이의 의존성을 끊을 수 있었습니다.
              # ── A1b ──────────────────────────────────────────────────────
              - id: "A1b"
                q: "타입 안전성은 어떻게 확보했나요?"
                answer: >
                  WithRHF<T>라는 유틸리티 타입을 만들었습니다.
                  폼이 관리하는 prop — value, ref — 을 컴파일 타임에 제거하고, name을 필수로 요구합니다.
                  개발자가 실수로 value를 직접 넘기면 타입 에러가 나니까, 잘못된 사용을 빌드 시점에 잡을 수 있습니다.
                  useFormField 훅이 onChange 머지, 에러 메시지 렌더링을 중앙에서 처리해서
                  각 필드 컴포넌트가 반복 구현할 필요가 없도록 했습니다.

          # ── A2 ────────────────────────────────────────────────────────────
          - id: "A2"
            q: "필터는 어떻게 표준화했나요?"
            answer: >
              화면마다 5~10개 필터가 있고, 선택하면 태그로 표시되고, 태그를 지우면 필터가 해제되는 패턴이 반복되었습니다.
              useFilter라는 훅을 만들어서 폼 상태 관리, 필터 태그 동기화, 필드 간 종속 관계 처리를 한 곳에서 처리합니다.
            followUps:
              # ── A2a ──────────────────────────────────────────────────────
              - id: "A2a"
                q: "필드 간 종속 관계는 어떻게 관리했나요?"
                answer: >
                  dependencyMap이라는 Map<FieldName, Set<FieldName>> 구조를 받습니다.
                  예를 들어 '지역'을 바꾸면 '하위 지역' 필드가 자동으로 기본값으로 리셋되고, 관련 태그도 제거됩니다.
                  useEffect 체인으로 암묵적으로 처리하는 대신 선언적으로 정의한 이유는,
                  실행 순서를 예측하기 어렵고 리셋 대상이 누락되기 쉬웠기 때문입니다.
                  수동으로 Map을 정의하는 비용이 있지만, 필터 조합 버그를 줄이는 데 효과적이었습니다.
              # ── A2b ──────────────────────────────────────────────────────
              - id: "A2b"
                q: "태그와 폼 상태를 왜 분리했나요?"
                answer: >
                  폼 값과 UI 태그가 항상 1:1로 대응하지 않기 때문입니다.
                  multi-select 필드는 하나의 폼 값(배열)에 여러 태그가 대응하고,
                  'ALL'을 선택하면 태그를 전부 지워야 하지만 폼 값은 'ALL'로 설정해야 합니다.
                  분리해두면 태그 삭제 시 역방향으로 폼 값을 업데이트하는 양방향 동기화도 자연스럽게 구현할 수 있었습니다.

      # ── Branch B: 파일 다운로드·암호화 ────────────────────────────────────
      - id: "download-encryption"
        trigger: "면접관이 '암호화', '다운로드'를 더 물어볼 때"
        questions:
          # ── B1 ────────────────────────────────────────────────────────────
          - id: "B1"
            q: "클라이언트 암호화라는 게 구체적으로 뭔가요?"
            answer: >
              이 시스템에는 매출 데이터를 엑셀로 내보내는 기능이 있습니다.
              내보낼 때 모달에서 랜덤 패스워드를 보여주고, 다운로드한 파일을 그 패스워드로 zip 암호화합니다.
              이 과정이 전부 브라우저에서 일어나서, 패스워드가 서버를 거치지 않습니다.
              window.crypto.getRandomValues()로 암호학적으로 안전한 패스워드를 생성하고,
              이미 ZIP인 파일은 감지해서 재압축 없이 암호만 씌우도록 level: 0을 적용했습니다.
            followUps:
              # ── B1a ──────────────────────────────────────────────────────
              - id: "B1a"
                q: "서버에서 하면 안 되나요?"
                answer: >
                  가능하지만, 서버에서 암호화하면 패스워드가 요청으로 전송되고 서버 메모리에 남습니다.
                  노출 경로가 늘어나는 셈이죠.
                  클라이언트에서 처리하면 패스워드는 브라우저 메모리에만 존재하고,
                  동시에 서버의 암호화 연산 부하도 분산할 수 있습니다.
                  사내 시스템이니까 이런 trust boundary 설계가 가능했습니다.
              # ── B1b ──────────────────────────────────────────────────────
              - id: "B1b"
                q: "패스워드 분실하면 어떡하나요?"
                answer: >
                  복구할 방법은 없습니다. 브라우저 의존적이라 서버에 패스워드가 없으니까요.
                  하지만 사내 시스템이라 같은 데이터를 다시 내보내면 되기 때문에,
                  수용 가능한 trade-off였습니다.
                  내보내기 사유(reason) 필드를 두어 감사 추적은 별도로 가능합니다.

          # ── B2 ────────────────────────────────────────────────────────────
          - id: "B2"
            q: "스트리밍은 왜 필요했나요?"
            answer: >
              내보내기 대상이 수천~수만 건이 될 수 있어서, 파일이 수십 MB까지 커집니다.
              Blob으로 한번에 받으면 브라우저 탭이 죽거나 메모리 초과가 발생할 수 있었습니다.
              ReadableStream으로 청크 단위로 읽으면서 진행률을 표시하고,
              Content-Disposition에서 파일명을 파싱하는 구조를 만들었습니다.
            followUps:
              # ── B2a ──────────────────────────────────────────────────────
              - id: "B2a"
                q: "스트리밍과 암호화를 연결할 수는 없었나요?"
                answer: >
                  지금은 다운로드 완료 후 암호화하는 2단계입니다.
                  Service Worker 기반 스트리밍 저장을 쓰면 파이프라인화가 가능하지만,
                  현재 파일 크기 범위(수십 MB)에서는 사용자 체감 차이가 크지 않아
                  과도한 복잡도라고 판단했습니다.

      # ── Branch C: 개발 환경 전략 ──────────────────────────────────────────
      - id: "dev-environment"
        trigger: "면접관이 'API mocking', '개발 환경'을 더 물어볼 때"
        questions:
          # ── C1 ────────────────────────────────────────────────────────────
          - id: "C1"
            q: "90%는 어떻게 달성했나요?"
            answer: >
              단순 fixture 반환이 아니라, MSW 핸들러에 비즈니스 로직을 시뮬레이션했습니다.
              날짜 범위 필터링, 수금 상태 계산, 분기 계산, 다중 필드 검색 같은 것들이요.
              이렇게 해야 프론트엔드만으로도 전체 플로우를 검증할 수 있고,
              코드 리뷰할 때도 화면을 띄워서 동작을 확인할 수 있었습니다.
            followUps:
              # ── C1a ──────────────────────────────────────────────────────
              - id: "C1a"
                q: "mock이 실제 API와 달라지면 어떻게 하나요?"
                answer: >
                  Zod 스키마를 API 계약으로 공유해서 괴리를 줄였습니다.
                  mock 핸들러가 같은 스키마를 참조하니까, 서버 응답 구조가 바뀌면
                  스키마 변경이 mock 쪽에도 타입 에러로 전파됩니다.
                  완전한 계약은 아니지만, 수동 fixture보다는 훨씬 안전합니다.
                  API 스펙이 안정된 후에는 contract test 같은 방향으로 전환할 수 있을 것 같습니다.

          # ── C2 ────────────────────────────────────────────────────────────
          - id: "C2"
            q: "스키마를 왜 3개 레이어로 나눴나요?"
            answer: >
              API 계약, 비즈니스 규칙, UI 검증은 변경 이유가 다릅니다.
              API 스키마(apis/types/)는 서버 계약이 바뀔 때만,
              도메인 스키마(schemas/)는 비즈니스 규칙이 바뀔 때만,
              페이지 스키마(pages/*/schemas/)는 화면별 검증이 바뀔 때만 변경합니다.
              한 곳에 모으면 하나의 변경이 어디까지 영향을 주는지 파악하기 어려운데,
              나누면 변경 범위가 자연스럽게 좁아집니다.
              페이지 스키마에서는 superRefine으로 조건부 검증(설치 유형이면 제품 필수)이나
              DB 제약(DECIMAL_15_2)까지 프론트에서 잡아냅니다.

    # =========================================================================
    # Ownership
    # =========================================================================
    ownership:
      - "디자인 시스템(maiui) 기반 Form abstraction 설계 (WithRHF 타입, useFormField 훅)"
      - "필터 의존성 관리 구조 설계 (dependencyMap, 양방향 태그 동기화)"
      - "클라이언트 사이드 zip 암호화 워크플로우 설계"
      - "ReadableStream 기반 스트리밍 다운로드 구현"
      - "MSW 핸들러에 비즈니스 로직 시뮬레이션 구현"
      - "3-layer Zod 스키마 구조 설계"

    # =========================================================================
    # 검토한 대안
    # =========================================================================
    alternativesConsidered:
      - approach: "Form 컴포넌트를 하나로 만들고 mode prop으로 분기"
        whyNotViable: >
          디자인 시스템 컴포넌트가 react-hook-form에 직접 의존하게 되어,
          RHF 없이 사용하는 곳에서도 불필요한 의존성을 갖게 된다.
          또한 mode에 따라 prop 타입이 달라지면 타입 안전성이 떨어진다.

      - approach: "필터 의존성을 useEffect로 암묵적으로 처리"
        whyNotViable: >
          useEffect 체인으로 종속 필드를 리셋하면 실행 순서를 예측하기 어렵고,
          리셋 대상이 누락되기 쉽다. 선언적 Map 구조가 디버깅과 확장에 유리하다.

      - approach: "서버에서 암호화하여 내려보내기"
        whyNotViable: >
          패스워드가 네트워크를 타고 서버 메모리에 남게 되어 노출 경로가 늘어난다.
          동시에 서버의 암호화 연산 부하도 증가한다.
          사내 시스템이므로 클라이언트 처리로 trust boundary를 좁히는 것이 합리적이었다.

      - approach: "Blob으로 파일 전체를 한번에 다운로드"
        whyNotViable: >
          수만 건 내보내기 시 수십 MB 이상의 파일이 생성되어 브라우저 메모리 초과 위험.
          또한 진행률 표시가 불가능하여 사용자가 다운로드 상태를 알 수 없다.

      - approach: "Zod 스키마를 한 곳에서 관리"
        whyNotViable: >
          API 계약 변경, 비즈니스 규칙 변경, UI 검증 변경이 같은 파일에서 발생하면
          변경의 영향 범위를 파악하기 어렵다. 레이어별로 분리하면 변경 이유가 명확해진다.
