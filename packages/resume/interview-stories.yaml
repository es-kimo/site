    entryQuestion:
      q: "이 프로젝트에 대해 설명해주세요"
      answer: >
        디자인 시스템의 Modal 컴포넌트를 변경할 때,
        12개 프로덕트에 퍼져 있는 모달 사용처의 영향 범위를 파악하기 어려운 문제가 있었습니다.
        프로덕트마다 모달을 다르게 커스텀했고, 위험한 곳이 어딘지 한눈에 보이지 않았습니다.
        그래서 LLM이 12개 레포의 코드를 읽고 모달 사용처를 자동 수집·분류하는 파이프라인과,
        위험도 기반으로 리뷰할 수 있는 대시보드를 구축했습니다.
        서버 없이 정적 사이트와 JSON 파일만으로 운영되고, API 비용도 $0입니다.

    branches:
      # ── Branch A: 문제 정의와 해결 접근 ────────────────────────────────────
      - id: "problem-definition"
        trigger: "면접관이 '문제 발견', '왜 만들었나'를 더 물어볼 때"
        questions:
          # ── A1 ────────────────────────────────────────────────────────────
          - id: "A1"
            q: "이 문제를 어떻게 발견했나요?"
            answer: >
              디자인 시스템 팀에서 Modal 컴포넌트 리뉴얼을 진행하면서,
              "이걸 바꾸면 어디가 깨지는지 알 수 없다"는 상황을 직접 목격했습니다.
              12개 프로덕트가 각자 모달을 다르게 커스텀하고 있었는데,
              모달 이름과 파일 경로만으로는 어디서 어떻게 들어가야 그 모달을 볼 수 있는지도 알 수 없었습니다.
              리뷰가 사실상 '감'에 의존하고 있었습니다.
              예를 들어, styled(Modal)로 footer 버튼의 width를 50%로 강제한 모달과
              className만 추가한 모달은 디자인 시스템 변경 시 깨질 위험도가 완전히 다른데,
              둘 다 "Modal을 import해서 쓰고 있다"는 점에서는 구분이 안 되고 있었습니다.
              문제를 인식한 시점에서 바로 해결책을 제안했고,
              결과적으로 팀의 리뷰 방식을 "전수 확인"에서 "고위험 중심 시각 검증"으로 바꿀 수 있는 기반을 마련했습니다.

          # ── A2 ────────────────────────────────────────────────────────────
          - id: "A2"
            q: "기존에는 어떻게 하고 있었나요?"
            answer: >
              수작업 전수 확인이었고, 현실적으로는 "아마 괜찮겠지"로 넘어가는 경우가 많았습니다.
              12개 프로덕트 전체를 돌면서 모달을 하나하나 열어보는 건 비용이 너무 컸습니다.
              특히 에러 상태에서만 뜨는 모달이나 특정 권한이 있어야 접근 가능한 모달은
              존재 자체를 모르고 넘어가기 쉬웠습니다.
              reachability가 error인 모달, 즉 API 실패나 타임아웃 상황에서만 등장하는 모달은
              수작업으로는 재현 자체가 어렵습니다.
              이런 모달이 커스텀돼 있으면 디자인 시스템 변경 후 깨져도 한참 뒤에야 발견됩니다.

          # ── A3 ────────────────────────────────────────────────────────────
          - id: "A3"
            q: "왜 기존 도구(grep 등)가 아니라 별도 도구를 만들었나요?"
            answer: >
              grep은 "어디서 import하는가"까지는 알려주지만,
              "얼마나 위험한가"와 "어떻게 도달하는가"는 알려주지 않습니다.
              필요한 건 단순한 사용처 목록이 아니라, 커스텀 유형별 위험도 분류와
              사용자가 그 모달에 도달하는 경로 정보였습니다.
              grep으로 Modal import를 찾는 건 1분이면 되지만,
              그 모달이 styled로 감싸져 있는지, className만 추가한 건지,
              어떤 버튼을 눌러야 뜨는지를 파악하려면 코드를 읽어야 합니다.
              또한 useModal 훅을 래핑한 커스텀 훅(useAlert, useConfirm 등)을 통한
              간접 사용은 grep으로 Modal을 검색해도 잡히지 않습니다.
              LLM은 코드의 의미를 이해하기 때문에 이런 간접 호출 체인도 추적할 수 있었습니다.

      # ── Branch B: AI 활용 설계 ────────────────────────────────────────────
      - id: "ai-utilization"
        trigger: "면접관이 'LLM', 'AI 활용', '프롬프트'를 더 물어볼 때"
        questions:
          # ── B1 ────────────────────────────────────────────────────────────
          - id: "B1"
            q: "LLM에게 어떻게 지시했나요?"
            answer: >
              프롬프트를 엔지니어링 스펙처럼 설계했습니다.
              추출할 15개 필드의 스키마, 각 enum 값의 분류 기준, 탐색 규칙을 명시한 분석 프롬프트를 만들었습니다.
              "모달을 찾아달라"고만 지시하면 레포마다 추출 기준이 달라집니다.
              어떤 레포에서는 Dialog도 포함하고, 어떤 레포에서는 빠지는 식으로요.
              일관된 결과를 얻으려면 "무엇을 찾고, 어떻게 분류하고, 어떤 형식으로 출력하라"를
              명확하게 정의해야 했습니다.
              risk는 custom_type에 따라 high/mid/low로 분류하는데,
              dom_override나 full_custom은 high, className만 추가한 건 mid, 아무 커스텀 없으면 low입니다.
              이런 분류 기준을 프롬프트에 명시해서, 12개 레포 전체에 동일한 기준이 적용되게 했습니다.
              결과적으로 이 프롬프트는 프로젝트의 분석 로직 그 자체였습니다.
              코드로 작성한 건 수집 스크립트와 대시보드뿐이고,
              핵심 분석은 프롬프트가 정의한 규칙에 따라 LLM이 수행한 셈입니다.

          # ── B1a ───────────────────────────────────────────────────────────
          - id: "B1a"
            q: "추출 기준이 레포마다 달라지지 않았나요?"
            answer: >
              프롬프트의 스키마와 분류 기준이 고정돼 있어서, 레포별로 달라지지 않았습니다.
              15개 필드와 각 enum의 판단 기준이 프롬프트에 명시돼 있으므로,
              LLM이 레포마다 자의적으로 해석할 여지를 줄였습니다.
              예를 들어 risk를 판단하려면 먼저 custom_type을 식별해야 하고,
              custom_type은 코드에서 실제 커스텀 패턴을 확인해야 하는 식으로
              판단 순서가 구조화돼 있습니다.
              다만 첫 레포 분석 후 품질 체크리스트로 결과를 검증하는 단계를 뒀습니다.
              JSON 파싱 가능 여부, 15개 필드 존재 여부, file_path의 실제 존재 여부,
              enum 값의 범위, trigger_steps의 구체성 등을 확인하고,
              기준이 잘 지켜졌는지 확인한 뒤 나머지 레포에 적용했습니다.

          # ── B1b ───────────────────────────────────────────────────────────
          - id: "B1b"
            q: "15개 필드는 왜 그렇게 정했나요?"
            answer: >
              "이 모달을 리뷰하려면 무엇을 알아야 하는가"를 역으로 물어서 도출했습니다.
              리뷰어가 판단해야 하는 건 크게 세 가지입니다.
              첫째, 이 모달이 얼마나 위험한가(risk, custom_type, custom_detail).
              둘째, 이 모달을 실제로 볼 수 있는가(reachability, route, trigger_steps, preconditions).
              셋째, 이 모달이 뭘 하는 건가(purpose, screen, base_component).
              특히 trigger_steps와 preconditions가 중요했습니다.
              "결제 페이지에서 '결제하기' 버튼을 누르면 나오는 모달"이라는 정보가 있어야
              리뷰어가 실제로 해당 모달을 찾아갈 수 있습니다.
              파일 경로만으로는 "어떻게 이 모달에 도달하는가"를 알 수 없고,
              이 정보가 있어야 리뷰와 시각 검증이 가능합니다.

          # ── B2 ────────────────────────────────────────────────────────────
          - id: "B2"
            q: "LLM 결과의 품질은 어떻게 보장했나요?"
            answer: >
              세 가지 장치를 뒀습니다. 스키마 강제, confidence 필드, 그리고 verified 분리입니다.
              LLM은 틀릴 수 있다는 전제에서 출발했습니다.
              중요한 건 "틀렸을 때 알 수 있는 구조"를 만드는 것이었습니다.
              첫째, 15개 필드 스키마와 enum 범위를 강제해서 형식적 일관성을 보장했습니다.
              둘째, confidence 필드(high/medium/low)로 LLM 스스로 확신도를 표시하게 해서,
              low인 항목은 대시보드에서 경고 배경으로 시각 구분했습니다.
              셋째, verified_risk, verified_reachability, verified_route, verified_trigger_steps를
              AI 추정값과 별도 필드로 분리했습니다.
              사람이 검증한 값이 있으면 그게 우선 표시되고,
              없으면 AI 추정값이 "AI 추정" 라벨과 함께 표시됩니다.
              이 구조 덕분에 LLM의 결과를 "초안"으로 취급하고,
              사람이 보정한 값을 "확정"으로 관리하는 워크플로우가 자연스럽게 만들어졌습니다.

          # ── B2a ───────────────────────────────────────────────────────────
          - id: "B2a"
            q: "confidence 필드는 왜 넣었나요?"
            answer: >
              LLM이 "확실하지 않지만 누락시키지 않기 위해 포함한" 항목을
              사람이 우선 검토할 수 있도록 하기 위해서입니다.
              분석 규칙에서 "확실하지 않은 모달은 빼지 말고 confidence: low로 포함하라"고 지시했습니다.
              누락보다 오탐이 낫다는 판단이었고,
              오탐은 대시보드에서 사람이 걸러낼 수 있지만 누락은 발견 자체가 어렵습니다.
              대시보드에서 confidence를 필터로 제공해서,
              "low인 것만 먼저 검토"하는 식으로 리뷰 우선순위를 잡을 수 있게 했습니다.

          # ── B2b ───────────────────────────────────────────────────────────
          - id: "B2b"
            q: "verified_* 필드와 AI 추정값을 분리한 이유는?"
            answer: >
              AI 결과를 직접 수정하면 "원래 AI가 뭐라고 했는지"가 사라지기 때문입니다.
              리뷰 과정에서 AI의 risk 판단이 틀렸을 때, risk 필드를 직접 고치면
              나중에 "AI가 왜 이렇게 판단했는지" 역추적이 불가능합니다.
              verified_risk를 별도로 두면 AI 원본과 사람의 보정값이 모두 남아서,
              프롬프트를 개선할 때 "어떤 유형에서 AI가 자주 틀리는지" 분석할 수 있습니다.
              대시보드에서는 verified_risk가 있으면 그 값을 표시하고,
              없으면 risk를 "AI 추정" 라벨과 함께 표시합니다.
              리뷰 모드에서는 "AI 추정값 복사" 버튼으로
              AI 값을 verified 필드로 한 번에 옮길 수도 있어서,
              AI가 맞았을 때는 한 클릭으로 확정할 수 있습니다.

          # ── B3 ────────────────────────────────────────────────────────────
          - id: "B3"
            q: "API 비용 $0이라고 했는데, 어떻게 가능한가요?"
            answer: >
              LLM API를 호출하는 대신, 기존에 구독하고 있는 코딩 에이전트(Claude, Copilot 등)에게
              packed 파일을 직접 읽히고 분석을 지시하는 방식을 썼습니다.
              API 키를 발급받고 비용 승인을 받는 건 사내 절차가 필요합니다.
              하지만 코딩 에이전트 구독은 이미 있었고,
              에이전트에게 "이 파일을 읽고, 이 스키마에 맞춰 JSON으로 추출하라"고
              지시하면 결과적으로 같은 분석이 가능합니다.
              레포당 1회 지시, 12개면 12회 반복입니다.
              소형 레포는 2~3분, 대형 레포는 선필터 후 5~10분 정도 걸렸습니다.
              추가 인프라 없이, 기존 도구만으로 파이프라인 전체를 실행할 수 있었습니다.
              이 방식의 한계는 수동 반복이 필요하다는 점입니다.
              v2에서는 analyze.js 스크립트에서 LLM API를 직접 호출하도록 자동화할 수 있고,
              그때는 API 비용이 발생하지만 CI/CD 연동이 가능해집니다.

      # ── Branch C: 아키텍처 판단 ────────────────────────────────────────────
      - id: "architecture"
        trigger: "면접관이 '아키텍처', '서버', '인프라'를 더 물어볼 때"
        questions:
          # ── C1 ────────────────────────────────────────────────────────────
          - id: "C1"
            q: "서버 없이 정적 사이트로 한 이유는?"
            answer: >
              이 도구의 분석은 일회성이고, 데이터 변경은 JSON 파일 커밋으로 충분하기 때문입니다.
              디자인 시스템 Modal 변경은 자주 일어나는 게 아니라,
              리뉴얼 같은 큰 변경 시에 한 번 실행하는 성격입니다.
              분석 결과는 inventory.json 하나에 담기고,
              리뷰 결과도 JSON 수정 후 커밋으로 이력이 관리됩니다.
              서버를 두면 DB, 인증, 배포 파이프라인이 추가되는데,
              이 도구의 사용 주기에 비해 유지 비용이 과합니다.
              대시보드에서 상태를 편집하면 변경사항이 메모리에 쌓이고,
              "내보내기" 버튼으로 inventory.json 전체를 다운로드합니다.
              이걸 GitLab 레포에 커밋하면 MR로 변경 이력이 남습니다.
              서버 없이도 데이터의 버전 관리와 협업이 가능한 구조입니다.

          # ── C2 ────────────────────────────────────────────────────────────
          - id: "C2"
            q: "Repo Packer는 왜 필요했나요?"
            answer: >
              LLM에게 레포 코드를 읽히려면,
              소스 파일을 하나의 텍스트로 합쳐 컨텍스트에 넣을 수 있는 형태로 변환해야 했습니다.
              코딩 에이전트에게 "이 레포를 분석해"라고 하려면
              에이전트가 읽을 수 있는 형태로 코드를 전달해야 합니다.
              git clone한 레포에서 소스 파일만 추출하고(.tsx, .ts, .css 등),
              테스트·스토리·에셋 같은 분석에 불필요한 파일을 제외한 뒤,
              레포당 하나의 텍스트 파일로 concat하는 게 Repo Packer의 역할입니다.
              pack-repo.js는 추출 후 파일 수, 총 글자 수, 추정 토큰 수(글자수 / 4)를
              콘솔에 출력합니다. 이 토큰 추정치로 LLM의 컨텍스트 한계에 걸리는지
              사전에 확인할 수 있었습니다.

          # ── C3 ────────────────────────────────────────────────────────────
          - id: "C3"
            q: "토큰 한계는 어떻게 대응했나요?"
            answer: >
              3단계 fallback 전략을 설계했습니다.
              대부분의 레포는 전체 코드를 그대로 읽혔고,
              대형 레포에서만 선별적으로 축소했습니다.
              Repo Packer가 이미 테스트·스토리·에셋을 제외하지만,
              그래도 대형 레포는 토큰 한계에 가까울 수 있습니다.
              Level 1은 주석과 import 축약, Level 2는 Modal/Dialog/useModal 등
              키워드가 없는 파일을 통째로 제외, Level 3은 packed 파일 대신
              clone된 레포를 에이전트가 직접 탐색하는 방식입니다.
              현재 12개 레포는 대부분 Level 0(전체 코드)으로 분석이 가능했고,
              일부 대형 레포에서만 Level 2를 적용했습니다.

      # ── Branch D: 회고 ────────────────────────────────────────────────────
      - id: "retrospective"
        trigger: "면접관이 '한계', '회고', '다시 한다면'을 물어볼 때"
        questions:
          # ── D1 ────────────────────────────────────────────────────────────
          - id: "D1"
            q: "이 도구의 한계는?"
            answer: >
              두 가지입니다. 분석이 스냅샷이라는 점과, 수동 반복이 필요하다는 점입니다.
              코드가 변경되면 분석을 다시 실행해야 합니다.
              PR이 머지될 때마다 자동으로 incremental scan이 돌면 이상적이지만,
              현재는 수동으로 pack → 에이전트 지시 → merge를 반복해야 합니다.
              향후 확장으로 세 가지를 생각하고 있습니다.
              첫째, analyze.js에서 LLM API를 직접 호출하는 자동화.
              둘째, CI/CD 파이프라인에 연동해서 PR 단위 incremental scan.
              셋째, Modal 외에 다른 디자인 시스템 컴포넌트에도 동일 파이프라인 적용.
              다만 현재 시점에서는 이 한계가 실제 문제가 되지 않습니다.
              디자인 시스템 Modal 리뉴얼은 빈번하지 않고,
              리뉴얼 시점에 한 번 실행하면 충분하기 때문입니다.
              도구의 복잡도를 사용 주기에 맞추는 것도 설계 판단이라고 봅니다.

          # ── D2 ────────────────────────────────────────────────────────────
          - id: "D2"
            q: "다시 한다면 뭘 다르게?"
            answer: >
              Repo Packer 단계에서 AST 기반 전처리를 추가할 것 같습니다.
              현재는 파일 단위로 통째로 concat하는데,
              AST로 파싱해서 Modal 관련 import가 있는 파일만 먼저 추출하면
              토큰 효율이 크게 올라갑니다.
              이러면 Level 2 fallback이 필요 없어지고,
              대형 레포에서도 안정적으로 전체 분석이 가능합니다.
              또한 프롬프트의 분석 규칙을 JSON Schema로 형식화하면
              LLM의 structured output 기능과 결합하여
              형식 검증을 자동화할 수 있습니다.
              현재는 품질 체크를 수동으로 하고 있는데,
              이 부분이 자동화되면 파이프라인의 신뢰도가 올라갑니다.

    # =========================================================================
    # Ownership
    # =========================================================================
    ownership:
      - "디자인 시스템 Modal 변경 시 12개 프로덕트 영향 범위 파악 문제를 직접 정의하고 해결책 제안"
      - "15개 필드 스키마, risk/reachability/confidence 분류 기준, useModal 훅 체인 추적 규칙을 포함한 분석 프롬프트 설계"
      - "첫 레포 품질 체크리스트 → 검증 후 나머지 적용의 검증-후-확산 패턴 설계"
      - "AI 추정값과 사람 보정값을 분리하는 verified_* 필드 구조 설계"
      - "서버 없이 JSON + 정적 사이트로 운영하는 아키텍처 판단"
      - "Repo Packer로 소스 코드를 LLM 입력에 최적화하는 전처리 파이프라인 구현"
      - "3단계 토큰 한계 fallback 전략 설계"
      - "관리 대시보드 + 리뷰 모드의 역할별 UX 분리 설계 및 구현"
      - "Phase 단위 에이전트 지시 문서(copilot-instructions.md) 작성으로 구축 과정 자체를 구조화"

    # =========================================================================
    # Technical Deep Dives — 세부 참고 자료
    # =========================================================================
    technicalDeepDives:
      # ── Deep Dive 1 ──────────────────────────────────────────────────────────
      - title: "분석 프롬프트의 스키마 설계"
        summary: |
          핵심은 LLM의 비정형 분석 능력을 활용하되,
          출력의 일관성을 스키마로 강제하는 것이다.
          15개 필드는 "리뷰어가 판단에 필요한 정보"를 역으로 도출한 것이고,
          각 enum의 분류 기준은 판단의 재현성을 보장하기 위한 것이다.
        steps:
          - title: "식별 필드 — component_name, file_path, base_component"
            insight: |
              모달을 유일하게 식별하고, 코드에서 찾아갈 수 있게 하는 최소한의 정보.
              file_path는 실제 존재해야 하며, 파일 이름으로 추측하지 않고
              실제 코드를 읽어서 확인하도록 규칙에 명시했다.

          - title: "분류 필드 — purpose, custom_type, custom_detail"
            insight: |
              purpose(confirm, form, info, alert 등)는 모달의 역할을 분류한다.
              custom_type은 none/className/styled/slot_override/dom_override/full_custom의
              6단계로 커스텀 수준을 분류하고, risk 판단의 입력이 된다.
              custom_detail에는 구체적 CSS 속성, 셀렉터, 패턴명을 포함하도록 지시했다.

          - title: "위험도 필드 — risk, confidence"
            insight: |
              risk는 custom_type에서 기계적으로 도출된다.
              dom_override/full_custom → high, className/styled 소규모 → mid, none → low.
              confidence는 LLM의 자기 평가로, 코드가 모호하거나
              간접 호출 체인이 긴 경우 low로 표시하도록 했다.

          - title: "도달 정보 필드 — reachability, route, trigger_steps, preconditions"
            insight: |
              reachability는 normal/conditional/error의 3단계.
              trigger_steps는 "페이지 진입부터 모달이 열리는 순간까지"의
              유저 행동을 코드의 onClick 핸들러, 이벤트 체인을 따라가며 추출한다.
              마지막 단계는 항상 "~~ 모달 표시"로 끝나도록 규칙화했다.

      # ── Deep Dive 2 ──────────────────────────────────────────────────────────
      - title: "AI 추정값과 사람 보정값의 분리 구조"
        summary: |
          LLM이 추출한 15개 필드는 "초안"이고,
          사람이 검증한 verified_* 필드가 "확정"이다.
          이 분리 덕분에 두 가지가 가능하다.
          1) 대시보드가 verified 값 우선, 없으면 AI 값 + "AI 추정" 라벨로 표시
          2) 나중에 AI가 자주 틀리는 패턴을 분석하여 프롬프트를 개선할 수 있음
        steps:
          - title: "merge.js에서 추가하는 관리 필드"
            insight: |
              status(unchecked → confirmed/fix_needed/exception/later),
              verified_risk, verified_reachability, verified_route, verified_trigger_steps,
              reviewer_note, action, action_detail.
              모두 초기값은 null 또는 빈 문자열이고, 사람이 채운다.

          - title: "대시보드의 우선 표시 규칙"
            insight: |
              verified_risk가 non-null이면 그 값을 표시하고,
              null이면 LLM이 추출한 risk를 "AI 추정" 라벨과 함께 표시한다.
              reachability, route, trigger_steps도 동일한 규칙.
              이 규칙이 대시보드 전체에 일관되게 적용된다.

          - title: "리뷰 모드에서의 'AI 추정값 복사' 버튼"
            insight: |
              AI가 맞았을 때는 verified 필드에 일일이 입력할 필요 없이,
              "AI 추정값 복사" 버튼으로 LLM 값을 verified 필드로 한 번에 복사한다.
              이렇게 하면 AI가 맞았을 때의 리뷰 비용은 한 클릭이고,
              틀렸을 때만 수동 보정하면 된다.

    # =========================================================================
    # 검토한 대안
    # =========================================================================
    alternativesConsidered:
      - approach: "grep/ripgrep으로 Modal import 사용처를 수집"
        whyNotViable: >
          import 위치는 찾을 수 있지만, 커스텀 유형(styled, className 등)의 분류,
          위험도 판단, 사용자 도달 경로 추출은 할 수 없다.
          또한 useModal → useAlert 같은 간접 호출은 grep으로 잡히지 않는다.

      - approach: "LLM API를 호출하는 스크립트로 완전 자동화"
        whyNotViable: >
          기술적으로는 가능하지만, API 키 발급과 비용 승인에 사내 절차가 필요하다.
          기존 에이전트 구독으로 바로 시작할 수 있는 방식을 택해서
          "제안 → 구현 → 결과"까지의 사이클을 빠르게 돌렸다.
          자동화는 도구의 가치가 검증된 후 v2에서 진행할 수 있다.

      - approach: "LLM 분석 결과를 직접 수정하는 구조 (verified_* 필드 없이)"
        whyNotViable: >
          AI 원본이 덮어써지면 "AI가 어떤 유형에서 자주 틀리는지" 분석이 불가능하다.
          프롬프트 개선의 피드백 루프가 끊어진다.
          또한 리뷰 상태 추적도 어려워진다.
          "이 항목은 AI가 mid라고 했는데 실제로는 high였다"는 정보가 남아야
          프롬프트와 분류 기준의 품질을 점진적으로 올릴 수 있다.

      - approach: "서버를 두고 DB에 인벤토리를 관리"
        whyNotViable: >
          분석은 디자인 시스템 리뉴얼 시에 한 번 실행하는 성격이다.
          DB와 서버를 운영하면 인증, 배포, 유지보수 비용이 추가되는데,
          사용 주기에 비해 과하다.
          JSON 파일 + GitLab MR로 버전 관리와 협업이 충분히 가능하다.

      - approach: "Repo Packer 없이 에이전트에게 레포를 직접 탐색시키기"
        whyNotViable: >
          에이전트가 레포 디렉토리를 직접 탐색하면 파일을 하나하나 열어야 하므로
          시간이 오래 걸리고, 어떤 파일을 열어야 하는지 판단을 에이전트에게 맡기게 된다.
          Repo Packer로 전처리하면 관련 코드가 하나의 텍스트에 모여 있어서
          분석이 빠르고 누락 위험이 줄어든다.
          다만 대형 레포에서 토큰 한계에 걸리면 Level 3(직접 탐색)으로 fallback한다.
