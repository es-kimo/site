# =============================================================================
# Interview Stories — 면접용 스토리 구조화
# =============================================================================
# 목적:
# - 이력서에는 넣지 않지만, 면접에서 활용할 수 있는 경험을 STAR 형식으로 정리
# - tags로 질문 유형별 빠른 검색 (끈기, 디버깅, 협업, 설계 등)
# - relatedProject로 이력서 항목과 연결
# - technicalDeepDive로 면접에서 코드 수준으로 설명할 수 있는 근거를 기록
# - alternativesConsidered로 '왜 다른 방법은 안 되었는가'를 구조화
# =============================================================================

stories:
  - id: "d3-transform-restore"
    tags: ["끈기", "디버깅", "라이브러리-내부-추적", "설계-의사결정"]
    relatedProject: "ecg-ruler-tablet"
    title: "d3-zoom 소스코드를 읽어 내부 transform 누적 원인을 파악하고, 복원 방식을 설계한 과정"

    situation: |
      태블릿 환경에서 정밀 측정(PreciseMeasurement) 모드에 진입하면 화면 이동(panning)을 멈춰야 했다.
      React 측에서 zoom 콜백을 early return하여 setZoomContext를 호출하지 않았으므로
      화면(React 렌더링)은 실제로 움직이지 않았다.
      그러나 정밀 측정을 종료한 직후 다음 줌/팬 동작을 시작하면,
      화면이 정밀 측정 중 손가락이 움직인 만큼 갑자기 밀리는 현상이 발생했다.

    task: |
      사용자의 zoom 콜백에서 아무 동작도 하지 않았는데 왜 d3의 내부 상태가 바뀌는지 원인을 파악하고,
      d3-zoom의 핀치·스크롤 동작은 그대로 유지하면서
      정밀 측정 모드에서 발생하는 transform 누적을 해소해야 했다.

    action: |
      1. d3-zoom 소스코드를 직접 읽어, 콜백과 무관하게 __zoom이 먼저 갱신되는 내부 구조를 확인했다.
      2. '콜백에서 건너뛰어도 d3 내부 상태는 이미 오염된 상태'라는 핵심 원인을 특정했다.
      3. filter 차단이 불가능한 이유(PreciseMeasurement는 제스처 시작 후 결정됨)를 확인하고,
         'start 시점에 transform을 저장 → end 시점에 복원'하는 방식이 유일한 해결책임을 도출했다.
      4. zoom().transform으로 복원하면 throwaway 인스턴스가 생기는 점을 인지하고, 동작에 문제가 없음을 확인한 뒤 적용했다.

    result: "정밀 측정 종료 후 화면이 밀리는 현상을 제거하여, 측정 종료 → 다음 줌/팬 전환이 자연스럽게 이어지도록 개선했다."

    # =========================================================================
    # 대안 검토 — '왜 이 방법이어야 했는가'를 구조화
    # =========================================================================
    alternativesConsidered:
      - approach: "filter에서 PreciseMeasurement 상태일 때 제스처 자체를 차단"
        whyNotViable: |
          filter는 mousedown/touchstart 진입 시점에만 평가된다.
          PreciseMeasurement는 터치 시작 후 홀드 시간(800ms) + 이동량으로 판별되므로,
          제스처가 이미 시작된 후에야 모드가 결정된다.
          따라서 filter 시점에서는 차단할 정보가 없다.
      - approach: "zoom 콜백에서 early return만으로 해결"
        whyNotViable: |
          d3-zoom은 Gesture.prototype.zoom 내부에서 this.that.__zoom = transform을
          콜백(emit) 호출보다 먼저 실행한다.
          콜백에서 아무것도 안 해도 element.__zoom은 이미 갱신된 상태이므로,
          React 렌더링은 안 바뀌지만 d3 내부 상태는 매 프레임 누적된다.

    # =========================================================================
    # 기술 분석 — d3-zoom 소스코드 기반 원인 추적 과정
    # =========================================================================
    technicalDeepDive:
      summary: |
        d3-zoom은 DOM 엘리먼트의 __zoom 프로퍼티에 현재 transform을 저장한다.
        핵심은 Gesture.prototype.zoom 메서드에서 __zoom 갱신이 사용자 콜백 emit보다 먼저 일어난다는 점이다.
        이 구조 때문에 콜백에서 동작을 건너뛰어도 d3 내부 상태는 이미 오염된다.

      steps:
        - title: "1단계: __zoom 갱신 시점 확인 — Gesture.prototype.zoom"
          insight: |
            this.that.__zoom = transform이 this.emit('zoom')보다 먼저 실행된다.
            즉 사용자 콜백이 호출되는 시점에 DOM의 __zoom은 이미 새 값으로 덮어씌워진 상태다.
          code: |
            // d3-zoom/src/zoom.js — Gesture.prototype.zoom
            zoom: function(key, transform) {
                if (this.mouse && key !== "mouse") this.mouse[1] = transform.invert(this.mouse[0]);
                if (this.touch0 && key !== "touch") this.touch0[1] = transform.invert(this.touch0[0]);
                if (this.touch1 && key !== "touch") this.touch1[1] = transform.invert(this.touch1[0]);
                this.that.__zoom = transform;   // ← 여기서 먼저 갱신
                this.emit("zoom");              // ← 그 다음에 사용자 콜백 호출
                return this;
            }

        - title: "2단계: 누가 Gesture.prototype.zoom을 호출하는가 — mousemoved / touchmoved"
          insight: |
            mousemoved와 touchmoved는 매 포인터 이동마다 새 transform을 계산하고
            g.zoom()을 호출한다. g.zoom()은 위의 Gesture.prototype.zoom이므로,
            사용자 콜백과 무관하게 __zoom이 매 프레임 갱신된다.
          code: |
            // d3-zoom/src/zoom.js — mousemoved
            function mousemoved(event) {
                noevent(event);
                if (!g.moved) { /* ... */ }
                g.event(event)
                 .zoom("mouse", constrain(translate(g.that.__zoom, g.mouse[0] = pointer(event, currentTarget), g.mouse[1]), g.extent, translateExtent));
            }

            // d3-zoom/src/zoom.js — touchmoved
            // (한 손가락 터치의 경우)
            if (g.touch0) p = g.touch0[0], l = g.touch0[1];
            g.zoom("touch", constrain(translate(t, p, l), g.extent, translateExtent));

        - title: "3단계: filter의 한계 확인"
          insight: |
            filter는 mousedowned, touchstarted, wheeled 함수 진입부에서만 평가된다.
            한번 제스처가 시작되면 이후 mousemoved/touchmoved에서는 filter를 다시 확인하지 않는다.
            PreciseMeasurement는 터치 시작 후 홀드 시간으로 판별되므로, filter 시점에는 아직 결정되지 않은 상태다.
          code: |
            // d3-zoom/src/zoom.js — touchstarted (filter는 여기서만 체크)
            function touchstarted(event, ...args) {
                if (!filter.apply(this, arguments)) return;  // ← 이 시점에서만 평가
                // ... 이후 touchmoved에서는 filter 체크 없이 g.zoom() 호출
            }

            // d3-zoom/src/zoom.js — touchmoved (filter 체크 없음)
            function touchmoved(event, ...args) {
                if (!this.__zooming) return;  // zooming 여부만 확인, filter는 안 봄
                var g = gesture(this, args).event(event);
                // ... 바로 g.zoom("touch", ...) 호출
            }

        - title: "4단계: 결론 — 세 개 레이어의 독립성"
          insight: |
            d3 내부 상태(__zoom), React 상태(ZoomContext), 화면 렌더링은 서로 독립적이다.
            PreciseMeasurement에서 콜백을 early return하면 React 상태와 화면은 안 바뀌지만,
            __zoom은 매 프레임 누적된다.
            제스처 종료 후 다음 동작은 누적된 __zoom을 기준으로 시작하므로 화면이 밀린다.
          layerBehavior:
            d3Internal: "매 프레임 갱신됨 (콜백과 무관)"
            reactState: "갱신 안 됨 (setZoomContext 호출 건너뜀)"
            rendering: "변화 없음 (React 상태가 안 바뀌어서)"

    # =========================================================================
    # 면접 활용
    # =========================================================================
    interviewAngle: |
      라이브러리의 공개 API만으로는 원인을 파악할 수 없는 문제를 소스코드까지 추적해서 해결한 사례.
      '콜백에서 막으면 되지 않나?'라는 자연스러운 추측이 왜 틀리는지를 코드 레벨로 설명할 수 있고,
      '왜 filter로 차단하지 않았나?'에 대해 제스처 판별 타이밍의 제약을 근거로 답할 수 있다.
      활용 질문: '재현이 어려운 버그를 어떻게 해결했나', '외부 라이브러리 문제를 만났을 때 어떻게 접근하나'

    ownership:
      - "d3-zoom 소스코드를 직접 읽어 __zoom 갱신 시점과 콜백 호출 시점의 순서를 확인"
      - "filter → 콜백 early return → transform 복원 순서로 대안을 검토하고, 각각의 한계를 근거와 함께 정리"
      - "zoom start/end 시점 transform 저장·복원 설계"
      - "useRef 기반 React–d3 상태 동기화"

  # ===========================================================================
  # KC1: 터치 의도를 즉시 판정하지 않는 지연 판별 설계
  # ===========================================================================
  - id: "deferred-touch-intent"
    tags: ["설계", "인터랙션", "상태-전이", "모바일"]
    relatedProject: "ecg-ruler-tablet"
    title: "터치 시작 시점에서 의도를 판정하지 않고, 후속 이벤트로 미루는 지연 판별 설계"

    situation: |
      데스크톱에서는 마우스 클릭은 측정, 스크롤/핀치는 줌으로 입력 타입만으로 의도를 구분할 수 있었다.
      태블릿에서는 줌·측정·정밀 측정이 모두 "한 손가락 터치"라는 동일한 입력이었다.
      터치 시작(pointerdown) 시점에서는 사용자가 무엇을 하려는지 알 수 없었다.

    task: |
      하나의 터치 입력으로부터 세 가지 행동(측정점 찍기, 줌/팬, 정밀 측정)을 구분하는 판별 구조를 설계해야 했다.
      오판을 줄이면서도, 사용자가 체감할 수 있는 지연이 최소화되어야 했다.

    action: |
      1. 터치 시작 시 의도를 즉시 결정하지 않고 Ruler 상태로 대기한다.
      2. 세 가지 후속 신호로 의도를 판별한다:
         - 800ms 이상 홀드 → PreciseMeasurement로 전이
         - 10px 이상 이동 → Zoom으로 전이
         - 멀티터치 감지(!e.isPrimary) → Zoom으로 전이
      3. 위 조건에 모두 해당하지 않고 pointerup → 측정점 생성(Ruler 행동 완료)
      4. 각 전이 시점에서 타이머를 정리(clearTimeout)하고 포인터 데이터를 무효화한다.

    result: |
      단일 터치 입력에서 줌·측정·정밀 측정 세 가지 의도를 높은 정확도로 구분할 수 있게 되었다.
      iPad / Android Tablet 기준 20개 이상 인터랙션 케이스 수동 검증에서 오입력 관련 리포트 0건.

    # =========================================================================
    # 기술 분석 — 지연 판별의 구조와 코드
    # =========================================================================
    technicalDeepDive:
      summary: |
        핵심 아이디어는 "터치 시작 시 의도를 결정하지 않는다"는 것이다.
        Ruler 상태로 진입한 뒤, 시간·이동량·터치 수라는 세 가지 축의 후속 이벤트를 관찰하여
        상태를 전이한다. 각 축은 독립적으로 평가되며, 가장 먼저 임계값을 넘는 축이 의도를 결정한다.

      steps:
        - title: "1단계: pointerdown — 의도를 결정하지 않고 대기"
          insight: |
            터치 시작 시 startTime, startX, startY를 저장하고, 800ms 타이머를 건다.
            이 시점에서 상태는 그대로 Ruler다. 아직 아무것도 결정하지 않았다.
            멀티터치(!e.isPrimary)인 경우에만 즉시 Zoom으로 전환한다 — 이건 확실한 신호이므로.
          code: |
            // useRuler.Mobile.tsx — handlePointerDown
            case ComponentControlState.Ruler: {
                // 멀티터치인 경우 ruler 기능 종료
                if (!e.isPrimary) {
                    invalidatePointerData(e.pointerId);
                    componentControlState.current = ComponentControlState.Zoom;
                    break;
                }

                const startTime = Date.now();
                // 가만히 누르고 있을 때를 위해(발생되는 이벤트가 따로 없음) setTimeout으로 처리
                const timer = setTimeout(() => {
                    doPreciseMeasure(e);
                }, LONG_PRESS_THRESHOLD_MS);
                const startX = e.clientX;
                const startY = e.clientY;
                addPointerData(e.pointerId, { startTime, timer, startX, startY });
                break;
            }

        - title: "2단계: pointerdown 후 800ms 안에 10px 이상 이동 → Zoom"
          insight: |
            pointermove에서 startX/startY와 현재 위치의 차이가 10px를 넘으면 Zoom으로 전이한다.
            이 전이가 일어나면 타이머는 아직 살아 있지만,
            doPreciseMeasure의 switch-case가 Ruler일 때만 동작하므로 실행되지 않는다.
            "빠르게 움직이는 손가락 = 줌/팬 의도"라는 가정이 이 임계값 하나에 담겨 있다.
          code: |
            // useRuler.Mobile.tsx — handlePointerMove
            case ComponentControlState.Ruler: {
                const { pointerData } = validatePointerData(e.pointerId);

                if (pointerData) {
                    const hasPointerMoved = [
                        [pointerData.startX ?? e.clientX, e.clientX],
                        [pointerData.startY ?? e.clientY, e.clientY],
                    ].some(([prev, curr]) => Math.abs(curr - prev) > ZOOM_ACTION_THRESHOLD_PX);

                    if (hasPointerMoved) {
                        componentControlState.current = ComponentControlState.Zoom;
                    }
                }
            }

        - title: "3단계: 800ms 홀드 완료 → PreciseMeasurement"
          insight: |
            800ms 동안 10px 이상 움직이지도 않고, 손가락을 떼지도 않으면
            setTimeout 콜백(doPreciseMeasure)이 실행된다.
            이 시점에서 포인터 좌표에 해당하는 ECG 데이터가 있으면 PreciseMeasurement로 전이하고,
            정밀 측정 가이드를 화면에 그린다.
            "가만히 오래 누르는 손가락 = 정밀 측정 의도"라는 가정이다.
          code: |
            // useRuler.Mobile.tsx — doPreciseMeasure (setTimeout 콜백)
            case ComponentControlState.Ruler: {
                const { isValidPointer: isValidRulerPointer } = validatePointerData(e.pointerId);
                if (!isValidRulerPointer) break;

                const { pointerX, dataY } = getLeadCoordAtPointer(e);
                if (dataY === undefined || dataY === null) break;

                const guide = createPreciseMeasurementGuide(pointerX, dataY);
                updateGuideElements(guide);

                componentControlState.current = ComponentControlState.PreciseMeasurement;
                break;
            }

        - title: "4단계: pointerup — 최종 행동 결정"
          insight: |
            Ruler 상태에서 pointerup이 오면, 800ms 전에 손가락을 뗀 것이므로 일반 측정이다.
            그래프 근방을 터치했으면 측정점을 생성하고, 아니면 여백 터치로 처리한다.
            PreciseMeasurement 상태에서 pointerup이 오면, 정밀 측정 완료다.
            정밀 측정은 그래프 근방이 아니어도 측정점을 생성한다 — 가이드가 정확한 좌표를 보여주고 있으므로.
            어느 쪽이든 pointerup 후 상태를 Ruler로 되돌린다.
          code: |
            // useRuler.Mobile.tsx — handlePointerUp
            case ComponentControlState.Ruler:
            case ComponentControlState.PreciseMeasurement: {
                const { isValidPointer } = validatePointerData(e.pointerId);
                if (!isValidPointer) break;

                const { isPointerNearGraph, dataY, leadStartY, pointerX } = getLeadCoordAtPointer(e);

                // 정밀 측정 완료 시에는 터치가 그래프 근방을 벗어나도 측정점 생성
                if (
                    (componentControlState.current === ComponentControlState.Ruler && isPointerNearGraph) ||
                    componentControlState.current === ComponentControlState.PreciseMeasurement
                ) {
                    doMeasure({ dataY, leadStartY, pointerX });
                }

                invalidatePointerData(e.pointerId);
                resetGuideElements();
                componentControlState.current = ComponentControlState.Ruler;
                break;
            }

    # =========================================================================
    # 면접 활용
    # =========================================================================
    interviewAngle: |
      "모바일에서 복합 제스처를 어떻게 구분했나" 질문에 활용.
      핵심 메시지: 터치 시작 시점에서는 정보가 부족하므로 판정을 미루고,
      시간·이동량·터치 수라는 세 축의 후속 신호로 의도를 판별하는 구조를 설계했다.
      800ms, 10px 같은 임계값은 실기기 테스트를 통해 튜닝했다.

    ownership:
      - "시간(800ms) × 이동량(10px) × 터치 수 기반 3축 판별 구조 설계"
      - "usePointerData를 통한 포인터별 메타데이터 저장·정리 구조"
      - "임계값 튜닝 — 실기기(iPad, Android Tablet) 테스트 기반"

  # ===========================================================================
  # KC2: 공유 제어 상태로 인터랙션 구간을 트랜잭션처럼 격리
  # ===========================================================================
  - id: "shared-control-state-transaction"
    tags: ["설계", "상태-관리", "인터랙션", "React-d3-연동"]
    relatedProject: "ecg-ruler-tablet"
    title: "줌·측정 레이어가 같은 이벤트를 경쟁하는 환경에서, 공유 제어 상태로 행동 구간을 격리한 설계"

    situation: |
      ECG 그래프에는 두 개의 독립된 인터랙션 레이어가 있었다:
      1. 줌 레이어 (ZoomProvider) — d3-zoom이 SVG에 등록한 pointer 이벤트
      2. 측정 레이어 (useRuler.Mobile) — React가 SVG <g>에 등록한 pointer 이벤트
      같은 터치가 두 레이어에 모두 전달되므로, 한쪽이 활성인 동안 다른 쪽이 반응하면
      화면이 의도치 않게 움직이거나, 측정이 끊기는 문제가 있었다.

    task: |
      줌 레이어와 측정 레이어가 서로의 존재를 알고, 현재 "누가 활성인가"에 따라
      자기 동작을 스킵하거나 실행하는 구조를 만들어야 했다.
      기존 데스크톱 버전은 isRulerActive라는 단방향 boolean Ref로 측정→줌 방향만 알릴 수 있었는데,
      태블릿에서는 줌↔측정 양방향 + 5개 상태 전이가 필요했다.

    action: |
      1. 5개 상태(Ruler, Zoom, PreciseMeasurement, ButtonDragging, RulerOff)를 갖는
         componentControlState Ref를 Context에 두고, 줌·측정 레이어 양쪽이 읽고 쓰도록 했다.
      2. 각 레이어는 자기 핸들러 진입부에서 이 Ref를 읽어 실행 여부를 결정한다:
         - ZoomProvider의 filter: ButtonDragging이면 줌 거부
         - ZoomProvider의 zoom 콜백: PreciseMeasurement면 early return
         - useRuler.Mobile의 handlePointerDown: Ruler 상태가 아니면 측정 동작 스킵
      3. 짧은 행동(드래그)은 트랜잭션처럼 격리 — 진입 시 이전 상태를 ref에 저장,
         종료 시 복원해서 드래그 끝난 뒤 원래 모드로 돌아가도록 했다.

    result: |
      줌·측정·정밀 측정·드래그가 동시에 경쟁하는 환경에서도,
      각 행동 구간이 서로를 침범하지 않는 구조를 만들었다.

    # =========================================================================
    # 기술 분석
    # =========================================================================
    technicalDeepDive:
      summary: |
        핵심은 "누가 지금 활성인가"를 하나의 Ref로 표현하고,
        모든 레이어가 이 Ref를 읽어 자기 동작을 게이트하는 구조다.
        Ref를 쓰는 이유는 d3 이벤트 콜백이 React 렌더 사이클 바깥에서 실행되기 때문이다.
        React state로는 stale closure 문제로 최신 상태를 읽을 수 없다.

      steps:
        - title: "1단계: 공유 제어 상태 정의 — ComponentControlContext"
          insight: |
            5개 상태를 하나의 Ref에 담아 Context로 공유한다.
            isMobile일 때만 componentControlState가 활성화되고,
            데스크톱에서는 null이 되어 기존 isRulerActive 기반 로직이 그대로 동작한다.
          code: |
            // ComponentControlContext.tsx
            export const ComponentControlState = {
                Ruler: 'ruler',
                Zoom: 'zoom',
                RulerOff: 'rulerOff',
                PreciseMeasurement: 'preciseMeasurement',
                ButtonDragging: 'buttonDragging',
            } as const;

            export const ComponentControlProvider = ({ children, isMobile = false }) => {
                const isRulerActive = useRef(false);
                const isLabelHover = useRef(false);
                const componentControlState = useRef<ComponentControlStateType>(ComponentControlState.Ruler);
                return (
                    <ComponentControlContext.Provider
                        value={{
                            isRulerActive,
                            isLabelHover,
                            componentControlState: isMobile ? componentControlState : null,
                        }}
                    >
                        {children}
                    </ComponentControlContext.Provider>
                );
            };

        - title: "2단계: 줌 레이어가 제어 상태를 읽는 방식 — ZoomProvider"
          insight: |
            ZoomProvider는 두 곳에서 componentControlState를 읽는다:
            (1) filter — ButtonDragging이면 줌 자체를 거부한다.
            (2) zoom 콜백 — PreciseMeasurement면 setZoomContext를 건너뛴다.
            두 곳의 역할이 다르다: filter는 "제스처 진입 차단", 콜백은 "진행 중인 제스처 무시".
          code: |
            // ZoomProvider.tsx
            svgSelection.call(
                zoom()
                    .filter((event) => {
                        const isButtonDragging =
                            componentControlState?.current === ComponentControlState.ButtonDragging;
                        return !isButtonDragging && /* ...다른 조건들 */;
                    })
                    .on('zoom', ({ transform }) => {
                        // 정밀측정 중에는 panning 동작 중지
                        if (componentControlState?.current === ComponentControlState.PreciseMeasurement) {
                            rulerState.current = ComponentControlState.PreciseMeasurement;
                            return;
                        }
                        setZoomContext({ transform, reverseScale, smoothedReverseScale });
                    })
            );

        - title: "3단계: 측정 레이어가 제어 상태를 쓰는 방식 — useRuler.Mobile"
          insight: |
            측정 레이어의 handlePointerDown/Move/Up은 switch(componentControlState.current)로
            현재 상태에 따라 다른 분기를 탄다.
            상태 전이는 측정 레이어가 직접 수행한다 (componentControlState.current = ...).
            즉 Ref 하나가 "읽기는 양쪽, 쓰기는 측정 레이어 중심"으로 운영된다.
          code: |
            // useRuler.Mobile.tsx — handlePointerDown
            switch (componentControlState.current) {
                case ComponentControlState.Ruler: {
                    if (!e.isPrimary) {
                        componentControlState.current = ComponentControlState.Zoom;  // 쓰기
                        break;
                    }
                    // ... 800ms 타이머 설정
                    break;
                }
            }

            // useRuler.Mobile.tsx — handlePointerUp
            // 행동 완료 후 항상 Ruler로 복귀
            componentControlState.current = ComponentControlState.Ruler;

        - title: "4단계: 드래그 구간의 트랜잭션 격리 — useMobileDraggableLifecycle"
          insight: |
            드래그는 측정/줌과 달리 짧고 명확한 시작·끝이 있다.
            드래그 시작 시 현재 상태를 lastRulerState ref에 저장하고 ButtonDragging으로 전환한다.
            드래그 중에는 줌 레이어의 filter가 ButtonDragging을 보고 줌을 거부한다.
            드래그 끝나면 저장한 상태로 복원한다.
            이 "저장 → 전환 → 복원" 패턴이 트랜잭션처럼 동작한다.
            복원 시 RulerOff였으면 RulerOff로, 아니면 Ruler로 — "드래그 전에 ruler를 꺼놨는데
            드래그 끝나고 갑자기 켜지면 안 된다"는 edge case를 처리한다.
          code: |
            // useDraggableLifecycle.Mobile.tsx
            const saveInitialComponentControlState = useCallback(() => {
                lastRulerState.current = componentControlState.current;
                componentControlState.current = ComponentControlState.ButtonDragging;
            }, [componentControlState]);

            const revertToInitialComponentControlState = useCallback(() => {
                componentControlState.current =
                    lastRulerState.current === ComponentControlState.RulerOff
                        ? ComponentControlState.RulerOff
                        : ComponentControlState.Ruler;
            }, [componentControlState]);

        - title: "5단계: 왜 React state가 아니라 Ref인가"
          insight: |
            d3-zoom의 이벤트 핸들러(filter, zoom 콜백)는 useEffect 안에서 등록된다.
            React state를 읽으면 등록 시점의 값이 클로저에 캡처되어 stale closure 문제가 생긴다.
            Ref는 .current를 읽는 시점의 최신 값을 항상 반환하므로,
            d3 콜백과 React 핸들러 양쪽에서 동기적으로 같은 상태를 읽을 수 있다.
          code: |
            // ZoomProvider.tsx — useEffect 안에서 d3 콜백 등록
            useEffect(() => {
                svgSelection.call(
                    zoom()
                        .filter((event) => {
                            // componentControlState는 RefObject이므로
                            // .current를 읽는 시점의 최신 값을 얻는다
                            const isButtonDragging =
                                componentControlState?.current === ComponentControlState.ButtonDragging;
                            // React state였다면 여기서 등록 시점의 값이 캡처되어
                            // 상태가 바뀌어도 반영되지 않았을 것이다
                            return !isButtonDragging;
                        })
                );
            }, [componentControlState]); // Ref 객체 자체는 안정적이므로 재등록도 최소화

    # =========================================================================
    # 대안 검토
    # =========================================================================
    alternativesConsidered:
      - approach: "기존 데스크톱 방식 유지 — isRulerActive boolean Ref"
        whyNotViable: |
          데스크톱에서는 "측정 중이다/아니다"라는 boolean 하나로 충분했다.
          태블릿에서는 줌·측정·정밀 측정·드래그·오프 5개 상태가 필요하고,
          줌 레이어도 상태를 읽어야 하므로 단방향 boolean으로는 표현할 수 없다.
      - approach: "Zustand나 React state로 상태 공유"
        whyNotViable: |
          d3-zoom의 이벤트 핸들러는 useEffect에서 등록되어 React 렌더 사이클 바깥에서 실행된다.
          React state를 읽으면 등록 시점의 클로저에 캡처되어 stale closure가 발생한다.
          Zustand의 getState()는 가능하지만, 이 상태는 렌더링 트리거가 필요 없는
          순수 제어 신호이므로 Ref가 가장 적합하다.

    # =========================================================================
    # 면접 활용
    # =========================================================================
    interviewAngle: |
      "여러 인터랙션이 충돌할 때 어떻게 해결했나" 질문에 활용.
      핵심 메시지: 하나의 Ref 기반 공유 제어 상태를 두고, 모든 인터랙션 레이어가 이 상태를 읽어
      자기 동작의 실행 여부를 결정하는 구조를 만들었다.
      드래그처럼 짧은 행동은 "저장 → 전환 → 복원" 패턴으로 트랜잭션처럼 격리했다.
      React state가 아닌 Ref를 선택한 이유를 stale closure 문제와 연결해서 설명할 수 있다.

    ownership:
      - "데스크톱의 단방향 boolean(isRulerActive)을 5상태 양방향 Ref 구조로 재설계"
      - "ZoomProvider filter/콜백, useRuler.Mobile 핸들러 양쪽에서 같은 Ref를 게이트로 사용하는 구조 설계"
      - "드래그 구간의 상태 저장·복원을 통한 트랜잭션 격리 패턴 설계"
      - "React state vs Ref 선택에 대한 stale closure 기반 근거"

  # ===========================================================================
  # KC3: 플랫폼별 인터랙션 정책을 분리한 드래그 훅 설계
  # ===========================================================================
  - id: "platform-specific-drag-hook"
    tags: ["설계", "관심사-분리", "추상화", "확장성"]
    relatedProject: "ecg-ruler-tablet"
    title: "드래그 메커니즘과 플랫폼별 인터랙션 정책을 분리한 훅 레이어링 설계"

    situation: |
      태블릿 특성 상 드래그 가능한 요소(캘리퍼, 버튼 그룹 등)가 늘어나면서,
      요소마다 세 가지 책임이 뒤섞이고 있었다:
      1. 드래그 메커니즘 — pointer 이벤트 등록/해제, isDragging 상태 관리
      2. 인터랙션 정책 — "드래그 중 다른 인터랙션을 어떻게 제어할 것인가"
      3. 드래그 가능 여부 — "지금 이 요소를 드래그할 수 있는 상태인가"
      2-3번은 플랫폼(데스크톱/태블릿)에 따라 달라지는데, 1번은 동일했다.

    task: |
      드래그 메커니즘(플랫폼 무관)과 인터랙션 정책(플랫폼별)을 분리하여,
      데스크톱과 태블릿에서 동일한 드래그 요소가 다른 정책으로 동작하도록 해야 했다.

    action: |
      1. base 훅(useDraggableLifecycle)은 순수한 드래그 메커니즘만 담당한다:
         - isDragging 상태 관리
         - document에 pointermove/pointerup 이벤트 등록/해제
         - capture 단계 등록으로 다른 핸들러보다 먼저 이벤트를 가로챔
         - checkDraggable 콜백으로 "드래그 가능 여부" 판단을 외부에 위임
      2. mobile 래퍼(useMobileDraggableLifecycle)는 플랫폼 고유 정책만 담당한다:
         - 드래그 시작 시 공유 제어 상태를 ButtonDragging으로 전환
         - 드래그 종료 시 이전 상태로 복원
         - defaultDraggableStates(Ruler, RulerOff)일 때만 드래그 허용
      3. mobile 래퍼는 base 훅의 dragHandlers를 래핑하고, checkDraggable을 주입하여
         base 훅을 호출하는 구조다.

    result: |
      데스크톱에서는 base 훅만 사용하고, 태블릿에서는 mobile 래퍼를 통해 같은 드래그 요소가
      다른 인터랙션 정책으로 동작하는 구조를 만들었다.
      새 드래그 요소를 추가할 때 기존 인터랙션 코드를 건드릴 필요가 없다.

    # =========================================================================
    # 기술 분석
    # =========================================================================
    technicalDeepDive:
      summary: |
        두 훅의 레이어링에서 흥미로운 점은 세 가지다:
        (1) capture 단계 이벤트 등록으로 드래그가 다른 모든 인터랙션을 선점하는 구조
        (2) mobile 래퍼의 상태 저장·복원이 트랜잭션 격리 역할을 하는 점
        (3) checkDraggable을 클로저 팩토리로 만들어 Ref의 최신 값을 항상 읽는 설계

      steps:
        - title: "1단계: base 훅 — 순수 드래그 메커니즘"
          insight: |
            base 훅은 플랫폼 고유 개념을 전혀 모른다.
            isDragging이 true면 document에 capture 단계로 pointermove/pointerup을 건다.
            capture 단계인 이유: 드래그 중에는 DOM 트리의 어떤 핸들러보다 먼저 이벤트를 가로채서
            줌이나 측정 같은 다른 인터랙션이 반응하지 못하게 해야 하기 때문이다.
            checkDraggable 콜백으로 "지금 드래그 가능한가"를 외부에 위임한다.
          code: |
            // useDraggableLifecycle.tsx
            export const useDraggableLifecycle = (
                dragEventHandlers: DragEventHandlers,
                checkDraggable?: () => boolean
            ) => {
                const [isDragging, setIsDragging] = useState(false);

                const handlePointerDown = useCallback((e: React.PointerEvent) => {
                    if (checkDraggable && !checkDraggable()) return;
                    setIsDragging(true);
                    if (onDragStart) onDragStart(e);
                }, [checkDraggable, onDragStart]);

                // capture 단계에서 처리함으로써 다른 동작과 겹치지 않게 방지
                useEffect(() => {
                    if (isDragging) {
                        document.addEventListener('pointermove', handlePointerMove, { capture: true });
                        document.addEventListener('pointerup', handlePointerUp, { capture: true });
                    } else {
                        document.removeEventListener('pointermove', handlePointerMove, { capture: true });
                        document.removeEventListener('pointerup', handlePointerUp, { capture: true });
                    }
                    return () => { /* cleanup */ };
                }, [isDragging]);

                return { isDragging, handlePointerDown };
            };

        - title: "2단계: mobile 래퍼 — 플랫폼 고유 정책 주입"
          insight: |
            mobile 래퍼는 base 훅을 직접 수정하지 않고, 두 가지를 주입한다:
            (1) dragHandlers를 래핑 — onDragStart에 상태 저장, onDragEnd에 상태 복원을 삽입
            (2) checkDraggable을 주입 — defaultDraggableStates(Ruler, RulerOff)일 때만 드래그 허용
            래핑 패턴 덕분에 원래 dragHandlers의 로직은 그대로 실행되고,
            앞뒤에 정책 관련 동작만 추가된다.
          code: |
            // useDraggableLifecycle.Mobile.tsx
            export const useMobileDraggableLifecycle = (dragEventHandlers: DragEventHandlers) => {
                const { componentControlState } = useMobileComponentControlState();
                const lastRulerState = useRef<ComponentControlStateType>(null);

                const saveInitialComponentControlState = useCallback(() => {
                    lastRulerState.current = componentControlState.current;
                    componentControlState.current = ComponentControlState.ButtonDragging;
                }, [componentControlState]);

                const revertToInitialComponentControlState = useCallback(() => {
                    componentControlState.current =
                        lastRulerState.current === ComponentControlState.RulerOff
                            ? ComponentControlState.RulerOff
                            : ComponentControlState.Ruler;
                }, [componentControlState]);

                const dragHandlers = useMemo(() => ({
                    onDragStart: (e) => {
                        onDragStart?.(e);                        // 원래 로직 실행
                        saveInitialComponentControlState();       // + 정책: 상태 저장
                    },
                    onDrag,                                       // 원래 로직 그대로
                    onDragEnd: (e) => {
                        onDragEnd?.(e);                           // 원래 로직 실행
                        revertToInitialComponentControlState();   // + 정책: 상태 복원
                    },
                }), [/* deps */]);

                const checkDraggable = (ref: typeof componentControlState) => () =>
                    defaultDraggableStates.has(ref.current);

                return useDraggableLifecycle(dragHandlers, checkDraggable(componentControlState));
            };

        - title: "3단계: checkDraggable 클로저 팩토리 — stale closure 방지"
          insight: |
            checkDraggable을 인라인 함수로 만들면 매 렌더마다 새 함수가 생겨
            base 훅의 handlePointerDown이 매번 재생성된다.
            Ref를 인자로 받는 팩토리로 만들면 반환된 함수가 Ref 객체를 캡처하므로,
            함수 참조는 안정적이면서도 호출 시점의 .current 최신 값을 항상 읽는다.
          code: |
            // 팩토리 패턴: Ref 객체를 캡처하여 안정적인 함수 참조 반환
            const checkDraggable = (componentControlStateRef: typeof componentControlState) => () =>
                defaultDraggableStates.has(componentControlStateRef.current);
            // componentControlStateRef는 Ref 객체이므로 참조가 안정적
            // .current는 호출 시점에 읽으므로 항상 최신 값

        - title: "4단계: defaultDraggableStates — 정책의 데이터화"
          insight: |
            "어떤 상태에서 드래그가 가능한가"라는 정책이 Set으로 데이터화되어 있다.
            새로운 상태가 추가되거나 정책이 바뀌어도 이 Set만 수정하면 된다.
            코드 분기(if/switch)가 아니라 데이터(Set)로 정책을 표현한 점이 확장에 유리하다.
          code: |
            // ButtonGroup/baseInfo.ts
            export const defaultDraggableStates = new Set<ComponentControlStateType>([
                ComponentControlState.Ruler,
                ComponentControlState.RulerOff,
            ]);

    # =========================================================================
    # 면접 활용
    # =========================================================================
    interviewAngle: |
      "공통화를 넘어서 설계적으로 고민한 부분이 있나" 질문에 활용.
      단순히 중복 코드를 훅으로 뽑은 것이 아니라, 세 가지 관심사를 분리한 점을 강조:
      (1) 메커니즘(base) vs 정책(mobile wrapper) 분리
      (2) capture 단계 이벤트 등록이라는 선점 전략
      (3) 정책을 데이터(Set)와 콜백(checkDraggable) 주입으로 표현하여 확장성 확보
      "데스크톱용 코드를 수정하지 않고 태블릿 지원을 추가할 수 있었다"는 결과로 마무리.

    ownership:
      - "드래그 메커니즘(base)과 인터랙션 정책(mobile wrapper)의 관심사 분리 설계"
      - "capture 단계 이벤트 등록을 통한 드래그 우선권 확보 전략"
      - "checkDraggable 클로저 팩토리를 통한 Ref 기반 정책 주입 인터페이스"
      - "defaultDraggableStates Set을 통한 정책 데이터화"
