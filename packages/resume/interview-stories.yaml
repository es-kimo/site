# =============================================================================
# Interview Stories — 면접용 스토리 구조화
# =============================================================================
# 구조:
# - 경험(story) 단위로 최상위 정리
# - 각 경험에서 나올 수 있는 면접 질문-답변이 questions 배열에 위치
# - 답변은 결론→이유→사례→회고 형식 (면접에서 바로 말할 수 있도록)
# - technicalDeepDives, alternativesConsidered는 세부 참고 자료
# - tags로 질문 유형별 빠른 검색 (끈기, 디버깅, 협업, 설계 등)
# - relatedProject로 이력서 항목과 연결
# =============================================================================

stories:
  # ===========================================================================
  # 태블릿 ECG 그래프 터치 인터랙션 시스템
  # ===========================================================================
  - id: "ecg-tablet-touch-system"
    tags: ["끈기", "디버깅", "설계", "인터랙션", "상태-관리", "React-d3-연동", "라이브러리-내부-추적", "관심사-분리"]
    relatedProject: "ecg-ruler-tablet"
    title: "태블릿 ECG 그래프 터치 인터랙션 시스템"

    questions:
      # ── Q1 ──────────────────────────────────────────────────────────────────
      - q: "이 프로젝트에서 가장 어려웠던 점은?"
        conclusion: >
          터치 하나로 시작되는 5가지 동작을, 시작 시점에 구분할 수 없다는 것이 가장 어려웠습니다.
        reason: >
          데스크톱에서는 마우스 클릭과 스크롤, 키보드가 물리적으로 다른 입력이라 자연스레 구분되는데,
          태블릿에서는 점 생성도, 줌도, 정밀 측정도, 버튼 드래그도 전부 손가락 터치 하나입니다.
        example: >
          그래서 시작 시점에 판별하는 대신, 후속 이벤트에서 상태를 전이하는 구조를 만들었습니다.
          `Ruler → PreciseMeasurement`은 800ms 홀드,
          `Ruler → Zoom`은 이동량 초과나 멀티터치, 이런 식으로요.
          모든 포인터 핸들러가 현재 상태를 기준으로 분기하고, 스스로 다음 상태로 전이합니다.
        retrospective: >
          결과적으로 이 상태 기반 분기 구조 덕분에, 이후 캘리퍼 드래그나 버튼 그룹 같은 기능을 추가할 때
          상태만 하나 추가하면 기존 동작에 영향 없이 확장할 수 있었습니다.
          다만 switch문이 모든 핸들러에 퍼져 있어서, 상태가 더 많아지면 XState 같은 명시적 상태 머신으로
          전이 규칙을 한 곳에 모으는 게 나았을 거라고 봅니다.

      # ── Q2 ──────────────────────────────────────────────────────────────────
      - q: "d3-zoom과 충돌이 있었다고 했는데, 구체적으로?"
        conclusion: >
          filter로 이벤트를 막는 것만으로는 부족했습니다.
          d3의 **내부 transform 상태가 오염되는 문제**가 별도로 있었습니다.
        reason: >
          d3-zoom은 자체적으로 pan/pinch를 처리하면서 내부에 transform을 누적합니다.
          filter로 이벤트를 차단해도, 정밀 측정 중 손가락의 미세한 움직임이 d3 내부 transform에 반영되어,
          측정이 끝나면 화면 위치가 밀려 있었습니다.
        example: >
          zoom `start` 시점에 현재 transform을 저장하고,
          `zoom` 이벤트에서 정밀 측정 상태이면 적용을 건너뛰고,
          `end` 시점에 저장된 transform으로 d3의 내부 상태를 강제 복원하는 방식을 적용했습니다.
          이때 정밀 측정 여부를 d3의 이벤트 콜백 안에서 읽어야 해서,
          React state가 아닌 ref로 양쪽 시스템을 연결했습니다.
        retrospective: >
          d3를 아예 끄고 직접 zoom/pan을 구현하는 방법도 가능했지만,
          d3-zoom이 관성 스크롤이나 pinch 처리를 이미 잘 해주고 있었기 때문에,
          교체보다는 공존시키면서 충돌 지점만 보정하는 전략을 택했습니다.

      # ── Q3 ──────────────────────────────────────────────────────────────────
      - q: "상태 관리를 왜 useRef로 했나요? useState면 안 되나요?"
        conclusion: >
          이벤트 핸들러 간 **동기적 읽기/쓰기가 보장되어야 했기 때문**입니다.
        reason: >
          `handlePointerDown`에서 상태를 `Zoom`으로 바꾸고, 같은 터치 사이클의
          `handlePointerMove`에서 바로 그 값을 읽어야 합니다.
          useState는 배치 업데이트되므로 다음 렌더까지 이전 값이 유지됩니다.
          터치 이벤트가 프레임 단위로 발생하는 상황에서 한 프레임의 지연도 잘못된 분기로 이어집니다.
        example: >
          추가로, d3-zoom의 filter 함수는 React 렌더 사이클 바깥에서 호출되기 때문에,
          최신 상태를 동기적으로 읽을 수 있는 ref여야만 했습니다.
          두 시스템을 잇는 다리 역할까지 ref가 맡은 셈입니다.
        retrospective: >
          다만 ref의 단점은 변경이 추적되지 않는다는 것입니다.
          디버깅할 때 "언제 누가 이 값을 바꿨는지" 찾기 어렵습니다.
          지금은 상태가 5개라 관리가 가능했지만, 더 복잡해지면 상태 전이를 로깅하는 래퍼를 씌우거나,
          명시적 상태 머신 라이브러리로 전환하는 게 맞다고 봅니다.

      # ── Q4 ──────────────────────────────────────────────────────────────────
      - q: "여러 인터랙션이 동시에 발생하면 어떻게 처리했나요?"
        conclusion: >
          하나의 공유 제어 상태(Ref)를 두고, 모든 인터랙션 레이어가 이 값을 읽어
          자기 동작의 실행 여부를 결정하는 구조를 만들었습니다.
        reason: >
          ECG 그래프에는 d3-zoom이 관리하는 줌 레이어와 React가 관리하는 측정 레이어가 있는데,
          같은 터치 이벤트가 두 레이어에 모두 전달됩니다.
          한쪽이 활성인 동안 다른 쪽이 반응하면 화면이 의도치 않게 움직이거나 측정이 끊깁니다.
        example: >
          5개 상태(`Ruler`, `Zoom`, `PreciseMeasurement`, `ButtonDragging`, `RulerOff`)를
          하나의 Ref에 담아 Context로 공유했습니다.
          줌 레이어의 filter에서는 `ButtonDragging`이면 줌을 거부하고,
          zoom 콜백에서는 `PreciseMeasurement`면 적용을 건너뜁니다.
          드래그처럼 짧은 행동은 시작 시 이전 상태를 저장하고, 종료 시 복원하는
          "트랜잭션 격리" 패턴을 적용했습니다.
        retrospective: >
          데스크톱에서는 boolean 하나(`isRulerActive`)로 충분했지만,
          태블릿에서는 양방향 5상태가 필요했습니다.
          이 구조 덕분에 새 인터랙션을 추가할 때 상태 하나와 게이트 조건만 추가하면 되지만,
          상태 수가 더 늘어나면 전이 규칙을 명시적으로 선언하는 상태 머신이 더 적합할 것 같습니다.

      # ── Q5 ──────────────────────────────────────────────────────────────────
      - q: "드래그 기능을 플랫폼별로 어떻게 분리했나요?"
        conclusion: >
          드래그 메커니즘과 플랫폼별 인터랙션 정책을 레이어로 분리했습니다.
          base 훅이 순수한 드래그 동작을, mobile 래퍼가 플랫폼 고유 정책을 담당합니다.
        reason: >
          드래그 가능한 요소가 늘어나면서, 요소마다 이벤트 등록·해제, `isDragging` 관리,
          "드래그 중 다른 인터랙션 제어", "지금 드래그 가능한 상태인가" 판단이 뒤섞이고 있었습니다.
          이 중 첫 번째만 플랫폼 공통이고, 나머지는 태블릿에서만 필요했습니다.
        example: >
          base 훅(`useDraggableLifecycle`)은 `isDragging` 상태 관리와 capture 단계 이벤트 등록만 합니다.
          mobile 래퍼가 이 훅을 감싸면서 드래그 시작 시 공유 상태를 `ButtonDragging`으로 전환하고,
          종료 시 복원하며, `checkDraggable` 콜백으로 "지금 드래그 허용 상태인지"를 주입합니다.
          정책을 `Set`으로 데이터화해서, 새 상태가 추가되면 Set만 수정하면 됩니다.
        retrospective: >
          데스크톱 코드를 수정하지 않고 태블릿 지원을 추가할 수 있었고,
          새 드래그 요소를 추가할 때 기존 인터랙션 코드를 건드릴 필요가 없었습니다.
          다만 래퍼 레이어가 깊어지면 호출 순서를 파악하기 어려울 수 있어,
          훅 체인이 3단계를 넘긴다면 합성 패턴을 재고해야 할 것 같습니다.

      # ── Q6 ──────────────────────────────────────────────────────────────────
      - q: "이 구현에서 아쉬운 점이나, 다시 한다면?"
        conclusion: >
          두 가지입니다. JSX를 상태에 직접 저장한 점과, switch문이 핸들러마다 반복되는 점.
        example: >
          지금은 `useState<Ruler[]>`에 `JSX.Element`을 직접 저장하고 있는데,
          데이터(좌표, id, 타입)만 저장하고 렌더 시점에 JSX로 변환했다면 삭제·수정 로직이 더 단순했을 겁니다.
          또 상태 전이가 4개 핸들러의 switch문에 분산되어 있어서,
          상태가 하나 추가되면 모든 핸들러를 감사해야 합니다.
        retrospective: >
          당시에는 5개 상태, 4개 핸들러 규모에서 이 정도면 충분히 관리할 수 있다고 판단했고,
          실제로 시나리오 테스트 20건 이상 통과, 오입력 리포트 0건이라는 결과가 나왔습니다.
          다시 한다면 데이터와 뷰를 분리하고, 상태 전이 규칙을 한 곳에 선언적으로 모으는 방식으로
          리팩터링할 것 같습니다.

    # =========================================================================
    # Ownership
    # =========================================================================
    ownership:
      - "d3-zoom 소스코드를 직접 읽어 __zoom 갱신 시점과 콜백 호출 시점의 순서를 확인"
      - "시간(800ms) × 이동량(10px) × 터치 수 기반 3축 판별 구조 설계"
      - "5상태 양방향 Ref 구조 재설계 (데스크톱 단방향 boolean에서)"
      - "드래그 메커니즘(base)과 인터랙션 정책(mobile wrapper) 관심사 분리 설계"
      - "capture 단계 이벤트 등록을 통한 드래그 우선권 확보 전략"
      - "실기기(iPad, Android Tablet) 테스트 기반 임계값 튜닝"
      - "zoom start/end 시점 transform 저장·복원 설계"
      - "useRef 기반 React–d3 상태 동기화"

    # =========================================================================
    # Technical Deep Dives — 세부 참고 자료
    # =========================================================================
    technicalDeepDives:
      # ── Deep Dive 1 ──────────────────────────────────────────────────────────
      - title: "d3-zoom 내부 __zoom 갱신 구조와 transform 복원"
        summary: |
          d3-zoom은 DOM 엘리먼트의 __zoom 프로퍼티에 현재 transform을 저장한다.
          핵심은 Gesture.prototype.zoom 메서드에서 __zoom 갱신이 사용자 콜백 emit보다 먼저 일어난다는 점이다.
          이 구조 때문에 콜백에서 동작을 건너뛰어도 d3 내부 상태는 이미 오염된다.
        steps:
          - title: "__zoom 갱신 시점 — Gesture.prototype.zoom"
            insight: |
              this.that.__zoom = transform이 this.emit('zoom')보다 먼저 실행된다.
              즉 사용자 콜백이 호출되는 시점에 DOM의 __zoom은 이미 새 값으로 덮어씌워진 상태다.
            code: |
              // d3-zoom/src/zoom.js — Gesture.prototype.zoom
              zoom: function(key, transform) {
                  if (this.mouse && key !== "mouse") this.mouse[1] = transform.invert(this.mouse[0]);
                  if (this.touch0 && key !== "touch") this.touch0[1] = transform.invert(this.touch0[0]);
                  if (this.touch1 && key !== "touch") this.touch1[1] = transform.invert(this.touch1[0]);
                  this.that.__zoom = transform;   // ← 여기서 먼저 갱신
                  this.emit("zoom");              // ← 그 다음에 사용자 콜백 호출
                  return this;
              }

          - title: "mousemoved / touchmoved에서 매 프레임 호출"
            insight: |
              mousemoved와 touchmoved는 매 포인터 이동마다 새 transform을 계산하고
              g.zoom()을 호출한다. 사용자 콜백과 무관하게 __zoom이 매 프레임 갱신된다.
            code: |
              // d3-zoom/src/zoom.js — mousemoved
              function mousemoved(event) {
                  noevent(event);
                  g.event(event)
                   .zoom("mouse", constrain(translate(g.that.__zoom, g.mouse[0] = pointer(event, currentTarget), g.mouse[1]), g.extent, translateExtent));
              }

          - title: "filter의 한계 — 제스처 시작 후에는 체크 안 함"
            insight: |
              filter는 mousedown/touchstart 진입부에서만 평가된다.
              한번 제스처가 시작되면 이후 mousemoved/touchmoved에서는 filter를 다시 확인하지 않는다.
              PreciseMeasurement는 터치 시작 후 홀드 시간으로 판별되므로, filter 시점에는 아직 결정되지 않은 상태다.

          - title: "세 개 레이어의 독립성"
            insight: |
              d3 내부 상태(__zoom), React 상태(ZoomContext), 화면 렌더링은 서로 독립적이다.
              PreciseMeasurement에서 콜백을 early return하면 React 상태와 화면은 안 바뀌지만,
              __zoom은 매 프레임 누적된다.
              제스처 종료 후 다음 동작은 누적된 __zoom을 기준으로 시작하므로 화면이 밀린다.
            layerBehavior:
              d3Internal: "매 프레임 갱신됨 (콜백과 무관)"
              reactState: "갱신 안 됨 (setZoomContext 호출 건너뜀)"
              rendering: "변화 없음 (React 상태가 안 바뀌어서)"

      # ── Deep Dive 2 ──────────────────────────────────────────────────────────
      - title: "지연 판별의 3축 구조: 시간 × 이동량 × 터치 수"
        summary: |
          핵심 아이디어는 "터치 시작 시 의도를 결정하지 않는다"는 것이다.
          Ruler 상태로 진입한 뒤, 시간·이동량·터치 수라는 세 가지 축의 후속 이벤트를 관찰하여
          상태를 전이한다. 각 축은 독립적으로 평가되며, 가장 먼저 임계값을 넘는 축이 의도를 결정한다.
        steps:
          - title: "pointerdown — 의도를 결정하지 않고 대기"
            insight: |
              터치 시작 시 startTime, startX, startY를 저장하고, 800ms 타이머를 건다.
              이 시점에서 상태는 그대로 Ruler다. 아직 아무것도 결정하지 않았다.
              멀티터치(!e.isPrimary)인 경우에만 즉시 Zoom으로 전환한다.
            code: |
              // useRuler.Mobile.tsx — handlePointerDown
              case ComponentControlState.Ruler: {
                  if (!e.isPrimary) {
                      invalidatePointerData(e.pointerId);
                      componentControlState.current = ComponentControlState.Zoom;
                      break;
                  }
                  const startTime = Date.now();
                  const timer = setTimeout(() => {
                      doPreciseMeasure(e);
                  }, LONG_PRESS_THRESHOLD_MS);
                  const startX = e.clientX;
                  const startY = e.clientY;
                  addPointerData(e.pointerId, { startTime, timer, startX, startY });
                  break;
              }

          - title: "pointermove — 이동량 초과 시 Zoom 전이"
            insight: |
              pointermove에서 startX/startY와 현재 위치의 차이가 10px를 넘으면 Zoom으로 전이한다.
              "빠르게 움직이는 손가락 = 줌/팬 의도"라는 가정이 이 임계값 하나에 담겨 있다.
            code: |
              // useRuler.Mobile.tsx — handlePointerMove
              case ComponentControlState.Ruler: {
                  const { pointerData } = validatePointerData(e.pointerId);
                  if (pointerData) {
                      const hasPointerMoved = [
                          [pointerData.startX ?? e.clientX, e.clientX],
                          [pointerData.startY ?? e.clientY, e.clientY],
                      ].some(([prev, curr]) => Math.abs(curr - prev) > ZOOM_ACTION_THRESHOLD_PX);
                      if (hasPointerMoved) {
                          componentControlState.current = ComponentControlState.Zoom;
                      }
                  }
              }

          - title: "800ms 홀드 완료 → PreciseMeasurement"
            insight: |
              800ms 동안 10px 이상 움직이지도 않고, 손가락을 떼지도 않으면
              setTimeout 콜백(doPreciseMeasure)이 실행된다.
              포인터 좌표에 해당하는 ECG 데이터가 있으면 PreciseMeasurement로 전이하고,
              정밀 측정 가이드를 화면에 그린다.

          - title: "pointerup — 최종 행동 결정"
            insight: |
              Ruler 상태에서 pointerup이 오면, 800ms 전에 손가락을 뗀 것이므로 일반 측정이다.
              그래프 근방을 터치했으면 측정점을 생성하고, 아니면 여백 터치로 처리한다.
              PreciseMeasurement 상태에서 pointerup이 오면, 정밀 측정 완료로 측정점을 생성한다.

      # ── Deep Dive 3 ──────────────────────────────────────────────────────────
      - title: "공유 제어 상태와 트랜잭션 격리"
        summary: |
          핵심은 "누가 지금 활성인가"를 하나의 Ref로 표현하고,
          모든 레이어가 이 Ref를 읽어 자기 동작을 게이트하는 구조다.
          Ref를 쓰는 이유는 d3 이벤트 콜백이 React 렌더 사이클 바깥에서 실행되기 때문이다.
        steps:
          - title: "ComponentControlContext — 5개 상태 Ref"
            insight: |
              5개 상태를 하나의 Ref에 담아 Context로 공유한다.
              isMobile일 때만 componentControlState가 활성화되고,
              데스크톱에서는 null이 되어 기존 isRulerActive 기반 로직이 그대로 동작한다.
            code: |
              export const ComponentControlState = {
                  Ruler: 'ruler',
                  Zoom: 'zoom',
                  RulerOff: 'rulerOff',
                  PreciseMeasurement: 'preciseMeasurement',
                  ButtonDragging: 'buttonDragging',
              } as const;

          - title: "줌 레이어가 제어 상태를 읽는 방식"
            insight: |
              ZoomProvider는 두 곳에서 componentControlState를 읽는다:
              (1) filter — ButtonDragging이면 줌 자체를 거부한다.
              (2) zoom 콜백 — PreciseMeasurement면 setZoomContext를 건너뛴다.
              두 곳의 역할이 다르다: filter는 "제스처 진입 차단", 콜백은 "진행 중인 제스처 무시".

          - title: "드래그 구간의 트랜잭션 격리"
            insight: |
              드래그는 짧고 명확한 시작·끝이 있다.
              드래그 시작 시 현재 상태를 lastRulerState ref에 저장하고 ButtonDragging으로 전환한다.
              드래그 끝나면 저장한 상태로 복원한다.
              이 "저장 → 전환 → 복원" 패턴이 트랜잭션처럼 동작한다.
            code: |
              const saveInitialComponentControlState = useCallback(() => {
                  lastRulerState.current = componentControlState.current;
                  componentControlState.current = ComponentControlState.ButtonDragging;
              }, [componentControlState]);

              const revertToInitialComponentControlState = useCallback(() => {
                  componentControlState.current =
                      lastRulerState.current === ComponentControlState.RulerOff
                          ? ComponentControlState.RulerOff
                          : ComponentControlState.Ruler;
              }, [componentControlState]);

    # =========================================================================
    # 검토한 대안
    # =========================================================================
    alternativesConsidered:
      - approach: "filter에서 PreciseMeasurement 상태일 때 제스처 자체를 차단"
        whyNotViable: >
          filter는 mousedown/touchstart 진입 시점에만 평가된다.
          PreciseMeasurement는 터치 시작 후 홀드 시간(800ms) + 이동량으로 판별되므로,
          제스처가 이미 시작된 후에야 모드가 결정된다.
          따라서 filter 시점에서는 차단할 정보가 없다.

      - approach: "zoom 콜백에서 early return만으로 해결"
        whyNotViable: >
          d3-zoom은 Gesture.prototype.zoom 내부에서 this.that.__zoom = transform을
          콜백(emit) 호출보다 먼저 실행한다.
          콜백에서 아무것도 안 해도 element.__zoom은 이미 갱신된 상태이므로,
          React 렌더링은 안 바뀌지만 d3 내부 상태는 매 프레임 누적된다.

      - approach: "기존 데스크톱 방식 유지 — isRulerActive boolean Ref"
        whyNotViable: >
          데스크톱에서는 "측정 중이다/아니다"라는 boolean 하나로 충분했다.
          태블릿에서는 줌·측정·정밀 측정·드래그·오프 5개 상태가 필요하고,
          줌 레이어도 상태를 읽어야 하므로 단방향 boolean으로는 표현할 수 없다.

      - approach: "Zustand나 React state로 상태 공유"
        whyNotViable: >
          d3-zoom의 이벤트 핸들러는 useEffect에서 등록되어 React 렌더 사이클 바깥에서 실행된다.
          React state를 읽으면 등록 시점의 클로저에 캡처되어 stale closure가 발생한다.
          이 상태는 렌더링 트리거가 필요 없는 순수 제어 신호이므로 Ref가 가장 적합하다.

  # ===========================================================================
  # 판매관리 시스템 — Form/Filter 추상화, 클라이언트 암호화, 개발 환경 전략
  # ===========================================================================
  - id: "mai-sales-system"
    tags: ["설계", "추상화", "타입-안전성", "보안", "개발-환경", "Form", "협업"]
    relatedProject: "mai-sales"
    title: "판매관리 시스템 — Form/Filter 추상화와 클라이언트 암호화"

    # =========================================================================
    # Question Flow — 면접 흐름 시각화
    # =========================================================================
    # Entry: "이 프로젝트에서 어떤 역할을 했나요?"
    # │
    # ├─ A. Form/Filter 표준화
    # │  ├─ A1. "Form 표준화가 구체적으로 뭔가요?"
    # │  │  ├─ A1a. "왜 하나가 아니라 두 개로 나눴나요?"
    # │  │  └─ A1b. "타입 안전성은 어떻게 확보했나요?"
    # │  └─ A2. "필터는 어떻게 표준화했나요?"
    # │     ├─ A2a. "필드 간 종속 관계는 어떻게 관리했나요?"
    # │     └─ A2b. "태그와 폼 상태를 왜 분리했나요?"
    # │
    # ├─ B. 파일 다운로드·암호화
    # │  ├─ B1. "클라이언트 암호화라는 게 구체적으로 뭔가요?"
    # │  │  ├─ B1a. "서버에서 하면 안 되나요?"
    # │  │  └─ B1b. "패스워드 분실하면 어떡하나요?"
    # │  └─ B2. "스트리밍은 왜 필요했나요?"
    # │     └─ B2a. "스트리밍과 암호화를 연결할 수는 없었나요?"
    # │
    # └─ C. 개발 환경 전략
    #    ├─ C1. "90%는 어떻게 달성했나요?"
    #    │  └─ C1a. "mock이 실제 API와 달라지면 어떻게 하나요?"
    #    └─ C2. "스키마를 왜 3개로 나눴나요?"
    # =========================================================================

    entryQuestion:
      q: "이 프로젝트에서 어떤 역할을 했나요?"
      answer: >
        v1.0 초기 개발에 참여해서, 크게 세 가지를 담당했습니다.
        첫째, 화면마다 반복되는 대형 폼과 필터 구현을 디자인 시스템 위에서 표준화했습니다.
        둘째, 대용량 파일 내보내기에서 스트리밍 다운로드와 클라이언트 사이드 암호화를 설계했습니다.
        셋째, 백엔드 변경에 의존하지 않고 개발을 이어갈 수 있도록 API mocking 전략을 세웠습니다.

    branches:
      # ── Branch A: Form/Filter 표준화 ──────────────────────────────────────
      - id: "form-filter"
        trigger: "면접관이 '폼 표준화'를 더 물어볼 때"
        questions:
          # ── A1 ────────────────────────────────────────────────────────────
          - id: "A1"
            q: "Form 표준화가 구체적으로 뭔가요?"
            answer: >
              경영관리 시스템이다 보니 화면마다 10~20개 필드를 가진 대형 폼이 있었습니다.
              필드마다 검증, 에러 표시, 값 동기화를 각각 구현하면 방식이 분산되기 때문에,
              사내 디자인 시스템 컴포넌트 위에 react-hook-form을 통합하는 래퍼 레이어를 만들었습니다.
              Base 컴포넌트와 RHF 통합 변형, 두 벌로 나눠서 제공합니다.
            followUps:
              # ── A1a ──────────────────────────────────────────────────────
              - id: "A1a"
                q: "왜 하나의 컴포넌트가 아니라 두 개로 나눴나요?"
                answer: >
                  디자인 시스템 컴포넌트가 react-hook-form에 직접 의존하면,
                  RHF 없이 쓰는 곳에서도 불필요한 의존성을 갖게 됩니다.
                  예를 들어 단순 표시 목적의 Input이나, 다른 폼 라이브러리를 쓰는 곳에서는 RHF가 필요 없거든요.
                  Base 컴포넌트는 standalone으로 동작하고, RHF 변형은 그 위에 폼 연동만 추가하는 구조입니다.
                  이렇게 하면 디자인 시스템 레이어와 제품 코드 사이의 의존성을 끊을 수 있었습니다.
              # ── A1b ──────────────────────────────────────────────────────
              - id: "A1b"
                q: "타입 안전성은 어떻게 확보했나요?"
                answer: >
                  WithRHF<T>라는 유틸리티 타입을 만들었습니다.
                  폼이 관리하는 prop — value, ref — 을 컴파일 타임에 제거하고, name을 필수로 요구합니다.
                  개발자가 실수로 value를 직접 넘기면 타입 에러가 나니까, 잘못된 사용을 빌드 시점에 잡을 수 있습니다.
                  useFormField 훅이 onChange 머지, 에러 메시지 렌더링을 중앙에서 처리해서
                  각 필드 컴포넌트가 반복 구현할 필요가 없도록 했습니다.

          # ── A2 ────────────────────────────────────────────────────────────
          - id: "A2"
            q: "필터는 어떻게 표준화했나요?"
            answer: >
              화면마다 5~10개 필터가 있고, 선택하면 태그로 표시되고, 태그를 지우면 필터가 해제되는 패턴이 반복되었습니다.
              useFilter라는 훅을 만들어서 폼 상태 관리, 필터 태그 동기화, 필드 간 종속 관계 처리를 한 곳에서 처리합니다.
            followUps:
              # ── A2a ──────────────────────────────────────────────────────
              - id: "A2a"
                q: "필드 간 종속 관계는 어떻게 관리했나요?"
                answer: >
                  dependencyMap이라는 Map<FieldName, Set<FieldName>> 구조를 받습니다.
                  예를 들어 '지역'을 바꾸면 '하위 지역' 필드가 자동으로 기본값으로 리셋되고, 관련 태그도 제거됩니다.
                  useEffect 체인으로 암묵적으로 처리하는 대신 선언적으로 정의한 이유는,
                  실행 순서를 예측하기 어렵고 리셋 대상이 누락되기 쉬웠기 때문입니다.
                  수동으로 Map을 정의하는 비용이 있지만, 필터 조합 버그를 줄이는 데 효과적이었습니다.
              # ── A2b ──────────────────────────────────────────────────────
              - id: "A2b"
                q: "태그와 폼 상태를 왜 분리했나요?"
                answer: >
                  폼 값과 UI 태그가 항상 1:1로 대응하지 않기 때문입니다.
                  multi-select 필드는 하나의 폼 값(배열)에 여러 태그가 대응하고,
                  'ALL'을 선택하면 태그를 전부 지워야 하지만 폼 값은 'ALL'로 설정해야 합니다.
                  분리해두면 태그 삭제 시 역방향으로 폼 값을 업데이트하는 양방향 동기화도 자연스럽게 구현할 수 있었습니다.

      # ── Branch B: 파일 다운로드·암호화 ────────────────────────────────────
      - id: "download-encryption"
        trigger: "면접관이 '암호화', '다운로드'를 더 물어볼 때"
        questions:
          # ── B1 ────────────────────────────────────────────────────────────
          - id: "B1"
            q: "클라이언트 암호화라는 게 구체적으로 뭔가요?"
            answer: >
              이 시스템에는 매출 데이터를 엑셀로 내보내는 기능이 있습니다.
              내보낼 때 모달에서 랜덤 패스워드를 보여주고, 다운로드한 파일을 그 패스워드로 zip 암호화합니다.
              이 과정이 전부 브라우저에서 일어나서, 패스워드가 서버를 거치지 않습니다.
              window.crypto.getRandomValues()로 암호학적으로 안전한 패스워드를 생성하고,
              이미 ZIP인 파일은 감지해서 재압축 없이 암호만 씌우도록 level: 0을 적용했습니다.
            followUps:
              # ── B1a ──────────────────────────────────────────────────────
              - id: "B1a"
                q: "서버에서 하면 안 되나요?"
                answer: >
                  가능하지만, 서버에서 암호화하면 패스워드가 요청으로 전송되고 서버 메모리에 남습니다.
                  노출 경로가 늘어나는 셈이죠.
                  클라이언트에서 처리하면 패스워드는 브라우저 메모리에만 존재하고,
                  동시에 서버의 암호화 연산 부하도 분산할 수 있습니다.
                  사내 시스템이니까 이런 trust boundary 설계가 가능했습니다.
              # ── B1b ──────────────────────────────────────────────────────
              - id: "B1b"
                q: "패스워드 분실하면 어떡하나요?"
                answer: >
                  복구할 방법은 없습니다. 브라우저 의존적이라 서버에 패스워드가 없으니까요.
                  하지만 사내 시스템이라 같은 데이터를 다시 내보내면 되기 때문에,
                  수용 가능한 trade-off였습니다.
                  내보내기 사유(reason) 필드를 두어 감사 추적은 별도로 가능합니다.

          # ── B2 ────────────────────────────────────────────────────────────
          - id: "B2"
            q: "스트리밍은 왜 필요했나요?"
            answer: >
              내보내기 대상이 수천~수만 건이 될 수 있어서, 파일이 수십 MB까지 커집니다.
              Blob으로 한번에 받으면 브라우저 탭이 죽거나 메모리 초과가 발생할 수 있었습니다.
              ReadableStream으로 청크 단위로 읽으면서 진행률을 표시하고,
              Content-Disposition에서 파일명을 파싱하는 구조를 만들었습니다.
            followUps:
              # ── B2a ──────────────────────────────────────────────────────
              - id: "B2a"
                q: "스트리밍과 암호화를 연결할 수는 없었나요?"
                answer: >
                  지금은 다운로드 완료 후 암호화하는 2단계입니다.
                  Service Worker 기반 스트리밍 저장을 쓰면 파이프라인화가 가능하지만,
                  현재 파일 크기 범위(수십 MB)에서는 사용자 체감 차이가 크지 않아
                  과도한 복잡도라고 판단했습니다.

      # ── Branch C: 개발 환경 전략 ──────────────────────────────────────────
      - id: "dev-environment"
        trigger: "면접관이 'API mocking', '개발 환경'을 더 물어볼 때"
        questions:
          # ── C1 ────────────────────────────────────────────────────────────
          - id: "C1"
            q: "90%는 어떻게 달성했나요?"
            answer: >
              단순 fixture 반환이 아니라, MSW 핸들러에 비즈니스 로직을 시뮬레이션했습니다.
              날짜 범위 필터링, 수금 상태 계산, 분기 계산, 다중 필드 검색 같은 것들이요.
              이렇게 해야 프론트엔드만으로도 전체 플로우를 검증할 수 있고,
              코드 리뷰할 때도 화면을 띄워서 동작을 확인할 수 있었습니다.
            followUps:
              # ── C1a ──────────────────────────────────────────────────────
              - id: "C1a"
                q: "mock이 실제 API와 달라지면 어떻게 하나요?"
                answer: >
                  Zod 스키마를 API 계약으로 공유해서 괴리를 줄였습니다.
                  mock 핸들러가 같은 스키마를 참조하니까, 서버 응답 구조가 바뀌면
                  스키마 변경이 mock 쪽에도 타입 에러로 전파됩니다.
                  완전한 계약은 아니지만, 수동 fixture보다는 훨씬 안전합니다.
                  API 스펙이 안정된 후에는 contract test 같은 방향으로 전환할 수 있을 것 같습니다.

          # ── C2 ────────────────────────────────────────────────────────────
          - id: "C2"
            q: "스키마를 왜 3개 레이어로 나눴나요?"
            answer: >
              API 계약, 비즈니스 규칙, UI 검증은 변경 이유가 다릅니다.
              API 스키마(apis/types/)는 서버 계약이 바뀔 때만,
              도메인 스키마(schemas/)는 비즈니스 규칙이 바뀔 때만,
              페이지 스키마(pages/*/schemas/)는 화면별 검증이 바뀔 때만 변경합니다.
              한 곳에 모으면 하나의 변경이 어디까지 영향을 주는지 파악하기 어려운데,
              나누면 변경 범위가 자연스럽게 좁아집니다.
              페이지 스키마에서는 superRefine으로 조건부 검증(설치 유형이면 제품 필수)이나
              DB 제약(DECIMAL_15_2)까지 프론트에서 잡아냅니다.

    # =========================================================================
    # Ownership
    # =========================================================================
    ownership:
      - "디자인 시스템(maiui) 기반 Form abstraction 설계 (WithRHF 타입, useFormField 훅)"
      - "필터 의존성 관리 구조 설계 (dependencyMap, 양방향 태그 동기화)"
      - "클라이언트 사이드 zip 암호화 워크플로우 설계"
      - "ReadableStream 기반 스트리밍 다운로드 구현"
      - "MSW 핸들러에 비즈니스 로직 시뮬레이션 구현"
      - "3-layer Zod 스키마 구조 설계"

    # =========================================================================
    # 검토한 대안
    # =========================================================================
    alternativesConsidered:
      - approach: "Form 컴포넌트를 하나로 만들고 mode prop으로 분기"
        whyNotViable: >
          디자인 시스템 컴포넌트가 react-hook-form에 직접 의존하게 되어,
          RHF 없이 사용하는 곳에서도 불필요한 의존성을 갖게 된다.
          또한 mode에 따라 prop 타입이 달라지면 타입 안전성이 떨어진다.

      - approach: "필터 의존성을 useEffect로 암묵적으로 처리"
        whyNotViable: >
          useEffect 체인으로 종속 필드를 리셋하면 실행 순서를 예측하기 어렵고,
          리셋 대상이 누락되기 쉽다. 선언적 Map 구조가 디버깅과 확장에 유리하다.

      - approach: "서버에서 암호화하여 내려보내기"
        whyNotViable: >
          패스워드가 네트워크를 타고 서버 메모리에 남게 되어 노출 경로가 늘어난다.
          동시에 서버의 암호화 연산 부하도 증가한다.
          사내 시스템이므로 클라이언트 처리로 trust boundary를 좁히는 것이 합리적이었다.

      - approach: "Blob으로 파일 전체를 한번에 다운로드"
        whyNotViable: >
          수만 건 내보내기 시 수십 MB 이상의 파일이 생성되어 브라우저 메모리 초과 위험.
          또한 진행률 표시가 불가능하여 사용자가 다운로드 상태를 알 수 없다.

      - approach: "Zod 스키마를 한 곳에서 관리"
        whyNotViable: >
          API 계약 변경, 비즈니스 규칙 변경, UI 검증 변경이 같은 파일에서 발생하면
          변경의 영향 범위를 파악하기 어렵다. 레이어별로 분리하면 변경 이유가 명확해진다.

  # ===========================================================================
  # 고객지원 시스템 — v1.1 개발 오너로서의 프로젝트 관리
  # ===========================================================================
  - id: "mai-cs-project-management"
    tags: ["프로젝트-관리", "협업", "일정-관리", "크로스-프로젝트", "오너십", "RBAC"]
    relatedProject: "mai-cs"
    title: "고객지원 시스템 — v1.1 개발 오너로서 기획 검토부터 일정 관리까지"

    # =========================================================================
    # Question Flow — 면접 흐름 시각화
    # =========================================================================
    # Entry: "고객지원 시스템에서 어떤 역할을 했나요?"
    # │
    # ├─ A. 개발 오너의 역할 범위
    # │  ├─ A1. "백로그 구조화와 일정 산정을 어떻게 했나요?"
    # │  │  └─ A1a. "병목 시나리오를 사전에 기록했다는 게 뭔가요?"
    # │  └─ A2. "시니어와 작업을 어떻게 나눴나요?"
    # │
    # ├─ B. 크로스 프로젝트 레버리지
    # │  ├─ B1. "판매관리 시스템 경험이 어떻게 도움이 됐나요?"
    # │  └─ B2. "권한 체계에서 구체적으로 비슷한 점과 다른 점은?"
    # │
    # └─ C. 오너십과 회고
    #    ├─ C1. "가장 어려웠던 점은?"
    #    └─ C2. "다시 한다면 뭘 다르게 하겠나요?"
    # =========================================================================

    entryQuestion:
      q: "고객지원 시스템에서 어떤 역할을 했나요?"
      answer: >
        v1.0에서 초기 구조 설계와 구현을 맡았고, v1.1에서는 개발 오너를 맡아
        기획 검토, 백로그 구조화, 일정 산정과 관리까지 주도했습니다.
        이전에 판매관리 시스템에서 같은 사내 전산 시스템의 권한 체계를 다뤘던 경험이 있어서,
        기획 검토와 권한 설계를 빠르게 진행할 수 있었습니다.

    branches:
      # ── Branch A: 개발 오너의 역할 범위 ────────────────────────────────────
      - id: "dev-owner-role"
        trigger: "면접관이 '개발 오너', '프로젝트 관리'를 더 물어볼 때"
        questions:
          # ── A1 ────────────────────────────────────────────────────────────
          - id: "A1"
            q: "백로그 구조화와 일정 산정을 어떻게 했나요?"
            answer: >
              기획 전체를 개발 백로그 단위로 분해하고, 팀 내 플래닝 포커 회의를 주도해서
              각 백로그의 스토리 포인트를 산정했습니다.
              산정 후에는 시니어분과 작업을 할당·배분하고,
              작업을 진행하면서 각 지라 티켓에 실제 소요시간과 병목 시나리오를 기록해 나갔습니다.
              일부는 착수 전에 예측할 수 있었지만, 대부분은 작업 중에 의존 관계가 드러나면서 기록하게 됐습니다.
            followUps:
              # ── A1a ──────────────────────────────────────────────────────
              - id: "A1a"
                q: "병목 시나리오 기록이란 게 뭔가요?"
                answer: >
                  단순히 "3일 소요"가 아니라, "이 작업은 백엔드 API 완성에 의존하며,
                  API가 지연되면 모킹으로 선행 개발하되 통합 테스트가 밀린다" 같은 형태입니다.
                  예를 들어 사내 디자인 시스템 단까지 수정이 필요한 작업은,
                  디자인 시스템 수정·배포·업데이트까지의 리드타임이 추가로 필요한데,
                  이런 의존 관계는 작업을 시작해봐야 드러나는 경우가 많았습니다.
                  기록해두면 지연이 생겼을 때 "다음에 뭘 먼저 해야 하는지"를
                  다시 분석하지 않고 바로 대응할 수 있었습니다.

          # ── A2 ────────────────────────────────────────────────────────────
          - id: "A2"
            q: "시니어와 작업을 어떻게 나눴나요?"
            answer: >
              스토리 포인트 기준으로 전체 볼륨을 파악한 뒤,
              도메인 복잡도가 높은 부분(권한 분기, 필터 로직)은 제가, 
              화면 구현 중심 작업은 시니어분이 가져가는 식으로 나눴습니다.
              제가 권한 체계를 이미 깊이 이해하고 있었기 때문에 이 배분이 가능했습니다.
              진행 중에는 서로의 진행 상황을 확인하고, 리뷰를 독려하면서 일정을 맞췄습니다.

      # ── Branch B: 크로스 프로젝트 레버리지 ──────────────────────────────────
      - id: "cross-project-leverage"
        trigger: "면접관이 '이전 프로젝트 경험', '권한'을 더 물어볼 때"
        questions:
          # ── B1 ────────────────────────────────────────────────────────────
          - id: "B1"
            q: "판매관리 시스템 경험이 어떻게 도움이 됐나요?"
            answer: >
              두 시스템 모두 같은 회사의 사내 전산 시스템이라, 
              "부서와 직급에 따라 접근 가능한 기능이 달라진다"는 핵심 구조가 같았습니다.
              판매관리 시스템에서 기획/Auth/Backend 팀과 권한 정책을 조율했던 경험이 있어서,
              고객지원 시스템의 기획을 볼 때 "이 권한 분기가 조직관리 시스템과 어떻게 연동되는지",
              "어떤 엣지 케이스가 발생할 수 있는지"를 빠르게 파악할 수 있었습니다.
              기획을 검토하면서 놓친 권한 시나리오를 기획팀에 피드백한 적도 있었습니다.

          # ── B2 ────────────────────────────────────────────────────────────
          - id: "B2"
            q: "권한 체계에서 구체적으로 비슷한 점과 다른 점은?"
            answer: >
              비슷한 점은 조직 정보(부서, 직급) 기반으로 역할을 부여하고,
              역할에 따라 기능 접근을 제어하는 RBAC 구조입니다.
              다른 점은, 고객지원 시스템에는 "고객" 인터페이스가 추가로 있어서
              카카오 인증 기반의 완전히 다른 인증 흐름이 공존했다는 것입니다.
              직원용은 사내 OAuth로, 고객용은 카카오 로그인으로 진입하는 두 갈래를
              하나의 시스템 안에서 관리해야 했습니다.

      # ── Branch C: 오너십과 회고 ────────────────────────────────────────────
      - id: "ownership-retrospective"
        trigger: "면접관이 '어려움', '회고'를 더 물어볼 때"
        questions:
          # ── C1 ────────────────────────────────────────────────────────────
          - id: "C1"
            q: "가장 어려웠던 점은?"
            answer: >
              구현 자체보다, 타팀 의존성 관리가 어려웠습니다.
              기획 변경이 개발 중간에 들어오기도 했고,
              백엔드 API나 인증 시스템의 완성 시점이 우리 일정과 맞지 않을 때가 있었습니다.
              이때 병목 시나리오를 사전에 기록해뒀던 게 도움이 됐고,
              스쿼드 채널에서 책임 소재를 파악하고 직접 답변하거나 조율하는 역할을 맡으면서
              커뮤니케이션 비용을 줄이려 했습니다.

          # ── C2 ────────────────────────────────────────────────────────────
          - id: "C2"
            q: "다시 한다면 뭘 다르게 하겠나요?"
            answer: >
              병목 시나리오를 지라 티켓에 텍스트로 기록했는데,
              의존 관계를 시각적으로 표현하는 게 더 효과적이었을 것 같습니다.
              예를 들어 간단한 DAG 형태로 "이 작업이 밀리면 어떤 작업들이 영향받는지"를
              한눈에 볼 수 있었다면, 팀원 간 공유도 쉬웠을 겁니다.
              또한 플래닝 포커 결과를 기록만 했는데,
              실제 소요시간과 비교해서 산정 정확도를 회고하는 과정을 추가했으면
              다음 프로젝트에서 더 정밀한 산정이 가능했을 것 같습니다.

    # =========================================================================
    # Ownership
    # =========================================================================
    ownership:
      - "v1.1 개발 오너로서 기획 전체를 개발 백로그로 구조화"
      - "플래닝 포커 주도 및 스토리 포인트 산정"
      - "작업 진행 중 소요시간 + 병목 시나리오를 티켓에 기록"
      - "시니어와의 작업 할당·배분 주도"
      - "판매관리 시스템 권한 체계 경험을 레버리지한 기획 검토"
      - "스쿼드 채널 질문 대응 및 타팀 의존성 관리"
      - "최종 일정 내 개발 완료"

  # ===========================================================================
  # ECG 라벨링 도구 — IntersectionObserver Panning과 사분면 툴팁 배치
  # ===========================================================================
  - id: "ecg-labeling-improvement"
    tags: ["설계", "대안-비교", "좌표-시스템", "IntersectionObserver", "SVG", "결합도"]
    relatedProject: "ecg-labeling"
    title: "ECG 라벨링 도구 — IntersectionObserver Panning과 사분면 툴팁 배치"

    # =========================================================================
    # Question Flow — 면접 흐름 시각화
    # =========================================================================
    # Entry: "라벨링 도구에서 어떤 작업을 했나요?"
    # │
    # ├─ A. Panning 설계
    # │  ├─ A1. "왜 d3-zoom이 아니라 IntersectionObserver를 썼나요?"
    # │  │  └─ A1a. "d3-zoom으로는 정말 안 되나요?"
    # │  ├─ A2. "IntersectionObserver로 뭘 관찰하나요?"
    # │  └─ A3. "Pan 경계는 어떻게 결정했나요?"
    # │
    # └─ B. 툴팁 사분면 배치
    #    ├─ B1. "사분면 분류 기준이 뭔가요?"
    #    │  └─ B1a. "80% 임계값은 어떻게 정했나요?"
    #    ├─ B2. "분면마다 구체적으로 뭐가 달라지나요?"
    #    └─ B3. "Pan이나 Zoom 상태가 바뀌면 툴팁 위치도 따라가나요?"
    # =========================================================================

    entryQuestion:
      q: "라벨링 도구에서 어떤 작업을 했나요?"
      answer: >
        크게 두 가지입니다.
        첫째, 리드마다 데이터 길이가 달라 10초 이상인 데이터가 뷰포트 밖으로 잘리는 문제를
        해결하기 위해 Panning 기능을 설계했습니다.
        d3-zoom 대신 IntersectionObserver를 활용해서 줌 기능과 결합도 없이 독립적으로 동작하게 만들었습니다.
        둘째, 라벨 포인트의 툴팁이 뷰포트 가장자리에서 잘리는 문제를 해결했습니다.
        커서 위치를 SVG viewBox 기준으로 4분면으로 나누고,
        분면에 따라 툴팁의 고정 모서리와 오프셋 방향을 달리하는 배치 로직을 설계했습니다.

    branches:
      # ── Branch A: Panning 설계 ────────────────────────────────────────────
      - id: "panning-design"
        trigger: "면접관이 'Panning', '10초 이상'을 더 물어볼 때"
        questions:
          # ── A1 ────────────────────────────────────────────────────────────
          - id: "A1"
            q: "왜 d3-zoom이 아니라 IntersectionObserver를 썼나요?"
            answer: >
              두 가지 이유입니다.
              첫째, 구현이 단순합니다.
              d3-zoom으로 panning을 만들려면, 기존 줌을 위한 이벤트와 별도의 panning 이벤트를
              중첩해서 다뤄야 합니다. d3가 nested event에 대한 가이드를 제공하지 않아
              실제로 개발할 때 어려움을 겪었습니다.
              IntersectionObserver는 그리드 경계선의 가시성만 감시하면 되기 때문에 구현이 간결합니다.
              둘째, 줌 기능과의 결합도가 낮습니다.
              줌을 사용하지 않는 화면에서도, panning이 필요한 요소를 PanGroup으로 감싸기만 하면 동작합니다.
              줌에 의존하지 않기 때문에 두 기능을 독립적으로 켜고 끌 수 있습니다.
            followUps:
              # ── A1a ──────────────────────────────────────────────────────
              - id: "A1a"
                q: "d3-zoom으로는 정말 안 되나요?"
                answer: >
                  불가능하지는 않지만 복잡도가 높습니다.
                  d3-zoom은 하나의 selection에 zoom behavior를 바인딩하는 구조입니다.
                  같은 엘리먼트에서 줌과 팬을 동시에 제어하려면,
                  이벤트를 어떤 동작으로 라우팅할지 판별하는 로직을 직접 만들어야 합니다.
                  특히 이미 태블릿 터치 인터랙션에서 제스처 판별의 복잡도를 경험한 상태여서,
                  가능하면 이벤트 중첩을 피하는 방향을 선택했습니다.
                  IntersectionObserver는 이벤트 계층 자체가 다르므로 이 문제가 원천적으로 없습니다.

          # ── A2 ────────────────────────────────────────────────────────────
          - id: "A2"
            q: "IntersectionObserver로 뭘 관찰하나요?"
            answer: >
              배경 그리드의 첫 번째와 마지막 세로선을 관찰합니다.
              두 선이 모두 화면 안에 보이면, 데이터가 뷰포트 안에 다 들어간다는 뜻이므로
              panning이 불필요합니다. 이때는 드래그를 비활성화합니다.
              한쪽이라도 보이지 않으면 뷰포트 밖에 숨은 데이터가 있다는 뜻이므로
              드래그를 허용합니다.
              이렇게 하면 짧은 데이터(10초)에서는 pan이 자동으로 꺼지고,
              긴 데이터(30초)에서는 자동으로 켜집니다.

          # ── A3 ────────────────────────────────────────────────────────────
          - id: "A3"
            q: "Pan 경계는 어떻게 결정했나요?"
            answer: >
              두 가지 제약입니다.
              왼쪽 끝은 원점(0)을 넘지 못하게 합니다.
              오른쪽 끝은 가장 긴 리드의 전체 너비에서 뷰포트 너비를 빼서,
              리드 끝이 뷰포트 오른쪽에 딱 맞는 지점까지만 허용합니다.
              SVG <g> 요소의 transform translate 값을 이 범위 내로 clamp하여
              화면 밖으로 벗어나지 않도록 합니다.

      # ── Branch B: 툴팁 사분면 배치 ────────────────────────────────────────
      - id: "tooltip-quadrant"
        trigger: "면접관이 '툴팁', '사분면'을 더 물어볼 때"
        questions:
          # ── B1 ────────────────────────────────────────────────────────────
          - id: "B1"
            q: "사분면 분류 기준이 뭔가요?"
            answer: >
              커서가 SVG viewBox의 오른쪽 80%를 넘었는지, 아래쪽 80%를 넘었는지를 조합합니다.
              SVGElement.getScreenCTM()의 역행렬로 마우스 좌표를 SVG 내부 좌표로 변환한 뒤,
              viewBox width/height의 80% 지점과 비교합니다.
              이 두 boolean 조합으로 4분면이 결정됩니다.
              오른쪽 + 아래쪽이면 'second', 아래쪽만이면 'first',
              오른쪽만이면 'third', 둘 다 아니면 'fourth'(기본값)입니다.
            followUps:
              # ── B1a ──────────────────────────────────────────────────────
              - id: "B1a"
                q: "80% 임계값은 어떻게 정했나요?"
                answer: >
                  툴팁의 최대 너비와 높이를 고려해서 정했습니다.
                  라벨 툴팁에는 리드명, 좌표, 삭제 버튼이 들어가므로 일정 크기 이상입니다.
                  뷰포트의 마지막 20% 영역에 커서가 있으면 툴팁이 화면 밖으로 넘칠 가능성이 높아서,
                  이 지점부터 방향을 전환합니다.
                  4/5라는 값은 실제 툴팁 사이즈를 기준으로 잡은 경험적 임계값입니다.

          # ── B2 ────────────────────────────────────────────────────────────
          - id: "B2"
            q: "분면마다 구체적으로 뭐가 달라지나요?"
            answer: >
              두 가지가 달라집니다. 오프셋 방향과 고정 모서리입니다.
              오프셋은 툴팁이 포인트 원과 겹치지 않게 밀어내는 방향입니다.
              기본(fourth)이면 왼쪽 위로 밀고, 
              오른쪽 가장자리(third)면 왼쪽으로 밀어서 화면 안에 들어오게 합니다.
              고정 모서리는 portal div의 CSS position으로 구현합니다.
              예를 들어 fourth는 left+top을, first는 left+bottom을 설정하여
              툴팁이 해당 모서리를 기준으로 확장되도록 합니다.
              추가로 second 분면에서는 tooltipSize.width를 확인해서,
              right 고정 시 왼쪽으로 넘치면 left로 전환하는 오버플로 처리도 있습니다.

          # ── B3 ────────────────────────────────────────────────────────────
          - id: "B3"
            q: "Pan이나 Zoom 상태가 바뀌면 툴팁 위치도 따라가나요?"
            answer: >
              네, SVG 내부 좌표를 screen 좌표로 변환하는 파이프라인이
              panX, zoom transform을 의존성으로 가지고 있어서
              값이 바뀔 때마다 useEffect가 재실행됩니다.
              SVG 좌표에 padding 보정 → 사분면 오프셋 → pan 오프셋 → zoom transform →
              getScreenCTM() 변환의 단계를 거쳐 최종 CSS position이 갱신됩니다.
              각 단계가 독립적이라 Pan만 쓸 때, Zoom만 쓸 때, 둘 다 쓸 때 모두 올바르게 동작합니다.

    # =========================================================================
    # Ownership
    # =========================================================================
    ownership:
      - "IntersectionObserver 기반 PanGroup 설계 — d3-zoom과 독립적으로 동작하는 panning"
      - "그리드 경계선 가시성 감시를 통한 pan 활성/비활성 자동 전환"
      - "SVG viewBox 80% 임계값 기반 4분면 분류 로직 설계"
      - "분면별 CSS position 고정 모서리 + 오프셋 방향 분기 구현"
      - "SVG → Screen 좌표 변환 파이프라인 (padding → quadrant → pan → zoom → screen)"
      - "TooltipPortal 컴포넌트 — portal 기반 SVG 외부 렌더링 아키텍처"

    # =========================================================================
    # Technical Deep Dives — 세부 참고 자료
    # =========================================================================
    technicalDeepDives:
      # ── Deep Dive 1 ──────────────────────────────────────────────────────────
      - title: "IntersectionObserver 기반 Pan 활성 판단"
        summary: |
          PanGroup은 그리드의 첫 번째/마지막 세로선에 IntersectionObserver를 등록한다.
          두 선이 모두 visible이면 데이터가 뷰포트에 다 들어간 상태이므로 pan 불필요.
          한쪽이라도 invisible이면 뷰포트 밖에 데이터가 있으므로 pan 허용.
        steps:
          - title: "경계선 관찰 등록"
            insight: |
              document.querySelector('.background .grid-y')의 첫/마지막 자식 요소를 관찰한다.
              entry.isIntersecting을 ref에 저장하여 checkPannable() 콜백에서 참조한다.
            code: |
              useEffect(() => {
                const left = document.querySelector('.background .grid-y')?.firstElementChild;
                if (!left) return;
                const observer = new IntersectionObserver(([entry]) => {
                  isLeftVisible.current = entry.isIntersecting;
                });
                observer.observe(left);
                return () => observer.disconnect();
              }, []);

          - title: "checkPannable과 usePanX 연동"
            insight: |
              usePanX의 onDrag 콜백에서 checkPannable()이 false를 반환하면
              현재 포인터 위치를 dragStartX로 재설정하여 움직임을 무시한다.
              ref 기반이므로 React 렌더 사이클 없이 즉각 반영된다.

      # ── Deep Dive 2 ──────────────────────────────────────────────────────────
      - title: "사분면 기반 툴팁 배치 시스템"
        summary: |
          커서 위치를 SVG viewBox의 80% 임계값으로 4분면 분류 →
          분면별로 (1) 오프셋 방향과 (2) CSS 고정 모서리를 결정 →
          SVG → Screen 좌표 변환 후 portal div에 적용.
        steps:
          - title: "가장자리 감지 — isMousePointerNearEdge"
            insight: |
              svg.createSVGPoint()로 clientX/Y를 SVG 좌표로 변환한 뒤
              viewBox.width * 4/5, viewBox.height * 4/5와 비교한다.
              이 결과를 PointCircle의 mouseenter에서 계산하여 hoverPoint에 포함시킨다.
            code: |
              const TOOLTIP_QUADRANT_THRESHOLD = 4 / 5;
              export const isMousePointerNearRightEdge = (e, svg) => {
                const pt = svg.createSVGPoint();
                pt.x = e.clientX; pt.y = e.clientY;
                const pointer = pt.matrixTransform(svg.getScreenCTM()?.inverse());
                return pointer.x > svg.viewBox.baseVal.width * TOOLTIP_QUADRANT_THRESHOLD;
              };

          - title: "사분면 결정 로직"
            insight: |
              isNearBottomEdge × isNearRightEdge 조합으로 4가지 경우를 매핑한다.
              bottom+right → second, bottom만 → first, right만 → third, 둘 다 아님 → fourth.
            code: |
              quadrant={
                point.isNearBottomEdge
                  ? point.isNearRightEdge ? 'second' : 'first'
                  : point.isNearRightEdge ? 'third'  : 'fourth'
              }

          - title: "분면별 CSS position 매핑"
            insight: |
              fourth(기본): left + top 설정 → 왼쪽 상단 모서리 고정.
              first: left + bottom → 왼쪽 하단 고정 (아래 가장자리에서 위로 확장).
              third: right + top → 오른쪽 상단 고정 (오른쪽 가장자리에서 왼쪽 확장).
              second: right + bottom → 오른쪽 하단 고정 + 너비 오버플로 시 left 전환.

    # =========================================================================
    # 검토한 대안
    # =========================================================================
    alternativesConsidered:
      - approach: "d3-zoom의 pan 기능을 활용하여 panning 구현"
        whyNotViable: >
          d3-zoom은 하나의 selection에 zoom behavior를 바인딩하는 구조라,
          줌과 별도의 panning 이벤트를 중첩 처리해야 한다.
          d3가 nested event에 대한 가이드를 제공하지 않아 개발에 어려움을 겪었고,
          줌 기능을 쓰지 않는 화면에서도 d3-zoom에 의존해야 하는 문제가 있다.
          IntersectionObserver는 이벤트 계층이 분리되어 줌과의 충돌이 원천적으로 없다.

      - approach: "툴팁 위치를 CSS clamp 또는 max/min으로 뷰포트 내 제한"
        whyNotViable: >
          left + max(0, ...)로 왼쪽 넘침은 막을 수 있지만,
          오른쪽이나 아래쪽 넘침을 처리하려면 right나 bottom 기준으로 전환해야 한다.
          CSS만으로는 "어느 모서리를 기준으로 고정할지" 동적 전환이 어렵다.
          사분면 기반으로 고정 모서리 자체를 바꾸면 모든 방향의 넘침을 일관되게 처리할 수 있다.

      - approach: "툴팁을 SVG 내부에 렌더링 (foreignObject)"
        whyNotViable: >
          SVG foreignObject 안의 HTML은 브라우저마다 렌더링 차이가 있고,
          SVG viewBox 밖으로 넘어가면 잘린다.
          body에 portal로 렌더링하면 SVG와 독립적으로 위치를 잡을 수 있고,
          z-index로 다른 UI 위에 확실히 올릴 수 있다.

  # ===========================================================================
  # vue3-kakao-maps — 라이브러리 빌드 파이프라인 진단과 개선
  # ===========================================================================
  - id: "vue-kakao-maps-build-pipeline"
    tags: ["빌드", "디버깅", "라이브러리", "타입-시스템", "ESLint", "오픈소스", "Vite"]
    relatedProject: "vue-kakao-map-lib"
    title: "vue3-kakao-maps — 라이브러리 빌드 파이프라인 진단과 개선"

    # =========================================================================
    # Question Flow — 면접 흐름 시각화
    # =========================================================================
    # Entry: "이 오픈소스 라이브러리에서 어떤 기여를 했나요?"
    # │
    # ├─ P. 프로젝트 소개
    # │  └─ P1. "이 프로젝트에 대해 설명해주세요"
    # │
    # ├─ A. d.ts 절대경로 문제 진단 → ESLint 방지
    # │  ├─ A1. "문제를 어떻게 발견했나요?"
    # │  ├─ A2. "왜 임시 해결과 시스템적 해결 두 단계로 나눴나요?"
    # │  │  └─ A2a. "ESLint override를 왜 타입 파일에만 한정했나요?"
    # │  └─ A3. "근본적인 해결법은 없었나요?"
    # │
    # ├─ B. vite-plugin-dts 제거 판단
    # │  ├─ B1. "왜 vite-plugin-dts를 제거했나요?"
    # │  │  ├─ B1a. "vue-tsc 직접 실행이 더 나은 이유는?"
    # │  │  └─ B1b. "빌드 도구와 d.ts 생성 도구는 어떻게 다른 건가요?"
    # │  └─ B2. "tsconfig를 어떻게 재설계했나요?"
    # │
    # └─ C. 회고
    #    ├─ C1. "이 경험에서 가장 크게 배운 점은?"
    #    └─ C2. "그럼 잘못된 판단이었나요?"
    # =========================================================================

    entryQuestion:
      q: "이 오픈소스 라이브러리에서 어떤 기여를 했나요?"
      answer: >
        6인 팀에서 빌드·배포 파이프라인과 컴포넌트 설계/개발을 맡았습니다.
        그 중에서 가장 고민이 깊었던 부분은 빌드 파이프라인 문제 해결입니다.
        크게 두 가지인데,
        첫째, 빌드 결과물의 d.ts 파일에 절대경로가 남아 소비자 프로젝트에서 타입이 깨지는 문제를 진단하고,
        ESLint 룰로 재발을 방지했습니다.
        둘째, d.ts 생성 도구의 산출물 품질에 의문이 생겨 vue-tsc 직접 실행으로 전환했는데,
        이후 두 도구의 산출물을 비교 분석하며 이 판단을 되돌아보는 과정을 거쳤습니다.

    branches:
      # ── Branch P: 프로젝트 소개 ──────────────────────────────────────────────
      - id: "project-introduction"
        trigger: "면접관이 '프로젝트 소개', '어떤 프로젝트인지'를 물어볼 때"
        questions:
          # ── P1 ────────────────────────────────────────────────────────────
          - id: "P1"
            q: "이 프로젝트에 대해 설명해주세요"
            answer: >
              카카오맵 SDK를 Vue.js 컴포넌트로 추상화한 오픈소스 NPM 패키지입니다.
              6인 팀으로 개발했고, SSAFY 전국 지역 대상을 수상했으며, 누적 다운로드 13,000건 이상입니다.
              핵심 설계 과제는 명령형 SDK를 선언적 컴포넌트로 전환하는 것이었습니다.
              카카오맵 SDK는 `new kakao.maps.Map(container, options)` 같은 명령형 API인데,
              Vue 컴포넌트 트리 안에서 선언적으로 지도를 구성하려면 세 가지 문제를 풀어야 했습니다.
              첫째, 부모(Map)가 생성한 map 인스턴스를 자식(Marker, Overlay 등)이 참조해야 합니다.
              둘째, SDK 자체가 비동기 로딩이라 자식이 먼저 마운트되는 타이밍 문제가 있었습니다.
              셋째, 컴포넌트가 제거될 때 SDK 객체를 정리해야 메모리 누수를 방지할 수 있습니다.
              provide/inject로 map 인스턴스를 컨텍스트로 공유하고,
              SDK 로딩 완료까지 자식 렌더링을 지연하는 비동기 상태 관리 패턴을 설계했습니다.
              각 자식 컴포넌트의 onUnmounted에서 SDK 객체를 정리하는 라이프사이클 패턴도 적용했습니다.
              결과적으로 소비자가 `<KakaoMap><KakaoMapMarker />`처럼 선언적으로 지도를 구성할 수 있게 되었고,
              컴포넌트 제거 시 리소스가 자동 정리되는 구조를 만들었습니다.

      # ── Branch A: d.ts 절대경로 문제 진단 → ESLint 방지 ────────────────────
      - id: "dts-absolute-path"
        trigger: "면접관이 '타입이 깨진다', 'd.ts'를 더 물어볼 때"
        questions:
          # ── A1 ────────────────────────────────────────────────────────────
          - id: "A1"
            q: "문제를 어떻게 발견했나요?"
            answer: >
              npm link로 로컬 테스트 프로젝트에서 라이브러리를 설치하고 사용하는 과정에서 발견했습니다.
              markerCluster prop의 타입이 MarkerClusterInfo가 아니라 any로 나오는 걸 보고,
              dist 폴더 안의 d.ts 파일을 직접 열어봤습니다.
              import 경로에 '@/components/KakaoMapMarker/types'처럼 절대경로(@/)가 그대로 남아 있었습니다.
              소비자 프로젝트에는 이 alias가 없으니 resolve에 실패하고, 타입이 any로 fallback되는 구조였습니다.

          # ── A2 ────────────────────────────────────────────────────────────
          - id: "A2"
            q: "왜 임시 해결과 시스템적 해결 두 단계로 나눴나요?"
            answer: >
              당장 배포해야 하는 버전이 있었기 때문에 임시 해결을 먼저 했습니다.
              타입 관련 import를 상대경로로 수동 변경하고 npm link로 타입이 정상 적용되는 것을 확인했습니다.
              하지만 팀원 6명이 개발하는 환경에서 "타입 import는 상대경로로 해주세요"라는 구두 약속은
              반드시 깨집니다. 그래서 ESLint override로 타입 정의 파일에서 절대경로 import를 에러로 잡도록 했습니다.
            followUps:
              # ── A2a ──────────────────────────────────────────────────────
              - id: "A2a"
                q: "ESLint override를 왜 타입 파일에만 한정했나요?"
                answer: >
                  절대경로(@/) 자체가 나쁜 건 아닙니다.
                  컴포넌트 코드(.vue, .ts)에서는 Vite가 빌드 시 alias를 resolve해주기 때문에 문제가 없습니다.
                  문제는 vue-tsc가 생성하는 d.ts 파일에서만 발생합니다.
                  vue-tsc는 소스의 import 경로를 그대로 보존하기 때문에,
                  d.ts에 쓰인 절대경로가 소비자 프로젝트에서 resolve되지 않는 겁니다.
                  런타임 코드의 alias 해석과 타입 선언 파일의 경로 해석이 다른 레이어라는 것을 이해한 뒤,
                  src/**/types/*.ts 파일에만 no-restricted-imports를 적용했습니다.
                  이렇게 하면 일반 코드에서는 절대경로를 자유롭게 쓰면서,
                  d.ts에 영향을 주는 파일에서만 상대경로를 강제할 수 있었습니다.

          # ── A3 ────────────────────────────────────────────────────────────
          - id: "A3"
            q: "근본적인 해결법은 없었나요?"
            answer: >
              지금 돌아보면, 제거했던 vite-plugin-dts가 @/ 별칭을 상대경로로 자동 변환해주는 기능을 가지고 있었습니다.
              즉 이 도구를 유지했다면 ESLint rule 자체가 필요 없었습니다.
              당시에는 산출물 가독성 문제에 집중하다 이 기능을 간과했고,
              결과적으로 도구가 해줄 수 있는 일을 ESLint + 상대경로 강제라는 우회로 풀어버린 셈입니다.
              이 경험이 이후에 "도구를 교체하기 전에 기존 도구가 제공하는 것을 먼저 전부 파악하자"는
              습관으로 이어졌습니다.

      # ── Branch B: vite-plugin-dts 제거 판단 ────────────────────────────────
      - id: "vite-plugin-dts-removal"
        trigger: "면접관이 'vite-plugin-dts', 'vue-tsc'를 더 물어볼 때"
        questions:
          # ── B1 ────────────────────────────────────────────────────────────
          - id: "B1"
            q: "왜 vite-plugin-dts를 제거했나요?"
            answer: >
              솔직하게 말하면, 산출물의 가독성이 가장 큰 이유였습니다.
              vite-plugin-dts가 생성하는 .vue.d.ts 파일에 __VLS_TypePropsToRuntimeProps 같은
              헬퍼 타입이 파일마다 반복 포함되어 있었는데, 이걸 보고
              "이 산출물을 믿을 수 있나?"라는 불안이 생겼습니다.
              추가로, changelog를 확인해보니 내부적으로 vue-tsc를 사용하고 있었기 때문에,
              중간 레이어를 걷어내고 직접 실행하면 더 투명하게 제어할 수 있다고 판단했습니다.
            followUps:
              # ── B1a ──────────────────────────────────────────────────────
              - id: "B1a"
                q: "vue-tsc 직접 실행이 더 나은 이유는?"
                answer: >
                  tsconfig.json을 직접 제어할 수 있다는 점입니다.
                  vite-plugin-dts는 자체 옵션으로 tsconfig 설정을 부분적으로 오버라이드하는데,
                  어떤 설정이 최종적으로 적용되는지 파악하기 어려웠습니다.
                  vue-tsc를 직접 실행하면 rootDir, outDir, emitDeclarationOnly 같은 설정을
                  tsconfig.json 하나에서 명시적으로 관리할 수 있습니다.
                  디버깅할 때도 중간에 뭐가 끼어들었는지 의심할 필요가 없어집니다.
              - id: "B1b"
                q: "빌드 도구와 d.ts 생성 도구는 어떻게 다른 건가요?"
                answer: >
                  라이브러리 빌드 파이프라인에는 두 단계가 있습니다.
                  첫 번째는 빌드 도구(Vite, Rollup 등)가 소스 코드를 번들링해서
                  브라우저나 Node.js가 실행할 수 있는 .js 파일을 만드는 단계입니다.
                  모듈 해석, 트리 쉐이킹, 코드 분할 같은 작업이 여기서 일어납니다.
                  두 번째는 d.ts 생성 도구(tsc, vue-tsc 등)가 소스 코드에서
                  타입 정보만 추출해서 .d.ts 파일을 만드는 단계입니다.
                  이 파일에는 런타임 코드가 없고, 라이브러리 소비자의 IDE가
                  타입 체크와 자동완성에 사용합니다.
                  vite-plugin-dts가 혼동을 주는 이유는 Vite 플러그인 형태로
                  빌드 과정에 끼어들지만, 실제 역할은 d.ts 생성에 한정되기 때문입니다.
                  이 프로젝트에서도 Vite는 .js 번들만, vue-tsc는 .d.ts만 담당하도록
                  역할을 명확히 분리했습니다.

          # ── B2 ────────────────────────────────────────────────────────────
          - id: "B2"
            q: "tsconfig를 어떻게 재설계했나요?"
            answer: >
              기존에는 solution-style tsconfig(references로 app/node/vitest를 분리)를 썼습니다.
              하지만 라이브러리 빌드에서는 단일 진입점(src/)에서 d.ts를 생성하면 되기 때문에,
              references를 제거하고 단일 tsconfig로 통합했습니다.
              rootDir을 src로, outDir을 dist로, emitDeclarationOnly를 true로 설정해서
              vue-tsc가 타입 선언만 생성하고 번들링은 Vite가 담당하는 구조입니다.
              이 분리 덕분에 각 도구의 역할이 명확해졌습니다.
              Vite는 런타임 코드만, vue-tsc는 타입 선언만 책임집니다.

      # ── Branch C: 회고 ────────────────────────────────────────────────────
      - id: "retrospective"
        trigger: "면접관이 '배운 점', '회고'를 물어볼 때"
        questions:
          # ── C1 ────────────────────────────────────────────────────────────
          - id: "C1"
            q: "이 경험에서 가장 크게 배운 점은?"
            answer: >
              최적화하려는 대상의 실제 소비자가 누구인지 먼저 확인해야 한다는 점입니다.
              당시 저는 .d.ts 파일의 가독성이 낮다는 이유로 도구를 교체했는데,
              이후에 두 도구의 산출물을 파일 단위로 비교해보니
              차이는 Vue 컴포넌트의 선언 파일 스타일뿐이었고,
              소비자가 체감하는 자동완성이나 타입 추론 결과에는 영향이 없었습니다.
              .d.ts는 사람이 아니라 TypeScript 컴파일러와 IDE가 읽는 파일이었던 거죠.
              오히려 교체 과정에서 경로 별칭 자동 해소 기능을 잃어버려
              ESLint rule로 우회해야 했고, 빌드도 2단계로 복잡해졌습니다.
              이후로는 무언가를 개선하려 할 때 "이걸 누가 소비하는가"를 먼저 묻는 습관이 생겼습니다.

          # ── C2 ────────────────────────────────────────────────────────────
          - id: "C2"
            q: "그럼 잘못된 판단이었나요?"
            answer: >
              비용을 과대평가한 판단이었습니다.
              산출물이 장황해 보여서 "품질에 문제가 있는 건 아닌가"라고 의심한 것 자체는 자연스러웠고,
              실제로 그 과정에서 빌드 파이프라인의 각 레이어가 어떻게 동작하는지 깊이 이해하게 됐습니다.
              다만 "기계가 소비하는 산출물의 가독성"을 위해 파이프라인 복잡도를 높인 건
              비용 대비 효과가 낮았습니다.
              지금 다시 한다면 vite-plugin-dts를 유지하면서
              빌드 1단계, 경로 별칭 자동 해소라는 이점을 취했을 겁니다.

    # =========================================================================
    # Ownership
    # =========================================================================
    ownership:
      - "dist/d.ts 파일을 직접 열어 절대경로 잔존 문제를 발견하고 원인을 추적"
      - "런타임 코드의 alias 해석과 타입 선언 파일의 경로 해석이 다른 레이어임을 파악"
      - "src/**/types/*.ts에 한정한 ESLint no-restricted-imports override 설계"
      - "vite-plugin-dts v3 changelog 추적 → 내부적으로 vue-tsc 사용을 확인"
      - "vite-plugin-dts 제거, tsconfig.json을 라이브러리 빌드용 단일 설정으로 재설계"
      - "npm link 기반 로컬 테스트 환경을 구성하고 팀에 공유"
      - "이후 두 도구의 빌드 산출물을 파일 단위로 비교하여 당시 판단을 재검증"

    # =========================================================================
    # 검토한 대안
    # =========================================================================
    alternativesConsidered:
      - approach: "d.ts의 절대경로를 후처리 스크립트로 치환"
        whyNotViable: >
          빌드 후 sed나 스크립트로 @/를 상대경로로 치환하는 방법이 있지만,
          파일 위치에 따라 상대경로 깊이가 다르기 때문에 단순 치환으로는 정확하지 않다.
          tsc-alias 같은 도구도 있지만, 프로젝트 규모 대비 도구 추가가 과도하다고 판단했다.
          입력(소스 코드)을 제한하는 ESLint 방식이 더 단순하고 확실했다.

      - approach: "vite-plugin-dts의 옵션을 조정하여 문제 해결"
        whyNotViable: >
          vite-plugin-dts의 옵션은 tsconfig 설정을 부분적으로 오버라이드하는 구조인데,
          최종적으로 어떤 설정이 적용되는지 투명하게 확인하기 어려웠다.
          특히 Vue SFC의 d.ts 생성 품질 문제는 플러그인 옵션만으로 해결되지 않았다.
          중간 레이어를 거치지 않고 vue-tsc를 직접 실행하면
          tsconfig.json 하나로 모든 설정을 명시적으로 관리할 수 있다.

      - approach: "모든 소스 파일에서 절대경로를 금지"
        whyNotViable: >
          절대경로(@/)는 일반 코드에서는 Vite가 빌드 시 resolve해주므로 문제가 없다.
          모든 파일에 상대경로를 강제하면 개발 편의성이 떨어지고 불필요한 규칙이 된다.
          문제가 발생하는 지점은 vue-tsc가 생성하는 d.ts 파일뿐이므로,
          타입 정의 파일(src/**/types/*.ts)에만 한정하는 것이 적절했다.

  # ===========================================================================
  # 실시간 투표 시스템 — SSE·REST 공존 환경의 데이터 정합성
  # ===========================================================================
  - id: "vottega-sse-consistency"
    tags: ["설계", "실시간", "race-condition", "상태-관리", "React-Query", "trade-off", "커넥션-관리"]
    relatedProject: "voting-system"
    title: "실시간 투표 시스템 — SSE·REST 공존 환경의 데이터 정합성"

    # =========================================================================
    # Question Flow — 면접 흐름 시각화
    # =========================================================================
    # Entry: "이 프로젝트에서 가장 고민한 부분은?"
    # │
    # ├─ A. SSE + REST race condition
    # │  ├─ A1. "1단계 검증만으로 왜 부족한가요?"
    # │  ├─ A2. "setQueryData 콜백 내부에서 재검증한다는 게 구체적으로?"
    # │  └─ A3. "이 패턴을 4개 핸들러에 어떻게 일관 적용했나요?"
    # │
    # ├─ B. 연결 갭 복구
    # │  ├─ B1. "탭 전환 시 어떤 문제가 있었나요?"
    # │  ├─ B2. "refetchOnWindowFocus로 안 한 이유는?"
    # │  └─ B3. "openWhenHidden이나 Last-Event-ID는 검토 안 했나요?"
    # │
    # ├─ C. 상태 관리 판단
    # │  ├─ C1. "왜 Zustand/Redux를 안 썼나요?"
    # │  ├─ C2. "React Query 캐시만으로 부족한 경우는 없었나요?"
    # │  └─ C3. "그럼 Zustand 같은 라이브러리는 언제 필요한 건가요?"
    # │
    # └─ D. 회고
    #    └─ D1. "다시 한다면 뭘 다르게?"
    # =========================================================================

    entryQuestion:
      q: "이 프로젝트에서 가장 고민한 부분은?"
      answer: >
        SSE 이벤트와 REST 응답이 공존하는 환경에서 데이터 정합성을 보장하는 것입니다.
        사용자가 REST로 투표를 수정한 직후, 수정 전 상태의 SSE 이벤트가 도착하면
        React Query 캐시가 이전 상태로 롤백되는 문제가 있었습니다.
        이걸 해결하기 위해 2단계 타임스탬프 검증을 설계했고,
        이후에 SSE 연결이 끊기는 구간의 이벤트 유실 문제까지 확장해서
        재연결 시점에 REST로 갭을 복구하는 하이브리드 전략을 만들었습니다.

    branches:
      # ── Branch A: SSE + REST race condition ───────────────────────────────
      - id: "sse-rest-race-condition"
        trigger: "면접관이 'race condition', '타임스탬프'를 더 물어볼 때"
        questions:
          # ── A1 ────────────────────────────────────────────────────────────
          - id: "A1"
            q: "1단계 검증만으로 왜 부족한가요?"
            answer: >
              shouldProcessEvent()에서 캐시의 lastUpdatedAt과 이벤트의 타임스탬프를 비교하는 것이 1단계입니다.
              여기서 "이 이벤트는 최신이다"라고 통과시켰는데,
              setQueryData() 콜백이 실행되기 전에 다른 REST 응답이 먼저 캐시를 업데이트할 수 있습니다.
              JavaScript의 마이크로태스크 큐에서 비동기 작업이 끼어들 수 있기 때문입니다.
              그래서 setQueryData() 콜백 내부에서 콜백 시점의 최신 캐시 값과 한 번 더 비교합니다.
              이 두 시점의 차이를 인식한 것이 핵심입니다.

          # ── A2 ────────────────────────────────────────────────────────────
          - id: "A2"
            q: "setQueryData 콜백 내부에서 재검증한다는 게 구체적으로?"
            answer: >
              setQueryData()에 함수를 넘기면 React Query가 콜백을 호출할 때
              현재 캐시의 최신 값을 인자로 줍니다.
              이 인자의 lastUpdatedAt과 들어온 이벤트의 lastUpdatedAt을 다시 비교해서,
              여전히 이벤트가 최신이면 업데이트하고, 아니면 기존 값을 그대로 반환합니다.
              1단계에서 통과했더라도 2단계에서 걸러질 수 있는 구조입니다.
              이렇게 하면 shouldProcessEvent()와 setQueryData() 사이에
              어떤 업데이트가 끼어들어도 안전합니다.

          # ── A3 ────────────────────────────────────────────────────────────
          - id: "A3"
            q: "이 패턴을 4개 핸들러에 어떻게 일관 적용했나요?"
            answer: >
              useVoteEventHandler, useParticipantEventHandler, useRoomInfoEventHandler,
              useVotePaperEventHandler 네 개의 훅이 각각 도메인별 SSE 이벤트를 처리합니다.
              모든 핸들러가 같은 구조를 따릅니다 — shouldProcessEvent()로 1단계 필터링,
              setQueryData() 콜백 내부에서 2단계 재검증.
              타임스탬프 비교 유틸리티인 isNewerOrEqual()을 공통 함수로 분리해서
              비교 로직이 한 곳에서 관리됩니다.

      # ── Branch B: 연결 갭 복구 ────────────────────────────────────────────
      - id: "connection-gap-recovery"
        trigger: "면접관이 '탭 전환', '연결 끊김', '재연결'을 더 물어볼 때"
        questions:
          # ── B1 ────────────────────────────────────────────────────────────
          - id: "B1"
            q: "탭 전환 시 어떤 문제가 있었나요?"
            answer: >
              @microsoft/fetch-event-source는 기본적으로 탭이 비활성 상태가 되면 SSE 연결을 끊고,
              다시 활성화되면 재연결합니다. 백그라운드 리소스 절약을 위한 라이브러리의 의도된 동작입니다.
              문제는 연결이 끊겨 있는 동안 서버에서 발생한 이벤트가 유실된다는 점입니다.
              예를 들어 투표 진행 중 방장이 탭을 전환했다가 돌아오면,
              그 사이 발생한 투표 결과를 받지 못해 현황판이 업데이트되지 않습니다.

          # ── B2 ────────────────────────────────────────────────────────────
          - id: "B2"
            q: "refetchOnWindowFocus로 안 한 이유는?"
            answer: >
              refetchOnWindowFocus는 탭이 보일 때마다 모든 stale 쿼리를 refetch합니다.
              SSE 연결이 실제로 끊겼는지 아닌지 모르는 상태에서 그냥 탭이 보였으니까 요청하는 거죠.
              반면 fetchEventSource의 onopen 콜백은 실제로 연결이 끊겼다가 다시 열렸을 때만 발동합니다.
              연결 상태를 실제로 아는 쪽이 트리거해야 정확합니다.
              SSE가 안 끊겼으면 refetch할 이유가 없고, 끊겼으면 반드시 해야 하는데,
              refetchOnWindowFocus는 이 구분을 할 수 없습니다.
              커넥션 관리와 캐시 관리의 책임이 다른 계층에 있다는 판단입니다.

          # ── B3 ────────────────────────────────────────────────────────────
          - id: "B3"
            q: "openWhenHidden이나 Last-Event-ID는 검토 안 했나요?"
            answer: >
              둘 다 검토했습니다.
              openWhenHidden은 1줄 수정으로 갭 자체를 없앨 수 있지만,
              모바일 브라우저는 백그라운드 탭의 네트워크를 throttle하거나 kill할 수 있어서
              보장이 안 됩니다. 불필요한 리소스 낭비도 있고요.
              Last-Event-ID는 SSE 표준에서 제공하는 가장 robust한 방식이지만,
              서버가 이벤트 ID를 기록하고 replay하는 기능을 구현해야 합니다.
              프론트엔드만으로 완결할 수 없어서 현 시점에서는 채택하지 않았고,
              이상적으로는 서버 팀과 협의해서 도입하고 싶은 방식입니다.

      # ── Branch C: 상태 관리 판단 ──────────────────────────────────────────
      - id: "state-management-decision"
        trigger: "면접관이 '상태 관리', 'Zustand', 'Redux'를 더 물어볼 때"
        questions:
          # ── C1 ────────────────────────────────────────────────────────────
          - id: "C1"
            q: "왜 Zustand/Redux를 안 썼나요?"
            answer: >
              이 앱의 상태는 거의 전부가 서버 데이터입니다.
              회의실 정보, 참여자 목록, 투표 목록, 투표 용지 — 전부 서버에서 옵니다.
              서버 상태를 별도 store에 복제하면 "React Query 캐시와 store 중 어디가 최신인가"라는
              새로운 동기화 문제가 생깁니다.
              SSE 이벤트가 오면 queryClient.setQueryData()로 캐시를 직접 수정하고,
              UI가 자동으로 반영되는 구조입니다.
              "서버 데이터가 현재 어디에 있는가"라는 질문에 항상 "React Query 캐시"라고 답할 수 있는
              단일 소스 구조를 유지하고 싶었습니다.

          # ── C2 ────────────────────────────────────────────────────────────
          - id: "C2"
            q: "React Query 캐시만으로 부족한 경우는 없었나요?"
            answer: >
              컴포넌트 로컬 상태가 필요한 곳은 있었습니다.
              다이얼로그 열림/닫힘, 투표 선택 옵션 같은 순수 UI 상태는 useState로 관리합니다.
              이건 서버 데이터가 아니라 화면 상호작용 상태이기 때문에
              React Query 캐시에 넣을 이유가 없습니다.
              서버 데이터와 UI 상태의 경계가 명확했기 때문에
              별도 store 없이도 구조가 유지됐습니다.

          # ── C3 ────────────────────────────────────────────────────────────
          - id: "C3"
            q: "그럼 Zustand 같은 라이브러리는 언제 필요한 건가요?"
            answer: >
              서버 데이터와 UI 상태의 경계가 흐려질 때 필요해집니다.
              예를 들어 서버에서 받은 목록을 사용자가 드래그로 재정렬하고,
              아직 저장하지 않은 상태에서 다른 컴포넌트가 그 순서를 참조해야 하는 경우입니다.
              이건 서버 데이터도 아니고 단일 컴포넌트 로컬 상태도 아닌,
              여러 컴포넌트가 공유하는 클라이언트 파생 상태입니다.
              useState로는 prop drilling이 깊어지고, React Query 캐시에 넣기엔 서버와 동기화되지 않은 값이라
              서로 다른 컴포넌트가 참조하는 공유 상태 저장소가 필요해집니다.
              또 다른 예로는 멀티스텝 폼처럼 여러 페이지에 걸쳐 입력값을 유지해야 하는 경우,
              테마·사이드바 접힘 같은 앱 전역 UI 설정,
              또는 실시간 협업 에디터처럼 서버 데이터와 로컬 편집이 동시에 존재하는 경우가 있습니다.
              이 프로젝트에서는 그런 경우가 없었기 때문에 도입하지 않은 것이고,
              필요한 상황이라면 당연히 써야 합니다.

      # ── Branch D: 회고 ────────────────────────────────────────────────────
      - id: "retrospective"
        trigger: "면접관이 '회고', '아쉬운 점'을 물어볼 때"
        questions:
          # ── D1 ────────────────────────────────────────────────────────────
          - id: "D1"
            q: "다시 한다면 뭘 다르게?"
            answer: >
              SSE 이벤트 핸들러의 타임스탬프 검증 로직이 4개 핸들러에 패턴으로 반복되고 있습니다.
              구조는 동일한데 도메인별로 비교 필드와 캐시 키가 다릅니다.
              제네릭한 createEventHandler 팩토리를 만들어서
              타임스탬프 비교 로직을 한 곳에서 관리하고,
              도메인별 차이만 설정으로 주입하는 구조를 만들었을 것 같습니다.
              또한 현재는 SSE 연결을 RoomDetailPage에서만 마운트하는데,
              회의실 목록 페이지에서도 실시간 상태를 보여주려면
              연결 관리를 페이지 밖으로 올려야 합니다.
              이 확장을 고려하면 SSE 커넥션 매니저를 Context 레벨로 분리하는 것이 맞았을 겁니다.

    # =========================================================================
    # Ownership
    # =========================================================================
    ownership:
      - "2단계 타임스탬프 검증 설계 — shouldProcessEvent() + setQueryData() 콜백 내부 재검증"
      - "4개 이벤트 핸들러에 일관된 정합성 검증 패턴 적용"
      - "fetch-event-source의 visibility 기반 연결 관리 동작을 파악하고 onopen 재연결 감지 설계"
      - "refetchOnWindowFocus 대신 커넥션 계층에서 캐시 복구를 트리거하는 구조 판단"
      - "React Query 캐시를 단일 소스로 유지하는 상태 관리 전략 설계"
      - "Discriminated Union + exhaustive switch로 SSE 이벤트 누락을 컴파일 타임에 검출"
      - "Symbol 기반 인증 상태 분리 (NOT_AUTHENTICATED vs VERIFYING)"

    # =========================================================================
    # Technical Deep Dives — 세부 참고 자료
    # =========================================================================
    technicalDeepDives:
      # ── Deep Dive 1 ──────────────────────────────────────────────────────────
      - title: "2단계 타임스탬프 검증의 두 시점"
        summary: |
          핵심은 shouldProcessEvent()와 setQueryData() 콜백 사이에 시간 갭이 있다는 것이다.
          이 갭에서 다른 REST 응답이 캐시를 업데이트할 수 있다.
        steps:
          - title: "1단계 — shouldProcessEvent()"
            insight: |
              queryClient.getQueryData()로 현재 캐시 값을 읽고,
              캐시의 lastUpdatedAt과 이벤트의 lastUpdatedAt을 비교한다.
              이벤트가 오래됐으면 여기서 즉시 무시한다.
              대부분의 stale 이벤트는 이 단계에서 걸러진다.

          - title: "1~2단계 사이의 갭"
            insight: |
              shouldProcessEvent()를 통과한 뒤, setQueryData()의 콜백이 실행되기 전에
              React Query의 다른 mutation이나 invalidation이 캐시를 업데이트할 수 있다.
              예: 사용자가 REST로 투표를 수정 → onSuccess에서 캐시 업데이트 →
              직후 수정 전 상태의 SSE 이벤트가 1단계를 통과 → 2단계에서 걸림.

          - title: "2단계 — setQueryData() 콜백 내부"
            insight: |
              setQueryData((old) => { ... })의 콜백이 실행되는 시점에
              old는 그 순간의 최신 캐시 값이다.
              이 old의 lastUpdatedAt과 이벤트를 다시 비교한다.
              1단계 시점과 다른 값일 수 있기 때문에 이 재검증이 필요하다.

      # ── Deep Dive 2 ──────────────────────────────────────────────────────────
      - title: "fetch-event-source의 visibility 기반 연결 관리"
        summary: |
          @microsoft/fetch-event-source는 기본적으로 openWhenHidden: false다.
          내부적으로 Page Visibility API를 사용하여 탭이 hidden이 되면 연결을 끊고,
          visible이 되면 재연결한다.
          이 동작을 이용하여 onopen에서 초기 연결과 재연결을 구분하고,
          재연결 시에만 캐시를 invalidate하는 전략을 설계했다.
        steps:
          - title: "hasConnectedBefore 플래그"
            insight: |
              useEffect 내부에서 let hasConnectedBefore = false를 선언한다.
              onopen 콜백에서 hasConnectedBefore가 true이면 재연결이므로
              onReconnect() 콜백을 호출한다. 호출 후 true로 설정.
              초기 연결에서는 onReconnect()가 호출되지 않아 불필요한 refetch가 없다.

          - title: "refetchOnWindowFocus와의 차이"
            insight: |
              refetchOnWindowFocus는 visibilitychange 이벤트에 반응하여
              탭이 보일 때마다 모든 stale 쿼리를 refetch한다.
              SSE 연결이 유지됐더라도 refetch가 발생한다.
              onopen 기반 접근은 실제로 연결이 끊겼다가 다시 열렸을 때만 반응하므로
              불필요한 요청이 없다.

    # =========================================================================
    # 검토한 대안
    # =========================================================================
    alternativesConsidered:
      - approach: "shouldProcessEvent() 1단계 검증만 적용"
        whyNotViable: >
          shouldProcessEvent()를 통과한 뒤 setQueryData() 콜백이 실행되기 전에
          다른 REST 응답이 캐시를 업데이트할 수 있다.
          1단계만으로는 이 갭 동안의 race condition을 방어할 수 없다.

      - approach: "refetchOnWindowFocus: true로 갭 복구"
        whyNotViable: >
          SSE 연결이 실제로 끊겼는지 아닌지 모르는 상태에서
          탭이 보일 때마다 모든 stale 쿼리를 refetch한다.
          커넥션 상태를 아는 계층(fetchEventSource)이 트리거해야 정확하다.
          연결이 안 끊겼으면 refetch 불필요, 끊겼으면 반드시 필요한데
          refetchOnWindowFocus는 이 구분을 할 수 없다.

      - approach: "openWhenHidden: true로 백그라운드에서도 연결 유지"
        whyNotViable: >
          모바일 브라우저는 백그라운드 탭의 네트워크를 throttle하거나 kill할 수 있어
          연결 유지가 보장되지 않는다. 불필요한 리소스 낭비도 발생한다.

      - approach: "SSE Last-Event-ID 기반 서버 replay"
        whyNotViable: >
          SSE 표준에서 제공하는 가장 robust한 방식이지만,
          서버가 이벤트 ID를 기록하고 replay하는 기능을 구현해야 한다.
          프론트엔드만으로 완결할 수 없어 현 시점에서는 채택하지 않았다.

      - approach: "서버 상태를 Zustand/Redux store에 복제"
        whyNotViable: >
          React Query 캐시와 store 중 어디가 최신인지라는
          새로운 동기화 문제가 발생한다.
          SSE 이벤트로 캐시를 직접 조작하는 구조에서는
          캐시가 유일한 진실의 원천이 되는 것이 자연스럽다.

