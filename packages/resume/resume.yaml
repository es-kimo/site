      - "TypeScript"
      - "D3"
    oneLiner: "태블릿 환경에서 줌·드래그·정밀측정 간 터치 충돌을 해소한 심전도(ECG) 그래프 측정 도구"
    responsibilities:
      - "태블릿 환경에 맞는 심전도 측정 인터랙션 설계 및 구현"
      - "터치 제스처 충돌 해소를 위한 상태·이벤트 구조 재설계"
    keyContributions:
      - title: "터치 의도를 즉시 판정하지 않는 지연 판별 설계"
        problem: "데스크톱에서는 마우스와 키보드로 줌과 측정을 구분할 수 있었지만, 태블릿에서는 줌·측정·정밀측정이 모두 한 손가락 터치였습니다. 터치 시작만으로는 사용자의 의도를 알 수 없었습니다."
        action: "터치 시작 시 의도를 즉시 결정하지 않고, 후속 이벤트에서 홀드 시간(800ms)·이동량·터치 수를 기준으로 상태를 전이하는 지연 판별 방식을 설계했습니다."
        result: "단일 터치 입력에서도 줌·측정·정밀측정 의도를 높은 정확도로 구분할 수 있게 되어, 오작동을 줄였습니다."
        ownershipEvidence:
          - "시간 × 이동량 기반 지연 판별 구조 설계"
          - "임계값 튜닝을 통한 판별 정확도 조정"
      - title: "공유 제어 상태로 인터랙션 구간을 트랜잭션처럼 격리"
        problem: "줌 레이어와 측정 레이어가 같은 pointer 이벤트를 동시에 수신하는 구조에서, 한쪽이 활성인 동안 다른 쪽이 반응하면 화면이 의도치 않게 움직이거나 측정이 끊기는 문제가 있었습니다."
        action: "5개 상태(Ruler, Zoom, PreciseMeasurement, ButtonDragging, RulerOff)를 갖는 Ref 기반 공유 제어 상태를 도입하고, 줌·측정 레이어 양쪽이 이 상태를 읽어 자기 동작의 실행 여부를 결정하도록 전환했습니다. 드래그처럼 짧은 행동은 진입 시 이전 상태를 저장하고 종료 시 복원하는 트랜잭션 방식으로 격리했습니다."
        result: "복수의 인터랙션 레이어가 같은 이벤트를 경쟁하는 환경에서도, 각 행동 구간이 서로를 침범하지 않는 구조를 만들었습니다."
        ownershipEvidence:
          - "PC의 단방향 상태 알림을 양방향 상태 공유 구조로 재설계"
          - "5개 상태 × 4개 핸들러의 전이 규칙 정의"
          - "드래그 구간의 상태 저장·복원을 통한 트랜잭션 격리 설계"
      - title: "플랫폼별 인터랙션 정책을 분리한 드래그 훅 설계"
        problem: "태블릿 특성 상 드래그 가능한 요소가 늘어나면서, 드래그 자체의 메커니즘과 '드래그 중 다른 인터랙션을 어떻게 제어할 것인가'라는 플랫폼별(데스크톱·태블릿) 정책이 뒤섞일 수 있었습니다."
        action: "드래그 메커니즘(이벤트 등록·해제, isDragging 상태)만 다루는 base 훅과, 모바일 고유 정책(공유 상태 전환, 드래그 가능 여부 판단)을 주입하는 mobile 래퍼로 분리했습니다."
        result: "데스크톱 환경에서는 base 훅을 그대로, 태블릿에서는 mobile 래퍼를 통해 동일한 드래그 요소를 다른 인터랙션 정책으로 동작시킬 수 있는 구조를 만들었습니다."
        ownershipEvidence:
          - "드래그 메커니즘과 인터랙션 정책의 관심사 분리 설계"
          - "정책 주입 인터페이스(checkDraggable, 핸들러 래핑) 설계"
    metrics:
      - label: "시나리오 검증"
        value: "iPad / Android Tablet 기준 20개 이상 인터랙션 케이스 수동 검증"
