          - "디자인 토큰과 아이콘 변경 사항을 사람이 확인하고 코드로 옮기는 운영 방식"

        highlights:
          - title: "확장 가능한 컴포넌트 API와 스타일링 기준 정립"
            summary: >
              컴포넌트마다 달랐던 API와 스타일링 방식을 정리하고,
              기존 컴포넌트의 사용 편의성을 유지하면서 제품에서 필요한 부분을
              조합할 수 있는 컴포넌트 구조와 컨벤션을 정의했습니다.

          - title: "디자인 자산 동기화 자동화"
            summary: >
              디자인 변경 사항을 자동으로 검사하고 코드 생성,
              변경 내역 작성, PR 생성까지 이어지는 갱신 파이프라인을 구축했습니다.
            impact:
              - "아이콘 코드 반영률 65% → 100%"
              - "Figma 아이콘 376개 중 미반영 131개 일괄 해소"
              - "평균 90일이던 갱신 주기를 수일 수준으로 단축"
              - "12작업일 투자, 반복 작업 절감 기준 1년 이내 구축 비용 회수"

      - id: "ecg-ruler-tablet"
        name: "ECG-GRAPH Tablet Interaction"
        period: "2025.02 ~ 2025.05"
        emphasis: "primary"
        role: "Frontend Engineer"
        scope: "태블릿 환경 지원 및 터치 인터랙션 설계"

        techStack:
          - "React"
          - "TypeScript"
          - "D3"
          - "SVG"
          - "Playwright"

        oneLiner: >
          의료진이 태블릿에서 심전도 그래프를 확대·이동하면서
          원하는 구간을 정확하게 측정할 수 있도록 터치 상호작용을 설계

        constraints:
          - "확대·이동·측정·정밀측정·도구 이동이 모두 동일한 손가락 입력에서 시작"
          - "화면 좌표가 실제 ECG의 시간 및 전압 값으로 변환되므로 측정 정확도가 중요"
          - "브라우저 기본 스크롤 및 핀치 제스처와 제품 인터랙션 간 충돌 가능"

        highlights:
          - title: "터치 입력 의도 판별"
            summary: >
              터치 유지 시간, 이동 거리, 손가락 수를 기준으로
              확대·이동·측정 의도를 구분하고,
              한 동작이 시작된 동안 다른 기능이 같은 입력을 처리하지 않도록
              기능 간 상태 흐름을 설계했습니다.

          - title: "측정 정확도 및 인터랙션 검증"
            summary: >
              화면 좌표와 실제 시간·전압 값 사이의 좌표 변환 및 상태 로직은
              단위 테스트로 검증하고, 실제 터치 입력에 따른 상태 전이와
              UI 변화는 브라우저 통합 테스트로 검증했습니다.
            impact:
              - "핀치 확대 중 측정점 생성 등 기능 간 입력 충돌 방지"
              - "모바일 환경의 스크롤 간섭과 측정 인터랙션 충돌 검증"

      - id: "migration-impact-analysis"
        name: "디자인 시스템 마이그레이션 영향도 분석 도구"
        period: "2026.03"
        emphasis: "secondary"
        role: "Development Lead"
        scope: "AI 기반 코드 분석 기준 설계 및 리뷰 도구 개발"

        techStack:
          - "TypeScript"
          - "Node.js"
          - "LLM"

        oneLiner: >
          여러 제품의 디자인 시스템 사용처를 AI로 분석하고
          변경 위험과 제품 맥락을 코드 리뷰에서 바로 확인할 수 있도록 만든 도구

        constraints:
          - "공통 컴포넌트 사용처가 10개 제품에 분산"
          - "진입 경로·노출 조건·변경 위험도는 정적 코드 검색만으로 판단하기 어려움"
          - "정상 화면 흐름만 직접 확인할 경우 오류·권한·시간 초과 등 예외 경로 누락 가능"

        highlights:
          - title: "사람의 판단 기준을 15개 항목으로 구조화"
            summary: >
              사용 위치, 진입 경로, 노출 조건, 제품별 수정 내용,
              변경 위험도 등 리뷰어가 확인하던 기준을 구조화해
              AI가 동일한 형식으로 저장소를 분석하도록 만들었습니다.

          - title: "AI 판단과 코드 검증의 책임 분리"
            summary: >
              맥락 해석과 1차 분류는 AI가 수행하되,
              결과 형식과 허용 값, 중복 여부는 코드로 검증했습니다.
              근거가 부족한 판단은 낮은 확신도로 남겨
              AI 결과와 사람의 최종 판단을 분리했습니다.

          - title: "코드 리뷰와 디자인 QA를 위한 대시보드 제공"
            summary: >
              저장소별 분석 결과를 자동 수집하고 유형, 위험도,
              확인 여부에 따라 탐색할 수 있는 대시보드로 제공했습니다.
            impact:
              - "3일 동안 4개 제품에서 모달 사용 사례 132건 확보"
              - "36건(약 27%)의 예외 상황 전용 사용처를 검토 범위에 포함"
              - "코드 리뷰와 디자인 QA가 동일한 영향도 자료를 활용"

      - id: "mai-sales"
        name: "사내 업무관리 시스템"
        period: "2025.08 ~ 2025.12"
        emphasis: "secondary"
        role: "Frontend Engineer / Scrum Master"
        scope: "대용량 다운로드 구조 개선 및 스프린트 운영"

        techStack:
          - "React"
          - "TypeScript"
          - "TanStack Query"
          - "Zustand"
          - "Zod"
          - "React Hook Form"

        oneLiner: >
          대용량 파일 처리 병목을 스트림 기반으로 개선하고
          자산·매출·거래처 관리 시스템 개발 일정을 조율한 프로젝트

        constraints:
          - "파일 전체가 준비된 뒤 응답하는 기존 구조에서 대용량 요청 실패"
          - "비밀번호를 서버에 전달하지 않는 기존 보안 원칙 유지 필요"
          - "브라우저에서 압축·암호화 후처리를 수행해야 함"

        highlights:
          - title: "대용량 다운로드를 스트림 기반으로 전환"
            summary: >
              서버에서 데이터를 생성되는 대로 전송하고,
              클라이언트에서도 데이터를 메모리에 누적하지 않고
              가능한 환경에서는 즉시 파일로 기록하도록 처리 방식을 변경했습니다.

          - title: "클라이언트 후처리의 메모리 사용량 개선"
            summary: >
              보안 원칙을 유지하기 위해 암호화 후처리는 클라이언트에서 수행하되,
              전체 파일을 메모리에 올리지 않고 스트림 단위로 처리했습니다.
            impact:
              - "100MB ~ 1GB 파일 및 다양한 동시 요청 조건에서 검증"
              - "기존 방식에서 실패하던 대용량 다운로드 완료"
              - "1GB 처리 시 브라우저 메모리 약 1.9GB → 수십 MB"

          - title: "스크럼 운영"
            summary: >
              주간 회의와 스프린트 회고를 운영하며 작업 현황과 이슈를 정리하고,
              개발 일정과 우선순위를 지속적으로 조율했습니다.

      - id: "mai-cs"
        name: "고객지원 시스템"
        period: "2025.07 ~ 2025.08, 2026.02 ~ 2026.03"
        emphasis: "supporting"
        role: "Frontend Engineer / Project Lead"
        scope: "v1.1 개발 리드 및 개발 프로세스 개선"

        techStack:
          - "React"
          - "TypeScript"
          - "TanStack Query"
          - "Zustand"

        oneLiner: >
          고객지원 시스템의 개발 단위와 일정을 관리하고,
          제품 개발 과정에서 반복되는 디자인 시스템 병목을 발견한 프로젝트

        highlights:
          - title: "개발 단위와 일정 관리"
            summary: >
              기획서를 백로그와 티켓으로 나누고 작업 규모와 소요 시간을 산정해
              일정과 우선순위를 관리했습니다.

          - title: "반복되는 디자인 시스템 병목 발견"
            summary: >
              제품 요구사항을 구현할 때마다 디자인 시스템 수정과 재배포가 반복되는
              구조적 문제를 확인했고, 이후 MAIUI 3.0 개편의 문제 정의로 연결했습니다.

openSource:
  - id: "vue-kakao-map-lib"
    name: "vue3-kakao-maps"
    period: "2024.04 ~ 2024.11"
    role: "npm Maintainer"
    scope: "패키징·타입·배포 체계 구축"

    techStack:
      - "Vue"
      - "TypeScript"
      - "Vite"

    oneLiner: >
      카카오맵 API를 Vue 3 컴포넌트로 사용할 수 있도록 만든
      오픈소스 라이브러리

    constraints:
      - "사용자의 Node 및 모듈 해석 환경을 통제할 수 없음"
      - "코드뿐 아니라 빌드 산출물과 타입 선언이 소비자 프로젝트에서 정상적으로 해석돼야 함"

    highlights:
      - title: "소비자 환경을 고려한 패키지 구조 개선"
        summary: >
          CommonJS 환경에서 타입과 서브패스를 정상적으로 해석하지 못하는 문제를 해결하기 위해
          코드와 타입 진입점을 환경별로 재구성하고 타입 선언 생성 방식을 개선했습니다.

      - title: "배포 전 검증 자동화"
        summary: >
          내부 개발 환경에서의 정상 동작만 확인하는 대신,
          빌드 산출물과 소비자 환경에서의 모듈 해석 문제를
          배포 전에 확인할 수 있도록 검증 과정을 자동화했습니다.

      - title: "오픈소스 운영"
        summary: >
          npm 메인테이너로 릴리스를 담당하고 실제 사용자 피드백과
          외부 사용자가 제안한 문서 PR을 검토·반영했습니다.

    links:
      repo: "https://github.com/beautiful-source/vue3-kakao-maps"

