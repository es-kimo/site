      - title: "SSE 재연결 시 유실 구간 복구"
        summary: >
          실제 연결 중단이 발생한 경우에만 서버 데이터를 다시 조회해
          불필요한 요청을 줄이면서 실시간 데이터 정합성을 유지했습니다.

    links:
      repo: "https://github.com/vottega/client"

