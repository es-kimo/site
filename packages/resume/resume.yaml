featuredProjects:
  - id: "ecg-ruler-tablet"
    name: "ECG-GRAPH Ruler for Tablet"
    company: "메디컬에이아이"
    period: "2025.02 ~ 2025.04"
    scope: "tablet adaptation"
    role: "Frontend Developer"
    featured: true
    techStack:
      - "React"
      - "TypeScript"
      - "D3"
    oneLiner: "심전도 그래프에 특정 지점을 표시하여 시간·진폭 간격을 측정하는 태블릿용 도구"
    responsibilities:
      - "데스크톱 중심 기능의 태블릿 환경 재설계"
      - "터치 기반 제스처 판별 로직 설계"
      - "측정 UI 및 캘리퍼 기능 구현"
    keyContributions:
      - problem: "데스크톱에서는 ruler가 활성 상태를 알리기만 하면 zoom이 알아서 피했지만, 태블릿에서는 모든 입력이 같은 터치이므로 ruler 쪽에서도 zoom 상태를 인지하고 스스로 동작을 멈춰야 했습니다. 상태의 소유권을 어느 쪽이 가질 것인지 재정의해야 하는 문제였습니다."
        action: "Ruler · Zoom · PreciseMeasurement · ButtonDragging · RulerOff 5개 상태를 가진 공유 상태 머신을 도입하고, ruler와 zoom 양쪽이 이 상태를 읽고 쓰는 구조로 전환했습니다. 터치 시작 시점에 의도를 판별하는 대신, 후속 이벤트의 시간(800ms 홀드)·이동량·터치 수에 따라 상태를 전이하는 지연 판별 방식을 적용했습니다."
        result: "5가지 동작이 하나의 터치 입력 위에서 간섭 없이 동작하는 구조를 만들었고, 파형 근방 터치 범위 제한으로 오입력을 차단했습니다."
        ownershipEvidence:
          - "PC의 단방향 상태 알림을 양방향 상태 공유 구조로 재설계"
          - "5개 상태 × 4개 핸들러의 전이 규칙 정의"
          - "시간 × 이동량 기반 지연 판별 구조 설계 및 임계값 튜닝"
      - problem: "d3-zoom의 filter로 이벤트를 차단해도, 정밀 측정 중 손가락의 미세한 움직임이 d3 내부 transform에 누적되어 측정 종료 후 화면 위치가 밀리는 문제가 있었습니다. React의 상태 사이클과 d3의 내부 상태가 동기화되지 않는 것이 원인이었습니다."
        action: "zoom start 시점에 transform을 저장하고, zoom 이벤트에서 정밀 측정 상태이면 적용을 건너뛴 뒤, end 시점에 저장된 transform으로 d3 내부 상태를 복원하는 2-phase 롤백을 적용했습니다. 정밀 측정 여부를 d3의 이벤트 콜백 안에서 동기적으로 읽기 위해 useState 대신 useRef로 양쪽 시스템을 연결했습니다."
        result: "d3-zoom의 관성 스크롤·핀치 처리를 그대로 활용하면서, 정밀 측정과의 충돌을 제거했습니다."
        ownershipEvidence:
          - "d3 내부 transform 오염 현상 발견 및 원인 분석"
          - "2-phase transform 롤백 설계"
          - "useRef 기반 React–d3 상태 동기화"
      - problem: "캘리퍼, 버튼 그룹 등 드래그 가능한 요소가 늘어나면서, 요소마다 document 레벨 이벤트 등록·해제, 드래그 중 다른 인터랙션 차단, 종료 후 이전 상태 복원을 반복 구현해야 했습니다."
        action: "드래그 라이프사이클을 공통 훅으로 추출하고, 모바일 래퍼가 드래그 시작 시 현재 상태를 저장한 뒤 ButtonDragging으로 전환하고, 종료 시 저장된 상태로 복원하도록 설계했습니다. 새 드래그 요소는 비즈니스 로직만 전달하면 상태 관리가 자동으로 처리됩니다."
        result: "이후 추가된 드래그 요소들이 기존 핸들러 수정 없이 상태 머신에 통합되었습니다."
        ownershipEvidence:
          - "드래그 라이프사이클 훅 레이어링 (base → mobile wrapper)"
          - "상태 저장·복원을 통한 드래그 중 인터랙션 격리"
    metrics:
      - label: "시나리오 검증"
        value: "iPad / Android Tablet 20건+"
      - label: "오입력 리포트"
